<script data-part="away">
// ── The pond keeps living while you are away. You come back as nature. ──
// A page cannot run when it is closed, so on return the pond catches up: the time you were gone is
// simulated (up to a cap) with the same rules, and a short report says what happened.
(function () {
  'use strict';
  const el = G.el, $ = G.$, esc = G.escapeHtml;
  const MAX_AWAY = 32 * 150;          // at most 150 generations of catching up (about 80 minutes of pond time)
  const MIN_AWAY = 25;                // seconds; shorter than this is just looking away
  let job = null, hiddenAt = 0;
  G.catching = false;

  G.startCatchUp = function (seconds, label) {
    const W = G.W;
    if (!W || W.title || W.extinct || !(seconds >= MIN_AWAY)) return false;
    const target = Math.min(seconds, MAX_AWAY);
    job = {
      target: target, done: 0, real: seconds, label: label || 'away',
      gen0: W.gen, sp0: new Set(W.species.map(function (s) { return s.id; })), disc0: W.discLog.length, fos0: W.fossils.length,
      pop0: W.cre.length, fit0: W.hist.length ? W.hist[W.hist.length - 1].avg : 0, t0: performance.now(), skipped: false,
    };
    G.catching = true;
    G.prevMode = G.mode;
    G.mode = 'catchup';
    G.closeMenu && G.closeMenu();
    G.closeModal && G.closeModal();
    const o = el('div', 'overlay', '', $('ui')); o.id = 'catchup'; o.style.zIndex = 20;
    o.innerHTML = '<div class="glass sheet" style="width:min(460px,100%);align-items:center;text-align:center"><h2 style="font-size:18px;letter-spacing:.2em;margin-bottom:8px">THE POND KEPT GOING</h2>' +
      '<small id="cuLine" style="margin-bottom:12px"></small><div class="meter" style="width:100%;height:10px"><i id="cuBar" style="width:0;background:linear-gradient(90deg,#ff7eb6,#f6d365,#33d6a6)"></i></div>' +
      '<div class="ilabel" id="cuGen" style="margin:10px 0 12px">generation ' + W.gen + '</div><button class="btn sm" id="cuSkip">SKIP AHEAD</button></div>';
    job.el = o;
    $('cuLine').textContent = 'You were away ' + fmtTime(seconds) + '. Life went on without you…';
    $('cuSkip').onclick = function () { job.skipped = true; };
    return true;
  };

  function fmtTime(s) {
    s = Math.round(s);
    if (s < 90) return s + ' seconds';
    if (s < 5400) return Math.round(s / 60) + ' minutes';
    if (s < 172800) return (s / 3600).toFixed(1).replace('.0', '') + ' hours';
    return Math.round(s / 86400) + ' days';
  }

  function finish() {
    const W = G.W, j = job;
    job = null;
    G.catching = false;
    G.mode = G.prevMode || 'play';
    if (j.el) j.el.remove();
    const gens = W.gen - j.gen0;
    const last = W.hist.length ? W.hist[W.hist.length - 1] : null;
    if (W.extinct) { G.emit('extinct'); return; }
    if (gens < 1) return;
    G.showAwayReport({
      gens: gens, alive: W.cre.length, fitness: last ? last.avg : 0,
      newSpecies: W.species.filter(function (s) { return !j.sp0.has(s.id); }).length,
      diedOut: W.species.filter(function (s) { return s.extinct && s.diedGen > j.gen0; }).length,
      discoveries: W.discLog.slice(j.disc0).map(function (d) { return d.text; }),
      capped: j.target < j.real, capGens: Math.round(MAX_AWAY / 32),
    });
  }

  // what happened while the player was away (made here, or by the server)
  G.showAwayReport = function (r) {
    const W = G.W;
    const gens = r.gens, newSp = r.newSpecies || 0, died = r.diedOut || 0, found = r.discoveries || [];
    const rows = [
      '<b>' + gens + '</b> generations passed' + (r.capped ? ' <small>(the pond catches up at most ' + (r.capGens || 150) + ' generations)</small>' : ''),
      '<b>' + (r.alive !== undefined ? r.alive : W.cre.length) + '</b> creatures alive' + (r.fitness ? ' · average fitness <b>' + (+r.fitness).toFixed(2) + '</b>' : ''),
      newSp ? '<b>' + newSp + '</b> new species appeared' : 'No new species appeared',
      died ? '<b>' + died + '</b> species died out' : 'No species died out',
    ];
    const disc = found.length ? '<div class="ilabel" style="margin-top:12px">Evolution invented</div>' + found.slice(0, 5).map(function (t) { return '<div style="margin:4px 0;color:var(--gold)">' + esc(t) + '</div>'; }).join('') : '';
    const o = el('div', 'overlay', '', $('ui')); o.id = 'awayReport'; o.style.zIndex = 15;
    o.innerHTML = '<div class="glass sheet" style="width:min(480px,100%);align-items:flex-start"><h2 style="font-size:17px;letter-spacing:.2em;margin-bottom:10px">WHILE YOU WERE AWAY</h2>' + rows.map(function (r) { return '<div style="margin:5px 0;line-height:1.4">' + r + '</div>'; }).join('') + disc +
      '<div style="margin-top:14px;align-self:center"><button class="btn big" id="arGo">SEE THE POND</button></div></div>';
    $('arGo').onclick = function () { o.remove(); G.sfx && G.sfx('click'); G.hint('nature', 'You are nature: change the world and see how life answers.', 6000); };
    G.log && G.log('sel', 'Away', gens + ' generations passed while you were gone.');
    G.emit('catchup-done', gens);
  };

  G.addSystem({
    name: 'away',
    update: function () {
      if (!job) return;
      const W = G.W;
      const t0 = performance.now();
      // spend about 16 ms of every frame catching up
      while (job.done < job.target && !job.skipped && !W.extinct && performance.now() - t0 < 16) {
        for (let i = 0; i < 20 && job.done < job.target; i++) { G.step(0.1); job.done += 0.1; }
      }
      const bar = $('cuBar'), gen = $('cuGen');
      if (bar) bar.style.width = Math.min(100, 100 * job.done / job.target).toFixed(1) + '%';
      if (gen) gen.textContent = 'generation ' + W.gen + ' · ' + W.cre.length + ' alive';
      if (job.done >= job.target || job.skipped || W.extinct) finish();
    },
  });

  // leaving the tab and coming back counts as being away too
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { hiddenAt = Date.now(); if (G.mode === 'play') G.saveNow && G.saveNow(); return; }
    if (hiddenAt && G.mode === 'play' && !G.paused) {
      const s = (Date.now() - hiddenAt) / 1000;
      hiddenAt = 0;
      if (s >= MIN_AWAY) G.startCatchUp(s);
    }
    hiddenAt = 0;
  });
})();

</script>
<script data-part="tree">
// ── The family tree, made to be read: cards with pictures and plain words instead of a diagram ──
(function () {
  'use strict';
  const PAL = G.PAL, el = G.el, $ = G.$, esc = G.escapeHtml, UI = G.ui;
  const FOOD = ['gold', 'lime', 'green', 'blue', 'violet', 'pink'];
  const PARTS = ['mouth', 'fin', 'spike', 'armour plate', 'eye', 'lamp', 'poison gland', 'tail', 'cilia fringe'];

  function plural(n, w) { return n + ' ' + (n === 1 ? w : /s$|x$/.test(w) ? w + 'es' : /y$/.test(w) ? w.slice(0, -1) + 'ies' : w + 's'); }

  /** What is different in body b compared with body a, in plain words (most important first). */
  G.genomeDiff = function (a, b) {
    const pa = G.derive(a), pb = G.derive(b), out = [];
    const push = function (t, good) { out.push({ t: t, good: good !== false }); };
    // the body first: what grew, what was lost, what it turned into
    const ka = G.form.kind(a.f), kb = G.form.kind(b.f);
    if (ka.kind !== kb.kind) push('became a ' + kb.kind.toLowerCase() + ' (was a ' + ka.kind.toLowerCase() + ')');
    const fd = G.form.diff(a.f, b.f);
    for (let i = 0; i < fd.length; i++) push(fd[i][0], fd[i][1]);
    // organs
    const orgs = function (g) { const o = {}; for (let i = 0; i < g.p.length; i++) o[g.p[i].k] = 1; return o; };
    const oa = orgs(a), ob = orgs(b);
    for (const k in ob) if (!oa[k]) { const o = G.organOf(+k); if (o) push('new organ: ' + o.name); }
    for (const k in oa) if (!ob[k]) { const o = G.organOf(+k); if (o) push('lost its ' + o.name, false); }
    // size, speed
    if (Math.abs(pb.r - pa.r) / pa.r > 0.12) push((pb.r > pa.r ? 'bigger: ' : 'smaller: ') + pa.r.toFixed(0) + ' → ' + pb.r.toFixed(0), true);
    if (Math.abs(pb.speed - pa.speed) / pa.speed > 0.15) push((pb.speed > pa.speed ? 'faster: ' : 'slower: ') + pa.speed.toFixed(0) + ' → ' + pb.speed.toFixed(0), pb.speed > pa.speed);
    // way of life
    if (pb.photo > 0.3 && pa.photo <= 0.3) push('now feeds on light');
    for (let i = 0; i < 6; i++) {
      if (pb.dig[i] >= 0.5 && pa.dig[i] < 0.5) push('can now eat ' + FOOD[i] + ' food');
      else if (pb.dig[i] < 0.2 && pa.dig[i] >= 0.2) push('can no longer eat ' + FOOD[i] + ' food', false);
    }
    const RES = ['heat', 'cold', 'poison'];
    for (let i = 0; i < 3; i++) if (pb.res[i] >= 0.5 && pa.res[i] < 0.5) push(RES[i] + '-proof');
    // brain
    if (b.h !== a.h) push(b.h > a.h ? 'brain grew: ' + plural(b.h, 'thinking cell') : 'a simpler brain', b.h > a.h);
    else if (Math.abs(b.w.length - a.w.length) >= 3) push('brain rewired: ' + a.w.length + ' → ' + b.w.length + ' wires', b.w.length > a.w.length);
    let dh = Math.abs(pb.hue - pa.hue); if (dh > 180) dh = 360 - dh;
    if (dh > 45) push('changed colour');
    return out.slice(0, 5);
  };

  function picture(parent, genome, id, px, skin) {
    const cv = el('canvas', '', '', parent);
    cv.width = cv.height = px * 2; cv.style.cssText = 'width:' + px + 'px;height:' + px + 'px;display:block;margin:0 auto';
    const pv = G.preview(genome, id || 3); pv.ang = -0.35; pv.glow = 0.7;
    G.drawFit(cv.getContext('2d'), pv, px, px, px * 0.88, 1.2);
    return cv;
  }
  function card(row, genome, id, title, sub, diffs, mark, skin) {
    const c = el('div', '', '', row);
    c.style.cssText = 'flex:0 0 172px;padding:10px;border-radius:14px;background:rgba(7,18,31,.5);border:1px solid ' + (mark ? 'var(--gold)' : 'rgba(207,232,255,.14)') + ';' + (mark ? 'box-shadow:0 0 16px rgba(246,211,101,.25)' : '');
    picture(c, genome, id, 104, skin);
    el('div', '', '<b style="font-size:13px">' + esc(title) + '</b>', c).style.cssText = 'text-align:center;margin-top:4px;line-height:1.25';
    el('div', '', esc(sub), c).style.cssText = 'text-align:center;font-size:11px;color:rgba(207,232,255,.65);margin-bottom:6px';
    if (diffs === null) el('div', '', 'where this line begins', c).style.cssText = 'font-size:12px;color:rgba(207,232,255,.6);text-align:center';
    else if (!diffs.length) el('div', '', 'only small changes', c).style.cssText = 'font-size:12px;color:rgba(207,232,255,.6);text-align:center';
    else diffs.forEach(function (d) { const w = d.good && G.whyLine ? G.whyLine(d.t) : ''; el('div', '', (d.good ? '+ ' : '− ') + esc(d.t) + (w ? '<div style="font-size:10.5px;line-height:1.25;color:rgba(207,232,255,.6);margin:0 0 3px 10px">' + esc(w) + '</div>' : ''), c).style.cssText = 'font-size:12.5px;line-height:1.35;color:' + (d.good ? 'var(--algae)' : 'var(--rose)'); });
    return c;
  }
  function arrow(row) { el('div', '', '→', row).style.cssText = 'flex:none;align-self:center;font-size:22px;color:rgba(207,232,255,.45)'; }
  function heading(root, title, text) {
    el('h3', '', title, root).style.cssText = 'font-size:13px;letter-spacing:.16em;color:var(--gold);margin:6px 0 2px';
    el('div', '', text, root).style.cssText = 'font-size:12.5px;color:rgba(207,232,255,.75);margin-bottom:8px';
  }
  function strip(root) { const r = el('div', '', '', root); r.style.cssText = 'display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:10px;align-items:stretch'; return r; }

  function renderAncestry(root) {
    root.innerHTML = '';
    const c = G.R.sel;
    if (!c) { el('div', 'empty', 'Click a creature in the pond first, then open the tree to see where it came from.', root); return; }
    // the deep past: species by species (this is remembered even after closing the game)
    const chainS = [];
    let s = G.speciesById(c.sp), guard = 0;
    if (!s) { const fv = G.features(c.g); let bd = 1e9; G.W.species.forEach(function (q) { if (q.extinct || !q.rep) return; const d = G.fdist(fv, q.fv); if (d < bd) { bd = d; s = q; } }); }
    while (s && s.rep && guard++ < 8) { chainS.push(s); s = s.parent ? G.speciesById(s.parent) : null; }
    chainS.reverse();
    if (chainS.length) {
      heading(root, 'ITS DEEP PAST, SPECIES BY SPECIES', chainS.length > 1 ? 'From the oldest kind this creature descends from, to its own kind today. Green is gained, pink is lost.' : 'Its kind has not split from another yet.');
      const row = strip(root);
      chainS.forEach(function (sp, i) {
        if (i) arrow(row);
        card(row, sp.rep, sp.id, sp.name, 'appeared in generation ' + sp.born + (sp.extinct ? ' · died out' : ' · ' + sp.n + ' alive'), i === 0 ? null : G.genomeDiff(chainS[i - 1].rep, sp.rep), i === chainS.length - 1, sp.skin);
      });
    }
    // the recent family: birth by birth
    const chain = [{ g: c.g, gen: c.born, id: c.id, mate: c.mate }];
    let p = c.dad;
    while (p && chain.length < 8) { chain.push({ g: p.g, gen: p.gen, id: p.id, mate: p.mate }); p = p.up; }
    chain.reverse();
    heading(root, 'ITS RECENT FAMILY, BIRTH BY BIRTH', chain.length > 1 ? 'Each card is one birth: a child, and how it differs from its mother.' : 'This creature has no recorded parents (a founder, or the pond was reloaded since).');
    const row2 = strip(root);
    chain.forEach(function (a, i) {
      if (i) arrow(row2);
      card(row2, a.g, a.id, '#' + a.id + (i === chain.length - 1 ? ' (chosen)' : ''), 'born in generation ' + a.gen + (a.mate && a.mate.id ? ' · two parents' : ''), i === 0 ? null : G.genomeDiff(chain[i - 1].g, a.g), i === chain.length - 1);
    });
    // then and now, at a glance
    const first = chainS.length > 1 ? chainS[0].rep : chain.length > 1 ? chain[0].g : null;
    if (first) {
      const all = G.genomeDiff(first, c.g);
      heading(root, 'THEN AND NOW', all.length ? 'Everything that separates this creature from the start of its line:' : 'It is still very like the start of its line.');
      if (all.length) el('div', '', all.map(function (d) { return '<span style="display:inline-block;margin:0 8px 6px 0;padding:5px 10px;border-radius:999px;font-size:12.5px;border:1px solid ' + (d.good ? 'rgba(51,214,166,.6)' : 'rgba(255,126,182,.6)') + '">' + (d.good ? '+ ' : '− ') + esc(d.t) + '</span>'; }).join(''), root);
    }
  }

  function renderSpecies(root) {
    root.innerHTML = '';
    const W = G.W;
    const all = W.species.filter(function (s) { return s.rep; });
    if (all.length < 2) { el('div', 'empty', 'The tree grows as kinds split apart. Give it a few generations.', root); return; }
    const byId = {}; all.forEach(function (s) { byId[s.id] = s; });
    const kids = {}; const roots = [];
    all.forEach(function (s) { if (s.parent && byId[s.parent]) (kids[s.parent] || (kids[s.parent] = [])).push(s); else roots.push(s); });
    const alive = function (s) { return !s.extinct && s.n > 0; };
    // a kind is shown if it is alive, or if a living kind descends from it
    const keep = {};
    const mark = function (s) { let k = alive(s); (kids[s.id] || []).forEach(function (ch) { if (mark(ch)) k = true; }); keep[s.id] = k; return k; };
    roots.forEach(mark);
    const showDead = !!UI.treeDead;
    const gone = all.filter(function (s) { return !keep[s.id]; }).length;
    const g1 = Math.max(W.gen, 2);
    heading(root, 'THE KINDS ALIVE NOW, AND WHERE THEY CAME FROM', 'Each row is a kind of creature. A row set in under another descends from it. The bar shows when it lived, from generation 1 to ' + g1 + '.');
    const list = el('div', '', '', root);
    const rowOf = function (s, depth) {
      if (!keep[s.id] && !showDead) return;
      const r = el('div', '', '', list);
      const live = alive(s);
      r.style.cssText = 'display:flex;align-items:center;gap:10px;padding:5px 6px;margin-left:' + Math.min(depth, 7) * 22 + 'px;border-left:' + (depth ? '2px solid rgba(207,232,255,.18)' : '0') + ';' + (live ? '' : 'opacity:.55');
      const pic = el('div', '', '', r); pic.style.cssText = 'flex:none;width:46px';
      picture(pic, s.rep, s.id, 46, s.skin);
      const txt = el('div', '', '<b style="font-size:13px">' + esc(s.name) + '</b><div style="font-size:11px;color:rgba(207,232,255,.65)">' + (live ? '<b style="color:var(--algae)">' + s.n + ' alive</b> · since generation ' + s.born : 'lived generation ' + s.born + ' to ' + (s.diedGen || s.lastGen) + ' · most ever ' + s.peak) + '</div>', r);
      txt.style.cssText = 'flex:0 0 230px;min-width:0';
      const lane = el('div', '', '', r); lane.style.cssText = 'flex:1;height:12px;border-radius:6px;background:rgba(7,18,31,.55);position:relative;min-width:60px';
      const end = live ? g1 : (s.diedGen || s.lastGen);
      const bar = el('div', '', '', lane);
      bar.style.cssText = 'position:absolute;top:0;bottom:0;border-radius:6px;left:' + (100 * (s.born - 1) / (g1 - 1)).toFixed(1) + '%;width:' + Math.max(1.5, 100 * (end - s.born) / (g1 - 1)).toFixed(1) + '%;background:' + G.hsl(G.derive(s.rep).hue, 75, live ? 60 : 45, 1);
      (kids[s.id] || []).slice().sort(function (a, b) { return a.born - b.born; }).forEach(function (ch) { rowOf(ch, depth + 1); });
    };
    roots.sort(function (a, b) { return a.born - b.born; }).forEach(function (s) { rowOf(s, 0); });
    if (gone) {
      const b = el('button', 'btn sm', showDead ? 'HIDE THE KINDS THAT DIED OUT' : 'SHOW THE ' + gone + ' THAT DIED OUT WITHOUT DESCENDANTS', root);
      b.style.marginTop = '10px';
      b.onclick = function () { UI.treeDead = !showDead; G.sfx('click'); renderSpecies(root); };
    }
  }

  G.openTree = function () {
    const W = G.W; if (!W) return;
    let tab = G.R.sel && !G.R.sel.dead ? 'anc' : 'sp';
    G.closeModal(true);
    const o = el('div', 'overlay', '', $('ui')); o.id = 'ov-tree';
    o.innerHTML = '<div class="glass sheet" style="width:min(1040px,100%)"><div class="top"><h2>FAMILY TREE</h2><div class="tabs" style="min-width:min(360px,100%)" id="trTabs"><button data-t="anc">THIS CREATURE</button><button data-t="sp">ALL KINDS</button></div><button class="btn sm" id="trClose">' + G.ICON.close + 'CLOSE</button></div><div class="body" id="trBody"></div></div>';
    o.addEventListener('pointerdown', function (e) { if (e.target === o) G.closeModal(); });
    UI.modal = 'tree'; UI.modalEl = o;
    G.closePop();
    if (window.PXS && PXS.pause) { try { PXS.pause({ music: false }); } catch (e) { console.error(e); } }
    const draw = function () {
      const tabs = $('trTabs').children;
      for (let i = 0; i < tabs.length; i++) tabs[i].classList.toggle('on', tabs[i].dataset.t === tab);
      if (tab === 'anc') renderAncestry($('trBody')); else renderSpecies($('trBody'));
    };
    $('trClose').onclick = function () { G.closeModal(); };
    const tabs = $('trTabs').children;
    for (let i = 0; i < tabs.length; i++) tabs[i].onclick = function () { tab = this.dataset.t; G.sfx('click'); draw(); };
    draw();
    G.sfx('click');
  };
})();

<script data-part="audio">
// ── Sound: soft plops, bubbles and chimes, all from Plaxzy's sound library ──
(function () {
  'use strict';
  const SND = {
    click: 'ui/click',
    birth: 'toon/pop',

      });
      z.life0 = num(q.life0, 30, 400, 120); z.age = num(q.age, 0, 1e6, 10); z.health = num(q.health, 0, 2, 1); z.kids = num(q.kids, 0, 999, 0);
      z.made = num(q.made, 0, 1e7, 0); z.fed = num(q.fed, 0, 1e7, 0); z.hurt = num(q.hurt, 0, 1e9, 0); z.deaths = num(q.deaths, 0, 1e6, 0); z.vis = num(q.vis, 0, 1e9, 0); z.ate = num(q.ate, 0, 1e6, 0); z.hit = num(q.hit, 0, 100, 0); z.born = num(q.born, 0, 1e6, W.gen);
      if (Array.isArray(q.ev)) z.ev = q.ev.filter(function (e) { return e && typeof e.t === 'string'; }).slice(-8).map(function (e) { return { g: num(e.g, 0, 1e6, 0), t: e.t.slice(0, 60) }; });
    });
    d.cre.forEach(function (r) {
      if (!Array.isArray(r) || r.length < 7) return;
      const g = G.unpackGenome(r[0]); if (!g) return;
      const c = G.makeCreature(g, null, null, []);
      c.x = num(r[1], 5, W.ww - 5, W.ww / 2); c.y = num(r[2], 5, W.wh - 5, W.wh / 2); c.px = c.x; c.py = c.y;
      c.E = num(r[3], 1, c.ph.Emax, c.ph.Emax * 0.5); c.age = Math.floor(num(r[4], 0, 20, 0)); c.sp = Math.floor(num(r[5], 0, 1e6, 0)); c.born = Math.floor(num(r[6], 0, 1e6, 1));
      c.snap = G.snapOf(c);
      W.cre.push(c);
    });
    // the species counts are rebuilt at the next autumn; until then count the survivors
    W.species.forEach(function (s) { s.n = W.cre.filter(function (c) { return c.sp === s.id; }).length; if (s.n > 0) s.extinct = false; });
    if (!W.cre.length && !W.fossils.length) G.startPond({});
  };

  // ask for the save as soon as the page is up; the title screen shows at once
  G.addSystem({
    name: 'save',
    init: function () {
      if (!hasSave() || typeof Plaxzy.save.load !== 'function') return;
      try {
        Plaxzy.save.load(function (d) {
          try {
            if (G.validSave(d)) { G.pendingSave = d; if (G.showContinue) G.showContinue(true); }
          } catch (e) { console.error(e); }
        });
      } catch (e) { console.error(e); }
    },
  });
})();

</script>
<script data-part="host">
// ── Talking to the page around the game (and through it, to the Primordia server) ──
// The game runs in a sandbox with no network, so it asks the host page with postMessage:
//   game → host   { __primordia: 1, id, op, payload }      op: hello | ai.thing | ai.ideas | pond.get | pond.put | pond.del
//   host → game   { __primordia: 1, id, ok, data, error }  the answer to one request
//   host → game   { __primordia: 1, op: 'host', caps: { ai: true, pond: true } }   "I can do these"
// With no host (a plain file, or a site that does not know this) nothing happens and the game plays alone.
(function () {
  'use strict';
  const H = G.host = { ready: false, caps: {}, pending: {}, nextId: 1 };

  H.call = function (op, payload, ms) {
    return new Promise(function (resolve, reject) {
      if (!window.parent || window.parent === window) { reject(new Error('no host')); return; }
      const id = H.nextId++;
      const timer = setTimeout(function () { delete H.pending[id]; reject(new Error('timeout')); }, ms || 20000);
      H.pending[id] = { resolve: resolve, reject: reject, timer: timer };
      try { window.parent.postMessage({ __primordia: 1, id: id, op: op, payload: payload }, '*'); }
      catch (e) { clearTimeout(timer); delete H.pending[id]; reject(e); }
    });
  };

  window.addEventListener('message', function (e) {
    const d = e.data;
    if (!d || d.__primordia !== 1 || e.source !== window.parent) return;
    if (d.op === 'host') {
      if (typeof d.fuel === 'number') G.ai.fuel = Math.max(0, Math.floor(d.fuel));
      const first = !H.ready;            // a host may announce itself more than once
      H.ready = true; H.caps = d.caps || {};
      if (H.caps.ai) G.ai.provider = 'server';
      if (first) {
        G.emit('host-ready', H.caps);
        if (H.caps.ai) H.call('ai.models', {}).then(function (r) {
          if (!r || !Array.isArray(r.models)) return;
          G.ai.models = r.models.filter(function (m) { return m && typeof m.id === 'string'; }).slice(0, 12).map(function (m) { return { id: m.id.slice(0, 60), label: String(m.label || m.id).slice(0, 40) }; });
          if (!G.ai.labelOf(G.ai.model)) G.ai.model = typeof r.default === 'string' && G.ai.labelOf(r.default) ? r.default : '';
          G.ai.sound = !!r.sound;
          G.ai.paintOn = !!r.paint;
        }).catch(function () { /* an older host: one model, no choice */ });
      }
      return;
    }
    if (d.op === 'fuel') { G.ai.fuel = typeof d.fuel === 'number' ? Math.max(0, Math.floor(d.fuel)) : null; return; }     // the host topped it up (or lifted the limit)
    const p = H.pending[d.id];
    if (!p) return;
    clearTimeout(p.timer); delete H.pending[d.id];
    if (d.ok) p.resolve(d.data); else { const er = new Error(d.error || 'failed'); er.refused = d.error === 'refused'; er.code = d.error; p.reject(er); }
  });

  // ── the pond lives on the server too ──
  let pushTimer = 0;
  function push() {
    pushTimer = 0;
    if (!H.ready || !H.caps.pond || G.mode !== 'play' || !G.collectSave) return;
    const save = G.collectSave();
    if (save) H.call('pond.put', { save: save }).catch(function () { /* the local save still has it */ });
  }
  G.on('saved', function () {
    if (!H.ready || !H.caps.pond || pushTimer) return;
    pushTimer = setTimeout(push, 3000);     // a burst of saves is one request
  });
  // tell the host each time fuel is spent, so it can charge for it
  G.on('fuel', function (left, kind) { try { window.parent.postMessage({ __primordia: 1, op: 'fuel.spent', kind: kind, left: left }, '*'); } catch (e) { /* no host */ } });
  G.on('save-erased', function () { if (H.ready && H.caps.pond) H.call('pond.del', {}).catch(function () {}); });

  G.on('host-ready', function (caps) {
    if (!caps.pond) return;
    // ask for the pond as it is now; if the server's is newer than this browser's, carry on from that one
    H.call('pond.get', {}, 45000).then(function (res) {
      if (!res || !res.save || G.mode === 'play' || G.mode === 'catchup') return;
      const local = G.pendingSave;
      if (!G.validSave(res.save)) return;
      if (local && (+local.at || 0) > (+res.save.at || 0) + 1000) return;
      G.pendingSave = res.save;
      G.pendingReport = res.report && res.report.gens > 0 ? res.report : null;
      if (G.showContinue) G.showContinue(true);
    }).catch(function () { /* offline: the browser's own save is used */ });
  });

  // a sound of its own for each thing: asked for once, kept, and played through Plaxzy Sound
  const SND = {};
  G.thingSound = function (name) {
    const k = String(name || '').toLowerCase();
    if (SND[k] === 'ready' && window.PXS) { try { PXS.play('thing:' + k, { volume: 0.9 }); } catch (e) { console.error(e); } return true; }
    return false;
  };
  G.on('placed', function (info) {
    const k = String(info.name || '').toLowerCase();
    if (G.thingSound(k) || SND[k] || !H.ready || !G.ai.sound || !window.PXS || !G.ai.allow('sound')) return;
    SND[k] = 'asked';
    H.call('ai.sound', { word: info.name, note: info.note }, 90000).then(function (r) {
      G.ai.tally('sound', r && r.source, r && r.usd);
      if (!r || !r.sound || !/^audio\/(mpeg|wav|ogg|mp4)$/.test(r.sound.mime) || typeof r.sound.b64 !== 'string' || r.sound.b64.length > 600000) { SND[k] = 'none'; return; }
      const def = {}; def['thing:' + k] = 'data:' + r.sound.mime + ';base64,' + r.sound.b64;
      try { PXS.define(def); SND[k] = 'ready'; G.thingSound(k); } catch (e) { SND[k] = 'none'; console.error(e); }
    }, function () { SND[k] = 'none'; });
  });

  G.addSystem({
    name: 'host',
    init: function () {
      if (window.parent && window.parent !== window) {
        const hello = function (n) {
          if (H.ready || n > 4) return;
          try { window.parent.postMessage({ __primordia: 1, op: 'hello' }, '*'); } catch (e) { /* no host */ }
          setTimeout(function () { hello(n + 1); }, 1200);
        };
        hello(0);
      }
    },
  });
})();

</script>
<script data-part="boot">
// ── Boot: the title screen over a drifting pond ──
(function () {
  'use strict';
  G.addSystem({
    name: 'boot',
    init: function () {
      if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) { G.touch = true; document.body.classList.add('touch'); }
      G.startTitlePond();
      G.buildTitle();
      if (G.pendingSave && G.showContinue) G.showContinue(true);
    },
  });
  G.on('resize', function () { if (G.W) { G.W.ww = G.view.ww; G.W.wh = G.view.wh; } });
})();

</script>
