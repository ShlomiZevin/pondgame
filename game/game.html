<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Primordia</title>
<style>
:root { --deep:#07121f; --teal:#0f3b4a; --algae:#33d6a6; --gold:#f6d365; --rose:#ff7eb6; --violet:#a78bfa; --frost:#cfe8ff; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--deep); color: var(--frost);
  font-family: system-ui, "Trebuchet MS", "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; }
canvas#pond { position: fixed; left: 0; top: 0; width: 100%; height: 100%; touch-action: none; display: block; cursor: crosshair; }
canvas#pond.placing { cursor: copy; }
#ui { position: fixed; inset: 0; pointer-events: none; }
#ui > * { pointer-events: auto; }
.hide { display: none !important; }
body.touch .kbd { display: none !important; }

.glass { background: linear-gradient(160deg, rgba(15,59,74,.66), rgba(7,18,31,.58)); border: 1px solid rgba(207,232,255,.22);
  border-radius: 18px; box-shadow: 0 10px 34px rgba(0,0,0,.38), inset 0 0 24px rgba(51,214,166,.10), inset 0 1px 0 rgba(255,255,255,.13);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: var(--frost); }
h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: .04em; text-shadow: 0 0 14px rgba(51,214,166,.55); }
small { color: rgba(207,232,255,.7); }

/* buttons: glass pills that squish */
.btn { appearance: none; border: 1px solid rgba(207,232,255,.28); color: var(--frost); cursor: pointer; font: 700 12px system-ui, "Trebuchet MS", sans-serif;
  letter-spacing: .1em; text-transform: uppercase; min-height: 44px; min-width: 44px; padding: 8px 14px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  background: linear-gradient(180deg, rgba(207,232,255,.14), rgba(15,59,74,.55)); box-shadow: inset 0 0 14px rgba(51,214,166,.16), 0 4px 14px rgba(0,0,0,.3);
  transition: transform .12s, box-shadow .2s, background .2s, border-color .2s; }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn:hover { border-color: rgba(51,214,166,.8); box-shadow: inset 0 0 18px rgba(51,214,166,.35), 0 0 16px rgba(51,214,166,.25); }
.btn:active { transform: scale(.92, .88); }
.btn.on { border-color: var(--gold); box-shadow: inset 0 0 18px rgba(246,211,101,.35), 0 0 16px rgba(246,211,101,.25); }
.btn.big { min-height: 58px; padding: 12px 34px; font-size: 16px; letter-spacing: .22em; }
.btn.rose { border-color: rgba(255,126,182,.6); }
.btn.sm { min-height: 36px; padding: 5px 12px; font-size: 11px; }
.btn.pulse { animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { box-shadow: inset 0 0 14px rgba(51,214,166,.2), 0 0 0 rgba(51,214,166,0); } 50% { box-shadow: inset 0 0 26px rgba(51,214,166,.5), 0 0 28px rgba(51,214,166,.4); } }

/* season bar: the algorithm, always on screen */
#season { position: fixed; left: 14px; top: 14px; width: min(400px, calc(100vw - 340px)); padding: 10px 12px 12px; }
#season .gen { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; gap: 8px; }
#season .gen b { font-size: 12px; letter-spacing: .2em; color: var(--gold); text-shadow: 0 0 10px rgba(246,211,101,.5); }
#season .gen span { font-size: 11px; color: rgba(207,232,255,.65); }
.segs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.seg { border-radius: 12px; padding: 6px 4px 5px; text-align: center; border: 1px solid rgba(207,232,255,.12); background: rgba(7,18,31,.35); opacity: .5; transition: opacity .4s, background .4s, box-shadow .4s, border-color .4s, transform .4s; }
.seg svg { width: 22px; height: 22px; display: block; margin: 0 auto 2px; }
.seg b { display: block; font-size: 10px; letter-spacing: .14em; }
.seg small { display: block; font-size: 9px; letter-spacing: .04em; margin-top: 1px; }
.seg.on { opacity: 1; transform: translateY(-1px); }
.seg[data-s="0"].on { border-color: var(--rose); box-shadow: 0 0 18px rgba(255,126,182,.4), inset 0 0 14px rgba(255,126,182,.25); color: #ffd3e6; }
.seg[data-s="1"].on { border-color: var(--algae); box-shadow: 0 0 18px rgba(51,214,166,.4), inset 0 0 14px rgba(51,214,166,.25); color: #c8ffee; }
.seg[data-s="2"].on { border-color: var(--gold); box-shadow: 0 0 18px rgba(246,211,101,.4), inset 0 0 14px rgba(246,211,101,.25); color: #fff0c2; }
.seg[data-s="3"].on { border-color: var(--frost); box-shadow: 0 0 18px rgba(207,232,255,.4), inset 0 0 14px rgba(207,232,255,.25); color: #fff; }
.seg.done { opacity: .75; }
#season .cap { margin-top: 9px; line-height: 1.3; }
#season .cap b { display: block; font-size: 12px; letter-spacing: .12em; }
#season .cap span { font-size: 12px; color: rgba(207,232,255,.82); }
#season .count { margin-top: 5px; font-size: 11px; color: var(--gold); letter-spacing: .04em; min-height: 14px; }
#season .prog { height: 3px; background: rgba(207,232,255,.12); border-radius: 3px; margin-top: 8px; overflow: hidden; }
#season .prog i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--rose), var(--gold), var(--algae)); border-radius: 3px; }

/* evolution panel: a microscope slide */
#panel { position: fixed; right: 14px; top: 14px; width: 306px; padding: 0; overflow: hidden; }
#panel .phead { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 11px 14px; background: none; border: 0; color: var(--frost); cursor: pointer; font: 700 12px system-ui, sans-serif; letter-spacing: .2em; text-transform: uppercase; min-height: 44px; }
#panel .phead span { color: var(--gold); letter-spacing: .04em; font-weight: 600; margin: 0 8px 0 10px; font-size: 11px; white-space: nowrap; }
#panel .phead svg { width: 18px; height: 18px; transition: transform .3s; }
#panel.min .phead svg { transform: rotate(180deg); }
#panel.min .pbody { display: none; }
#panel .pbody { padding: 0 14px 14px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
.stats div { background: rgba(7,18,31,.4); border-radius: 10px; padding: 6px 4px; text-align: center; border: 1px solid rgba(207,232,255,.1); }
.stats b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(51,214,166,.4); }
.stats small { font-size: 9px; letter-spacing: .1em; text-transform: uppercase; }
.tabs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
#gtabs button { flex: 1 1 30%; min-width: 0; }
.tabs button { flex: 1; min-height: 32px; border-radius: 999px; border: 1px solid rgba(207,232,255,.18); background: rgba(7,18,31,.4); color: rgba(207,232,255,.75); font: 700 9.5px system-ui, sans-serif; letter-spacing: .1em; cursor: pointer; }
.tabs button.on { border-color: var(--algae); color: #fff; box-shadow: 0 0 12px rgba(51,214,166,.35); }
#graph { width: 100%; height: 92px; display: block; border-radius: 10px; background: rgba(7,18,31,.4); }
.gnote { font-size: 10.5px; color: rgba(207,232,255,.7); margin: 5px 0 8px; min-height: 26px; line-height: 1.3; }
.log { height: 108px; overflow-y: auto; font-size: 11.5px; line-height: 1.35; padding-right: 4px; scrollbar-width: thin; }
.log div { padding: 3px 0; border-bottom: 1px solid rgba(207,232,255,.07); }
.log div.mut b { color: var(--rose); } .log div.disc b { color: var(--gold); } .log div.sel b { color: var(--frost); } .log div.sp b { color: var(--violet); }
.log small { margin-right: 5px; }

/* toolbar */
#toolbar { position: fixed; left: 14px; bottom: 14px; display: flex; gap: 8px; align-items: center; padding: 7px; border-radius: 999px; max-width: calc(100vw - 28px); }
#toolbar .btn { padding: 8px 13px; }
#toolbar .btn.ic { padding: 8px; }
.pop { position: fixed; left: 14px; bottom: 82px; width: min(340px, calc(100vw - 28px)); padding: 14px; z-index: 5; max-height: calc(100vh - 100px); overflow-y: auto; }
.pop h3 { font-size: 12px; letter-spacing: .2em; margin-bottom: 10px; color: var(--gold); }
.pop .row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
.pop label { flex: 0 0 96px; font-size: 11px; letter-spacing: .06em; }
.pop .val { flex: 0 0 38px; text-align: right; font-size: 11px; color: var(--gold); font-variant-numeric: tabular-nums; }
.pop .desc { font-size: 10.5px; color: rgba(207,232,255,.65); margin: -3px 0 6px; }
input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 34px; background: transparent; touch-action: pan-x; min-width: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 6px; background: linear-gradient(90deg, rgba(51,214,166,.7), rgba(246,211,101,.7)); box-shadow: 0 0 10px rgba(51,214,166,.3); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; margin-top: -9px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, var(--frost) 55%, var(--algae)); border: 0; box-shadow: 0 0 14px rgba(207,232,255,.7); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 6px; background: linear-gradient(90deg, rgba(51,214,166,.7), rgba(246,211,101,.7)); }
input[type=range]::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: var(--frost); border: 0; box-shadow: 0 0 14px rgba(207,232,255,.7); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { border: 1px solid rgba(207,232,255,.25); background: rgba(7,18,31,.4); color: var(--frost); border-radius: 999px; padding: 7px 12px; font-size: 12px; cursor: pointer; min-height: 36px; }
.chip:hover { border-color: var(--algae); }
.disasters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 8px; }
.disasters .btn { padding: 8px 6px; font-size: 10.5px; letter-spacing: .06em; }
.speeds { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.speeds .btn { padding: 8px 4px; }
input[type=text] { width: 100%; min-height: 46px; border-radius: 14px; border: 1px solid rgba(207,232,255,.3); background: rgba(7,18,31,.55); color: var(--frost); padding: 0 14px; font: 600 16px system-ui, "Trebuchet MS", sans-serif; outline: none; -webkit-user-select: text; user-select: text; }
input[type=text]:focus { border-color: var(--algae); box-shadow: 0 0 16px rgba(51,214,166,.35); }
.thingcard { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(7,18,31,.45); border: 1px solid rgba(207,232,255,.14); font-size: 12.5px; line-height: 1.4; }
.thingcard b { color: var(--gold); }
.tog { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.tog .btn { flex: 0 0 auto; min-width: 92px; }

/* inspector */
#inspector, #zcard { position: fixed; right: 14px; bottom: 14px; width: 306px; padding: 12px; }
#zcard .ihead { display: flex; gap: 10px; align-items: center; }
#zcard .ihead b { display: block; font-size: 14px; }
#zcard .ihead small { font-size: 11px; display: block; line-height: 1.3; }
#zcard .x { margin-left: auto; align-self: flex-start; background: none; border: 0; color: var(--frost); cursor: pointer; width: 36px; height: 36px; flex: none; }
#inspector .ihead { display: flex; gap: 10px; align-items: center; }
#inspector .ihead canvas { width: 104px; height: 104px; flex: none; margin: -6px 0 0 -8px; }
#inspector .ihead b { display: block; font-size: 14px; }
#inspector .ihead small { font-size: 11px; display: block; line-height: 1.3; }
#inspector .x { margin-left: auto; align-self: flex-start; background: none; border: 0; color: var(--frost); cursor: pointer; width: 36px; height: 36px; flex: none; }
#istrip { width: 100%; height: 40px; display: block; margin: 8px 0 4px; }
#ibrain { width: 100%; height: 92px; display: block; border-radius: 10px; background: rgba(7,18,31,.4); }
.irows { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; font-size: 11.5px; margin: 6px 0; }
.irows .meter { grid-column: span 2; }
.meter { height: 7px; background: rgba(7,18,31,.55); border-radius: 7px; overflow: hidden; margin-top: 3px; }
.meter i { display: block; height: 100%; border-radius: 7px; }
.imut { font-size: 11px; color: var(--rose); margin-top: 4px; line-height: 1.35; }
.ilabel { font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: rgba(207,232,255,.6); margin-top: 6px; }

/* banners, hints */
#versus { position: fixed; left: 14px; top: 236px; width: min(300px, calc(100vw - 28px)); padding: 9px 12px; z-index: 2; }
@media (max-width: 720px) { #versus { top: auto; bottom: 78px; left: 7px; width: min(280px, calc(100vw - 14px)); } }
@media (max-height: 560px) { #versus { display: none; } }
#zoom { position: fixed; left: 14px; bottom: 84px; display: flex; flex-direction: column; gap: 6px; padding: 6px; border-radius: 999px; z-index: 2; }
#zoom .btn { min-width: 40px; min-height: 40px; padding: 0; font-size: 18px; letter-spacing: 0; }
@media (max-width: 720px) { #zoom { left: auto; bottom: auto; top: 232px; right: 7px; } }
#inspector { max-height: calc(100vh - 28px); overflow-y: auto; }
/* the card: every mark in two columns; the reasons, the energy and the history fold away behind one button */
.imarks { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; margin: 8px 0 4px; }
.imarks .mcell { display: grid; grid-template-columns: 58px 1fr 26px; gap: 6px; align-items: center; font-size: 11.5px; }
.imarks .bar { height: 6px; border-radius: 3px; background: rgba(207,232,255,.14); overflow: hidden; } .imarks .bar i { display: block; height: 100%; border-radius: 3px; background: var(--gold); }
.imarks b { text-align: right; color: var(--gold); font-size: 11.5px; }
.iappeal { font-size: 12px; margin: 2px 0 2px; } .iappeal b { color: var(--gold); font-size: 13.5px; } .iappeal i { font-style: normal; opacity: .65; font-size: 10.5px; }
#inspector:not(.why) #ifit small:not(:first-of-type), #inspector:not(.why) #imut, #inspector:not(.why) .irows { display: none; }
#isub { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
#isub.open { display: block; }
#inspector details { margin-top: 6px; } #inspector summary { cursor: pointer; font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--frost); opacity: .75; padding: 4px 0; }
.igrade { display: grid; grid-template-columns: auto 1fr auto; gap: 3px 8px; align-items: center; font-size: 12px; margin: 6px 0 4px; } .igrade .bar { height: 7px; border-radius: 4px; background: rgba(207,232,255,.14); overflow: hidden; } .igrade .bar i { display: block; height: 100%; border-radius: 4px; background: var(--gold); } .igrade b { color: var(--gold); }
#ifit small { display: block; opacity: .8; line-height: 1.35; margin-top: 2px; }
#banner { position: fixed; left: 50%; top: 14px; transform: translate(-50%, -140%); padding: 12px 22px; text-align: center; font-weight: 700; letter-spacing: .04em; transition: transform .6s cubic-bezier(.2,.9,.3,1.2); max-width: min(600px, calc(100vw - 28px)); font-size: 14px; line-height: 1.35; z-index: 8; border-color: rgba(246,211,101,.7); box-shadow: 0 0 36px rgba(246,211,101,.35), inset 0 0 24px rgba(246,211,101,.15); }
#banner.show { transform: translate(-50%, 78px); }
#banner:not(.show) { opacity: 0; pointer-events: none; transform: translate(-50%, -220%); }      /* gone when it has nothing to say: its edge used to peek out at the top like a button nobody could read */
#banner small { display: block; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin-bottom: 2px; font-size: 10px; }
#hint { position: fixed; left: 50%; bottom: 84px; transform: translate(-50%, 12px); opacity: 0; padding: 9px 18px; font-size: 13px; text-align: center; max-width: min(520px, calc(100vw - 28px)); transition: opacity .5s, transform .5s; pointer-events: none !important; z-index: 4; }
#hint.show { opacity: 1; transform: translate(-50%, 0); }
#placing { position: fixed; left: 50%; top: 84px; transform: translateX(-50%); padding: 10px 18px; font-size: 13px; z-index: 6; text-align: center; max-width: calc(100vw - 28px); display: flex; gap: 12px; align-items: center; }

/* overlays: title, guide, tree, extinction */
.overlay { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 14px; background: radial-gradient(ellipse at 50% 45%, rgba(7,18,31,.15), rgba(7,18,31,.72)); }
.sheet { width: min(860px, 100%); max-height: calc(100% - 20px); display: flex; flex-direction: column; padding: 16px; overflow: hidden; }
.sheet .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.sheet .top h2 { font-size: 16px; letter-spacing: .24em; }
.sheet .body { overflow-y: auto; flex: 1; min-height: 0; scrollbar-width: thin; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.card { display: flex; gap: 10px; padding: 10px; border-radius: 14px; background: rgba(7,18,31,.45); border: 1px solid rgba(207,232,255,.14); }
.card canvas { width: 112px; height: 112px; flex: none; }
.card b { display: block; font-size: 13px; }
.card p { margin: 3px 0 5px; font-size: 11.5px; line-height: 1.35; color: rgba(207,232,255,.82); }
.card small { display: block; font-size: 10.5px; }
.card .btn { margin-top: 5px; }
.card.dead { opacity: .8; filter: saturate(.55); }
/* the Book of Life: its tabs in one row of their own, and each card with its picture on top and the words under it */
#ov-guide .top { flex-wrap: wrap; }
#ov-guide .top h2 { order: 1; }
#ov-guide #gdClose { order: 2; }
#ov-guide #gdTabs { order: 3; flex: 0 0 100%; min-width: 0 !important; flex-wrap: nowrap; gap: 6px; margin: 2px 0 0; overflow-x: auto; scrollbar-width: none; }
#ov-guide #gdTabs::-webkit-scrollbar { display: none; }
#ov-guide #gdTabs button { flex: 1 1 auto; white-space: nowrap; padding: 0 14px; min-height: 34px; font-size: 10px; }
#ov-guide .cards { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
#ov-guide .card { flex-direction: column; align-items: stretch; gap: 8px; padding: 12px; }
#ov-guide .card > canvas, #ov-guide .card > img, #ov-guide .card > div:first-child:not(:last-child) { align-self: center; }
#ov-guide .card > canvas { width: 132px; height: 132px; }
#ov-guide .card b { font-size: 14px; }
#ov-guide .card p { font-size: 12px; line-height: 1.45; }
#ov-guide .card .btn { width: 100%; margin-top: 8px; }
/* scroll bars in the pond's own look: thin, pale, no arrows, on every panel that scrolls */
.sheet .body, #inspector, #zcard, #gbwin, #rarebox, .log, #panel, .pop { scrollbar-width: thin; scrollbar-color: rgba(207,232,255,.32) transparent; }
.sheet .body::-webkit-scrollbar, #inspector::-webkit-scrollbar, #zcard::-webkit-scrollbar, #gbwin::-webkit-scrollbar, .log::-webkit-scrollbar, #panel::-webkit-scrollbar, .pop::-webkit-scrollbar { width: 8px; height: 8px; }
.sheet .body::-webkit-scrollbar-track, #inspector::-webkit-scrollbar-track, #zcard::-webkit-scrollbar-track, #gbwin::-webkit-scrollbar-track, .log::-webkit-scrollbar-track, #panel::-webkit-scrollbar-track, .pop::-webkit-scrollbar-track { background: transparent; margin: 10px 0; }
.sheet .body::-webkit-scrollbar-thumb, #inspector::-webkit-scrollbar-thumb, #zcard::-webkit-scrollbar-thumb, #gbwin::-webkit-scrollbar-thumb, .log::-webkit-scrollbar-thumb, #panel::-webkit-scrollbar-thumb, .pop::-webkit-scrollbar-thumb { background: rgba(207,232,255,.28); border-radius: 4px; border: 2px solid transparent; background-clip: padding-box; }
.sheet .body::-webkit-scrollbar-thumb:hover, #inspector::-webkit-scrollbar-thumb:hover, #gbwin::-webkit-scrollbar-thumb:hover { background: rgba(246,211,101,.6); background-clip: padding-box; }
.sheet .body::-webkit-scrollbar-button, #inspector::-webkit-scrollbar-button, #zcard::-webkit-scrollbar-button, #gbwin::-webkit-scrollbar-button, .log::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
.sheet .body { padding-right: 4px; }
.empty { padding: 30px; text-align: center; color: rgba(207,232,255,.7); line-height: 1.5; }
#treeCanvas { width: 100%; height: 340px; display: block; border-radius: 12px; background: rgba(7,18,31,.4); }

#title { z-index: 12; flex-direction: column; text-align: center; background: radial-gradient(ellipse at 50% 42%, rgba(7,18,31,.05), rgba(7,18,31,.7) 80%); transition: opacity .9s; }
#title.out { opacity: 0; pointer-events: none !important; }
#title h1 { font-size: clamp(40px, 9vw, 92px); letter-spacing: .26em; padding-left: .26em; font-weight: 300; text-shadow: 0 0 30px rgba(51,214,166,.8), 0 0 70px rgba(51,214,166,.35); animation: breathe 5s ease-in-out infinite; }
@keyframes breathe { 0%,100% { text-shadow: 0 0 26px rgba(51,214,166,.7), 0 0 60px rgba(51,214,166,.25); } 50% { text-shadow: 0 0 40px rgba(51,214,166,1), 0 0 90px rgba(51,214,166,.5); } }
#title .tag { font-size: clamp(13px, 2.4vw, 18px); letter-spacing: .3em; text-transform: uppercase; color: rgba(207,232,255,.85); margin: 8px 0 26px; }
#title .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
#title .nature { margin-top: 18px; font-size: 13px; letter-spacing: .14em; color: var(--gold); text-transform: lowercase; }
.keys { display: grid; grid-template-columns: repeat(4, auto); gap: 8px 16px; margin-top: 24px; padding: 12px 18px; justify-content: center; max-width: calc(100vw - 28px); }
.keys div { display: flex; align-items: center; gap: 8px; font-size: 12px; text-align: left; }

// ── Primordia core: the shared object G, random numbers, events, loop, input ──
(function () {
  'use strict';
  const PAL = {
    deep: '#07121f',
    teal: '#0f3b4a',
    algae: '#33d6a6',
    gold: '#f6d365',
    rose: '#ff7eb6',
    violet: '#a78bfa',
    frost: '#cfe8ff',
  };
  const root = typeof window !== 'undefined' ? window : globalThis;
  const G = root.G = {
    PAL,
    systems: [],
    _on: {},
    mode: 'boot',        // boot | title | play
    paused: false,
    speed: 1,            // 0 pause, 1, 4, 16, 64
    view: { w: 800, h: 600, dpr: 1, scale: 1, base: 1, ww: 2240, wh: 1400, ox: 0, oy: 0 },
    cam: { z: 1.4, x: 1120, y: 700, set: false },
    input: { keys: {}, pressed: {}, ptr: { x: 0, y: 0, down: false, inside: false, wx: 0, wy: 0 }, clicks: [] },
    ui: {},
    ai: {},
    K: {},
  };

  G.on = function (name, fn) { (G._on[name] || (G._on[name] = [])).push(fn); };
  G.emit = function (name, a, b, c) {
    const l = G._on[name];

  };

    G.rand = function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  };

  G.randn = function () { return (G.rand() + G.rand() + G.rand() + G.rand() - 2) * 1.732; };
  G.rr = function (a, b) { return a + (b - a) * G.rand(); };
  G.ri = function (a, b) { return Math.floor(G.rr(a, b + 1)); };

  // ── systems ──

      if (!failed[key]) { failed[key] = 1; console.error('[' + key + ']', err); }

  G.runSystems = function (fn, a) {
    for (let i = 0; i < G.systems.length; i++) runSystem(G.systems[i], fn, a);
  };

  // ── view: the pond is always as tall as 1000 units; width follows the window ──
  G.resize = function () {
    const v = G.view;
    const cv = G.canvas;

    cv.width = Math.floor(W * dpr); cv.height = Math.floor(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';

    const gr = v.grow || 1;                  // the pond grows when it is crowded (57_grow): it is then taller than 1400, and still all of it fits the window
    v.base = H / (1400 * gr);
    v.wh = 1400 * gr;

    G.emit('resize');
  };

  // ── the camera: zoom 1 shows the whole pond; zoom in to watch them closely, drag to move ──
  G.applyCam = function () {
    const v = G.view, c = G.cam;
    c.z = G.clamp(c.z, 1, 6);
    v.scale = v.base * c.z;

    c.x = v.ww * v.scale <= v.w ? v.ww / 2 : G.clamp(c.x, hw, v.ww - hw);
    c.y = v.wh * v.scale <= v.h ? v.wh / 2 : G.clamp(c.y, hh, v.wh - hh);

  };

  // ── input ──
  function toWorld(e) {
    const v = G.view, p = G.input.ptr;
    p.x = e.clientX; p.y = e.clientY;
    p.wx = (e.clientX - v.ox) / v.scale;
    p.wy = (e.clientY - v.oy) / v.scale;
  }
  function typing() {
    const a = document.activeElement;
    return a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT');
  }
  G.initInput = function () {
    const cv = G.canvas, inp = G.input;
    window.addEventListener('keydown', function (e) {
      if (typing()) { if (e.key === 'Escape') G.emit('escape'); return; }
      const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      if (!inp.keys[k]) inp.pressed[k] = true;
      inp.keys[k] = true;
      G.emit('key', k, e);
      if (k === ' ' || k === 'ArrowUp' || k === 'ArrowDown') e.preventDefault();
    });
    window.addEventListener('keyup', function (e) {
      const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      inp.keys[k] = false;
    });
    const touches = new Map();
    let drag = null, pinch = 0;
    cv.addEventListener('pointermove', function (e) {
      if (touches.has(e.pointerId)) touches.set(e.pointerId, { x: e.clientX, y: e.clientY });

        // two fingers: pinch to zoom
        const p = Array.from(touches.values()), d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
        if (pinch > 0 && d > 0) G.zoomAt(d / pinch, (p[0].x + p[1].x) / 2, (p[0].y + p[1].y) / 2);
        pinch = d; if (drag) drag.moved = true;
      } else if (drag && inp.ptr.down) {
        const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
        if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 7) drag.moved = true;
        if (drag.moved && !G.ui.placing && !G.ui.meteor) { G.cam.x -= dx / G.view.scale; G.cam.y -= dy / G.view.scale; G.applyCam(); }
        drag.x = e.clientX; drag.y = e.clientY;
      }
      toWorld(e); inp.ptr.inside = true;
    });
    cv.addEventListener('wheel', function (e) { e.preventDefault(); if (G.mode === 'play') G.zoomAt(Math.exp(-e.deltaY * 0.0016), e.clientX, e.clientY); }, { passive: false });
    cv.addEventListener('pointerleave', function () { inp.ptr.inside = false; });
    cv.addEventListener('pointerdown', function (e) {
      toWorld(e); inp.ptr.down = true; inp.ptr.inside = true;
      if (e.pointerType === 'touch') G.touch = true;
      touches.set(e.pointerId, { x: e.clientX, y: e.clientY }); pinch = 0;
      drag = { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, moved: touches.size > 1, touch: e.pointerType === 'touch' };

      toWorld(e);
      // a press that did not move is a click on the pond
      if (drag && !drag.moved && touches.size <= 1) {
        inp.clicks.push({ x: inp.ptr.wx, y: inp.ptr.wy, sx: e.clientX, sy: e.clientY, touch: drag.touch });
        G.emit('pond-click', inp.clicks[inp.clicks.length - 1]);
      }
    });

    window.addEventListener('pointercancel', lift);
    window.addEventListener('touchstart', function () { G.touch = true; document.body.classList.add('touch'); }, { passive: true });
    window.addEventListener('resize', G.resize);
  };

  // ── the loop ──
  let last = 0, running = false;
  G.frame = function (ts) {
    requestAnimationFrame(G.frame);
    const now = ts / 1000;
    let dt = now - last; last = now;
    if (!(dt > 0)) dt = 0.016;
    dt = Math.min(dt, 0.1);
    G.rt = (G.rt || 0) + dt;
    G.runSystems('update', dt);
    G.runSystems('draw', dt);
    G.input.pressed = {};
    G.input.clicks.length = 0;
  };
  G.boot = function () {
    if (running) return;
    running = true;
    G.canvas = document.getElementById('pond');
    G.ctx = G.canvas.getContext('2d');
    G.resize();
    G.initInput();
    G.runSystems('init');
    G.mode = 'title';
    G.emit('boot');
    requestAnimationFrame(function (ts) { last = ts / 1000; G.frame(ts); });
  };
  window.addEventListener('load', function () { G.boot(); });
})();

// ── Genome: an open-ended recipe (traits, chemistry, a body grown from rules, organs, a growing brain) ──
(function () {
  'use strict';
  const clamp = G.clamp;
  const NIN = 12, NOUT = 5, MAXH = 16, MAXP = 6;
  // the nine things the pond can press for; the body answers each in its own way (see form)
  const PT = ['mouth', 'fin', 'spike', 'armor', 'eye', 'lamp', 'gland', 'tail', 'tentacle'];
  const TAGHUE = [45, 100, 160, 210, 260, 330];
  const INAMES = ['bias', 'food ahead', 'food beside', 'prey ahead', 'prey beside', 'danger ahead', 'danger beside', 'energy', 'temperature', 'light', 'kin near', 'rhythm'];
  const ONAMES = ['swim', 'turn', 'sprint', 'glow', 'stick'];
  Object.assign(G, { NIN, NOUT, MAXH, MAXP, PT, TAGHUE, INAMES, ONAMES });

  G.K = Object.assign(G.K, {
    mut: 0.08,            // per-gene mutation chance (times the world slider)
    dt: 1 / 30,
    foodRate: 12,        // food drops per second in a 1600x1000 pond at light 1
    foodMax: 380,
    repro: 0.30,          // child costs this fraction of the parent's max energy
    keep: 0.12,           // parent keeps at least this much after breeding
    capBase: 150,
    speciesTH: 1.65,
    maxAge: 3,
    foodDigestMin: 0.2,
  });

  G.tagOfHue = function (h) {
    h = ((h % 360) + 360) % 360;
    let best = 0, bd = 999;
    for (let i = 0; i < 6; i++) {
      let d = Math.abs(h - TAGHUE[i]); if (d > 180) d = 360 - d;
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  };

  // gene shapes:
  // t: [size, speed, colour (follows the body), unused, temper]
  // c: [digest x6, resist heat, resist cold, resist poison, tolerance x6]
  // f: the form, the rules the body is grown from (see 21_form.js)
  // p: [{k, a, s}] organs invented for this pond (k = organ id + 100)
  // h: number of hidden brain cells
  // w: [{f, t, v}] brain wires. f: 0..11 inputs or 100+n hidden. t: 200+o outputs or 100+n hidden.
  function W(f, t, v) { return { f: f, t: t, v: v }; }

  /** the first life of a pond: single cells, in this pond's own colour */
  G.founder = function () {
    const r = G.rand, n = G.randn;
    const hue = (G.W && G.W.hue0 !== undefined ? G.W.hue0 : 220) + n() * 9;
    const g = {
      t: [clamp(10 + n() * 0.9, 7, 14), clamp(0.35 + n() * 0.07, 0.1, 0.8), hue, 0.3, clamp(0.16 + n() * 0.11, 0, 1)],
      c: [0.35, 0.1, 0.9, 0.05, 0.05, 0.05, 0.1, 0.1, 0.1, 0.05, 0.05, 0.05, 0.05, 0.05, 0.05],   // diet x6, resist heat/cold/poison, tolerance x6
      f: G.form.cell(hue),
      p: [],
      h: 0,
      w: [],
    };
    g.w.push(W(0, 200, 0.1 + n() * 0.15));
    g.w.push(W(1, 200, 0.35 + n() * 0.2));
    g.w.push(W(2, 201, 0.55 + n() * 0.3));
    g.w.push(W(0, 201, n() * 0.25));
    if (r() < 0.5) g.w.push(W(11, 201, n() * 0.5));
    if (r() < 0.4) g.w.push(W(7, 200, n() * 0.4));
    if (r() < 0.3) g.w.push(W(9, 200, n() * 0.4));
    return G.validateGenome(g);
  };

  G.cloneGenome = function (g) {
    return {
      t: g.t.slice(), c: g.c.slice(),
      f: G.form.clone(g.f),
      p: g.p.map(function (p) { return { k: p.k, a: p.a, s: p.s }; }),
      h: g.h,
      w: g.w.map(function (w) { return { f: w.f, t: w.t, v: w.v }; }),
      mv: g.mv | 0,
    };
  };

  function validWire(w, h) {
    const f = w.f, t = w.t;
    if (f < 0 || (f >= NIN && f < 100) || f >= 100 + h) return false;
    if (t < 100 || (t >= 100 + h && t < 200) || t >= 200 + NOUT) return false;

  }

    g.t[0] = clamp(g.t[0], 5, 64);

    g.t[4] = clamp(g.t[4] === undefined || !isFinite(g.t[4]) ? 0.12 : +g.t[4], 0, 1);

  // nothing here is assigned by a table of kinds: speed, senses, reach, armour and attack are measured from the body.
  G.derive = function (g) {
    const t = g.t, c = g.c, f = g.f, FM = G.form, U = FM.U;

    const mvd = g.mv && G.marvelOf ? G.marvelOf(g.mv) : null;

    const FX = { speed: 0, sense: 0, eat: 0, armor: 0, spike: 0, toxin: 0, photo: 0, glow: 0, heat: 0, cold: 0, poison: 0 };
    const dig = [c[0], c[1], c[2], c[3], c[4], c[5]];
    let orgCost = 0;
    for (let i = 0; i < g.p.length; i++) {
      // an organ invented for this pond: its effects, scaled by its size
      const q = g.p[i], o = G.organOf ? G.organOf(q.k) : null;
      if (!o) continue;
      let tot = 0;
      for (const x in FX) { FX[x] += (o.fx[x] || 0) * q.s; tot += Math.abs(o.fx[x] || 0); }
      if (o.digest >= 0) dig[o.digest] = Math.min(1, dig[o.digest] + 0.4 * q.s);

    }
    if (mvd) { for (const x in FX) FX[x] += mvd.fx[x] || 0; orgCost += 0.05; }      // a marvel's effects, like an organ's
    const tail = !f.sym && f.tk && f.n > 1;
    const plump = clamp(((f.prof[1] + f.prof[2] + f.prof[3]) / 3 - 0.7) / 0.5, 0, 1);      // 0 slim .. 1 round
    const bite = Math.min(2, (f.mk === 2 ? 0.8 + 1.6 * f.ms : f.mk === 1 ? 0.6 : 0) + 0.25 * cn.pincer);
    const ds = r / U * Math.sqrt(Math.PI * U * U / FM.area(f));    // drawn so the body covers what a circle of radius r would
    const ph = {
      r: r, ds: ds, A: A,
      cnt: [1 + f.ms, Math.min(3, k[1] * 0.5), Math.min(3, (k[2] + k[7]) * 0.5), 4 * A.armour, f.en, f.glow > 0.3 ? 2 * f.glow : 0, 2 * f.venom, tail ? 1 : 0, Math.min(3, k[3] * 0.5)],
      eyes: Math.min(f.en, 3),
      sense: 38 + 185 * A.senses,
      speed: (26 + 52 * t[1]) * (0.72 + 0.95 * A.speed) / (0.7 + 0.3 * r / 10),
      turn: 2.2 + 3.4 * A.agility,
      eatR: r + 3 + 22 * A.reach,
      defense: 0.85 * A.armour,
      spike: Math.min(3, (k[2] + k[7]) * 0.5),
      gland: f.venom > 0.3 ? 2 * f.venom : 0,
      lamp: Math.min(2, (f.glow > 0.3 ? 2 * f.glow : 0) + 0.15 * k[4]),
      flag: tail ? Math.min(2, f.ts * 1.3) : 0,
      bite: bite,

// ── Form: the body is grown from genes ──

    z.look = info.look || (G.beingLook && !(z.p.vault > 0.2) && info.source !== 'ai' ? G.beingLook({ name: z.word, props: { eats: z.p.eats, moves: z.p.moves, deadly: z.p.deadly, poison: z.p.poison, light: z.p.light }, alive: z.alive }) : null);
    z.life0 = z.life;
    z.ev.push({ g: W.gen, t: info.from ? 'Budded from ' + info.from : 'Dropped into the pond' });
    W.zones.push(z);
    if (W.zones.length > 14) W.zones.shift();
    for (let i = 0; i < W.cre.length; i++) { const c = W.cre[i], dx = c.x - x, dy = c.y - y, d = Math.sqrt(dx * dx + dy * dy) + 0.01; if (d < 300) { c.startle = 1.6; c.vx += dx / d * 70; c.vy += dy / d * 70; } }
    G.emit('zone', z);
    return z;
  };

  G.disaster = function (kind, x, y) {
    const W = G.W;
    if (!W) return;
    if (x === undefined) { x = G.rr(0.2, 0.8) * W.ww; y = G.rr(0.2, 0.8) * W.wh; }
    if (kind === 'meteor') {
      const R = 190;
      for (let i = 0; i < W.cre.length; i++) {
        const c = W.cre[i], dx = c.x - x, dy = c.y - y, d = Math.sqrt(dx * dx + dy * dy);
        if (d < R) { if (d < R * 0.55 || G.rand() < 0.6) kill(c, 'meteor'); else c.E *= 0.4; }
        else if (d < R * 2) { c.vx += dx / d * 120; c.vy += dy / d * 120; }
      }
      for (let i = 0; i < W.food.length; i++) { const o = W.food[i], dx = o.x - x, dy = o.y - y; if (dx * dx + dy * dy < R * R) o.dead = true; }
      G.addZone(x, y, { name: 'crater', props: { heat: 0.7, hard: 0.0, nutrition: 0.8 }, tag: 5, radius: 120, life: 70, hue: 20, note: 'a meteor crater' });
    } else if (kind === 'flood') {
      const a = G.rand() * PI2;
      W.flood = { t: 7, fx: Math.cos(a) * 130, fy: Math.sin(a) * 130 };
    } else if (kind === 'bloom') {
      for (let i = 0; i < 170; i++) {
        const r = G.rand();
        G.spawnFood(W, null, null, r < 0.5 ? 2 : r < 0.8 ? 0 : r < 0.92 ? 1 : G.ri(3, 5), false);
      }
    } else if (kind === 'drought') {
      W.drought = 70;
    } else if (kind === 'plague') {
      const counts = {};
      for (let i = 0; i < W.cre.length; i++) counts[W.cre[i].sp] = (counts[W.cre[i].sp] || 0) + 1;
      let top = 0, tn = 0;
      for (const k in counts) if (counts[k] > tn) { tn = counts[k]; top = +k; }
      for (let i = 0; i < W.cre.length; i++) {
        const c = W.cre[i];
        const p = c.sp === top ? 0.55 : 0.08;
        if (G.rand() < p * (1 - c.ph.defense * 0.3)) kill(c, 'plague');
      }
    }
    G.emit('disaster', kind, x, y);
  };

  // ── species ──
  G.speciesById = function (id) {
    const L = G.W.species;
    for (let i = 0; i < L.length; i++) if (L[i].id === id) return L[i];
    return null;
  };

  G.updateSpecies = function () {
    const W = G.W, cre = W.cre, sp = W.species;
    for (let i = 0; i < sp.length; i++) { sp[i].n = 0; sp[i].fitSum = 0; sp[i].repFit *= 0.85; }     // the picture of a species follows its living members
    const TH = K.speciesTH;
    for (let i = 0; i < cre.length; i++) {
      const c = cre[i];
      const f = G.features(c.g);
      c.fv = f;
      let best = null, bd = 1e9;
      for (let j = 0; j < sp.length; j++) {
        if (sp[j].extinct && W.gen - sp[j].lastGen > 3) continue;
        const d = G.fdist(f, sp[j].fv);
        if (d < bd) { bd = d; best = sp[j]; }
      }
      if (!best || bd > TH) {
        const parent = best && bd < TH * 2.2 ? best.id : 0;
        best = {
          id: W.nextSp++, fv: f.slice(), born: W.gen, parent: parent, n: 0, fitSum: 0, kills: 0, peak: 0,
          hist: [], extinct: false, lastGen: W.gen, rep: null, repFit: -1, hue: c.g.t[2],
        };
        best.name = G.speciesName(c.g, best.id);
        { const ps = parent ? G.speciesById(parent) : null; if (ps && ps.judge) best.judge = { score: ps.judge.score, why: ps.judge.why, fix: ps.judge.fix, gen: ps.judge.gen, fv: ps.judge.fv, est: true }; }
        sp.push(best);
        if (sp.length > 3) G.emit('species-new', best);
      }
      c.sp = best.id;
      best.n++; best.fitSum += c.fit;
      best.lastGen = W.gen; best.extinct = false;
      if (c.fit > best.repFit || !best.rep) { best.repFit = c.fit; best.rep = G.cloneGenome(c.g); best.hue = c.g.t[2]; }
      for (let k = 0; k < f.length; k++) best.fv[k] += (f[k] - best.fv[k]) * 0.04;
    }
    for (let i = 0; i < sp.length; i++) {
      const s = sp[i];
      s.peak = Math.max(s.peak, s.n);
      s.hist.push(s.n);
      if (s.hist.length > 80) s.hist.shift();
      if (s.n === 0 && !s.extinct && W.gen - s.lastGen >= 1) {
        s.extinct = true; s.diedGen = W.gen;
        W.fossils.push({ id: s.id, name: s.name, born: s.born, died: W.gen, g: s.rep, peak: s.peak });
        if (W.fossils.length > 40) W.fossils.shift();
        G.emit('extinction-species', s);
      }
    }
    // keep the list bounded
    if (sp.length > 70) {
      for (let i = 0; i < sp.length && sp.length > 70; i++) if (sp[i].extinct && !sp[i].keep) sp.splice(i--, 1);
    }
  };

  const SYL_A = ['Glim', 'Bloop', 'Nim', 'Squi', 'Wob', 'Pip', 'Dorb', 'Fizz', 'Mur', 'Zol', 'Tink', 'Quo', 'Blum', 'Sno', 'Lum', 'Kep', 'Vor', 'Ploo', 'Yel', 'Brisk'];
  const SYL_B = ['ling', 'ox', 'ette', 'ar', 'ibus', 'o', 'ish', 'mop', 'zle', 'ra', 'bee', 'ton', 'kin', 'nub', 'let', 'ee'];
  const NOUN = ['Drifter', 'Gulper', 'Wiggler', 'Nibbler', 'Bobber', 'Glider', 'Lurker', 'Blinker', 'Paddler', 'Roamer'];
  G.speciesName = function (g, id) {
    const r = G.rng(id * 7919 + (g.f.seed | 0) + (g.t[2] | 0));
    const k = G.form.kind(g.f);
    const adj = (g.t[4] || 0) > 0.45 ? 'Fierce ' : G.derive(g).photo > 0.5 ? 'Sun-fed ' : '';
    return adj + SYL_A[Math.floor(r() * SYL_A.length)] + SYL_B[Math.floor(r() * SYL_B.length)] + ' ' + (k.noun === 'Cell' || k.noun === 'Blob' ? NOUN[Math.floor(r() * NOUN.length)] : k.noun);
  };

  G.describeSpecies = function (s) {
    const g = s.rep;
    if (!g) return 'Nothing is known about it yet.';
    const ph = G.derive(g), f = g.f;
    const bits = [];
    const facts = G.form.facts(f);
    bits.push('A ' + G.form.kind(f).full.toLowerCase() + ': ' + facts.slice(0, 5).join(', ') + '.');
    if (s.judge && s.judge.why) bits.push('The pond\'s verdict: ' + s.judge.why);
    const best = [0, 1, 2, 3, 4, 5].sort(function (a, b) { return g.c[b] - g.c[a]; });
    const names = ['gold', 'lime', 'green', 'blue', 'violet', 'pink'];
    if (ph.photo > 0.3) bits.push(ph.speed < 22 ? 'Lives on light and hardly moves, like a plant.' : 'Feeds partly on light.');
    const orgs = [];
    for (let i = 0; i < g.p.length; i++) if (G.organOf) { const o = G.organOf(g.p[i].k); if (o && orgs.indexOf(o.name) < 0) orgs.push(o.name); }
    if (orgs.length) bits.push('Carries: ' + orgs.slice(0, 3).join(', ') + '.');
    if ((g.t[4] || 0) > 0.38) bits.push('Violent: it attacks other kinds' + (s.attacks ? ' (' + s.attacks + ' attacks so far).' : '.'));
    if (s.kills > 3) bits.push('A hunter: it has eaten ' + s.kills + ' other creatures.');
    else if (g.c[best[0]] > 0.6 && g.c[best[1]] > 0.5) bits.push('Eats ' + names[best[0]] + ' and ' + names[best[1]] + ' food.');
    else bits.push('Eats ' + names[best[0]] + ' food.');
    if (ph.lungs) bits.push('Walks: it can climb onto the shore.');
    if (ph.jaws) bits.push('Its bite can take the big prey of the deep.');
    if (g.h >= 2) bits.push('A thinking brain with ' + g.h + ' hidden cells.');
    if (g.c[6] > 0.5) bits.push('Likes it hot.');
    if (g.c[7] > 0.5) bits.push('Shrugs off winter.');
    if (g.c[8] > 0.5) bits.push('Poison-proof.');
    return bits.slice(0, 7).join(' ');
  };

  G.liveSpeciesCount = function () {
    let n = 0; const L = G.W.species;
    for (let i = 0; i < L.length; i++) if (!L[i].extinct && L[i].n > 0) n++;
    return n;
  };

  G.exports = { Grid: Grid };
})();

    if (key.indexOf('mouth') === 0) { const k = +key.slice(5); return function (c) { return c.g.f.mk === k; }; }
    if (key.indexOf('plan') === 0) { const id = +key.slice(4); return function (c) { return c.g.f.pl === id; }; }
    if (key.indexOf('dsg') === 0) { const id = +key.slice(3); return function (c) { return c.g.f.rules.some(function (q) { return q.k === 8 && q.t === id; }); }; }
    if (key.indexOf('organ') === 0) { const id = +key.slice(5); return function (c) { return c.g.p.some(function (p) { return p.k === id; }); }; }
    return null;
  };
  const admired = function (key) {
    const X = G.W && G.W.fashion; if (!X) return false;
    if (key.indexOf('grow') === 0) return X.like[+key.slice(4)] > 0.5;
    return (key === 'pattern' && X.pat > 0) || (key === 'shell' && X.shell) || (key === 'crest' && X.crest) || (key === 'glow' && X.glow) || (key === 'star' && X.star) || (key === 'eyes3' && X.eyes >= 3) || (key === 'seg5' && X.long);
  };

  /** which body gathers each colour of food best */
  G.FOODFOR = ['gold scraps lie in cracks: long reach gathers them', 'lime food darts about: agile bodies catch it', 'green algae is there for anyone', 'blue minerals hide in the dark: sharp senses find them', 'violet food has a hard shell: jaws, beaks and claws open it', 'pink food drifts fast: fast swimmers catch it'];
  /** what a feature is for, and what the pond is up against that it answers (no numbers): for the family tree */
  G.forWhat = function (key) {

    let t = e[0];
    const P = G.W && G.W.press ? G.W.press.list : [];

  };

  G.edge = function (has) {
    const cre = G.W.cre; let a = 0, an = 0, b = 0, bn = 0;
    for (let i = 0; i < cre.length; i++) { if (has(cre[i])) { a += cre[i].fit || 0; an++; } else { b += cre[i].fit || 0; bn++; } }

    if (bn < 3) return 'Nearly all of the pond has it now.';

  const WORDS = [[/legs|fingers|pincers|paddles/, 'grow0'], [/fins/, 'grow1'], [/spikes/, 'grow2'], [/tentacles/, 'grow3'], [/feelers/, 'grow4'], [/plates/, 'grow5'], [/frills/, 'grow6'], [/horns/, 'grow7'], [/^eyes:/, 'eye'], [/beak/, 'mouth1'], [/jaws/, 'mouth2'], [/sucker/, 'mouth3'], [/whiskers/, 'mouth4'], [/tail/, 'tail'], [/segments/, 'seg2'], [/star/, 'star'], [/shell/, 'shell'], [/crest/, 'crest'], [/glow/, 'glow'], [/poison/, 'venom'], [/skin turned/, 'pattern'], [/scales/, 'coat1'], [/fur/, 'coat2'], [/feathers/, 'coat3'], [/neck/, 'neck'], [/big head/, 'bighead'], [/part now grows on a part/, 'nested']];
  G.whyLine = function (text) { for (let i = 0; i < WORDS.length; i++) if (WORDS[i][0].test(text)) return G.forWhat(WORDS[i][1]); return ''; };
})();

<script data-part="pressure">
// ── What the pond is up against right now, measured: so what grows next is relevant to what is happening ──
// Mutation stays random and selection stays real; the pressures only tilt WHICH new parts and organs appear,
// the way a cold pond makes a frost coat a likelier thing to stumble on than a heat skin.
(function () {
  'use strict';
  const clamp = G.clamp;
  // what can hurt a bad thing: a trait creatures can evolve. index → [name, the built-in part that gives it, words]
  const WEAK = [
    { id: 'spike', part: 2, text: 'spikes' }, { id: 'toxin', part: 6, text: 'poison glands' }, { id: 'bite', part: 0, text: 'jaws and beaks' },
    { id: 'glow', part: 5, text: 'glowing lamps' }, { id: 'armor', part: 3, text: 'armour' },
  ];
  G.WEAK = WEAK;
  G.weakIndex = function (id) { for (let i = 0; i < WEAK.length; i++) if (WEAK[i].id === id) return i; return -1; };
  /** is this thing bad for creatures? */
  G.isBad = function (z) { return z.p.poison + z.p.acid + z.p.eats + (z.p.deadly || 0) > 0.25 || z.p.vault > 0.2; };
  /** the wall that is locking food away, if there is one */
  G.vaultOf = function (W) { for (let i = 0; i < W.zones.length; i++) if (W.zones[i].p.vault > 0.2) return W.zones[i]; return null; };
  /** how strongly a creature carries the trait a thing is weak to (0..2) */
  G.weakPower = function (c, w) {
    const ph = c.ph;
    if (w === 0) return Math.min(2, ph.spike);
    if (w === 1) return Math.min(2, ph.gland);
    if (w === 2) return Math.min(2, ph.bite || 0);
    if (w === 3) return Math.min(2, (c.glow || 0) * 1.6);
    return Math.min(2, ph.defense * 2.2);
  };

  /** Measured once a generation. part[k] and fx[name] are extra weights; c[i] tilts a chemistry gene; list is for people (and the AI). */
  G.measurePressures = function () {
    const W = G.W;
    const P = { part: new Array(9).fill(0), fx: {}, c: new Array(15).fill(0), list: [], size: 0, sizeWhy: '' };
    const fx = function (k, v) { P.fx[k] = (P.fx[k] || 0) + v; };
    const temp = W.set.temp + (W.mods.length ? G.modSum('temp') : 0);
    if (temp < -0.25) { fx('cold', 3); P.c[7] += 1; P.list.push('the water is cold'); }
    if (temp > 0.25) { fx('heat', 3); P.c[6] += 1; P.list.push('the water is hot'); }
    const light = W.set.light * (W.mods.length ? Math.max(0.1, 1 + G.modSum('light')) : 1);
    if (light < 0.7) { fx('glow', 2); fx('sense', 2); P.part[5] += 1.5; P.part[4] += 1; P.list.push('it is dark'); }
    // short of breath: more than a fifth of the pond's breaths last season came up short
    if (W.lastStats && W.cre.length && (W.lastStats.gasp || 0) > W.lastStats.breaths * 0.2) { P.o2 = 2; P.list.push('the water is thin on oxygen (fins and frills breathe better; small bodies need less)'); }
    if (light > 1.2) { fx('photo', 2.5); P.list.push('there is plenty of light'); }
    if (W.mods.length && G.modSum('poison') > 0.1) { fx('poison', 4); P.c[8] += 2; P.list.push('the whole pond is poisoned'); }
    // size: a hunter takes only prey well under its own size, so danger makes a bigger body a likelier thing to stumble on; hunger, heat and thin air favour small bodies
    if (W.lastStats && (W.lastStats.killed > 5 || W.lastStats.fights > 12)) { P.size += 1; P.sizeWhy = 'to be too big to bite'; }
    if (W.lastStats && W.lastStats.protShort > W.cre.length * 0.3 && P.size <= 0) { P.size -= 0.5; P.sizeWhy = 'to need less food'; }
    if (W.lastStats && W.lastStats.killed > 5) { fx('armor', 2); fx('spike', 1.5); fx('toxin', 1.5); fx('speed', 1); P.part[3] += 1.5; P.part[2] += 1; P.part[6] += 1; P.list.push('hunters are about'); }
    if (W.lastStats && W.lastStats.fights > 12) { fx('armor', 2); fx('speed', 1.5); fx('spike', 1); P.part[3] += 1.5; P.part[1] += 1; P.list.push('a violent kind is attacking the others'); }
    for (let i = 0; i < W.zones.length; i++) {
      const z = W.zones[i], p = z.p;
      if (G.isBad(z)) {
        const w = WEAK[z.weak];
        if ((p.eats || 0) + (p.deadly || 0) > 0.2) { P.size += 0.8; P.sizeWhy = 'to be too big for ' + z.word + ' to swallow'; }
        P.part[w.part] += 2.5; fx(w.id === 'bite' ? 'eat' : w.id, 2.5);
        P.c[9 + z.sig] += 1;
        P.list.push(z.word + ' is hurting them (it is weak to ' + w.text + ')');
        if (p.poison > 0.2) { fx('poison', 2); P.c[8] += 1; }
        if (p.eats > 0.2 || p.deadly > 0.2) { fx('speed', 1.5); fx('sense', 1); P.part[1] += 1; P.part[7] += 1; P.part[4] += 0.5; }
      }
      if (p.sticky > 0.3) { P.part[8] += 1.5; P.list.push(z.word + ' is sticky'); }
      if (Math.abs(p.heat) > 0.3) { fx(p.heat > 0 ? 'heat' : 'cold', 2); P.c[p.heat > 0 ? 6 : 7] += 1; }
      if (p.nut > 0.3) { P.c[z.tag] += 1.5; P.list.push(z.word + ' is food few can eat yet'); }
    }
    // food lying around that nobody eats is an invitation
    const left = [0, 0, 0, 0, 0, 0];
    for (let i = 0; i < W.food.length; i++) if (!W.food[i].dead) left[W.food[i].tag]++;
    const eaters = [0, 0, 0, 0, 0, 0];
    for (let i = 0; i < W.cre.length; i++) for (let t = 0; t < 6; t++) if (W.cre[i].ph.dig[t] >= 0.2) eaters[t]++;
    const names = ['gold', 'lime', 'green', 'blue', 'violet', 'pink'];
    for (let t = 0; t < 6; t++) {
      if (left[t] > 25 && eaters[t] < W.cre.length * 0.3) { P.c[t] += 1.5; P.digest = t; if (P.list.length < 6) P.list.push('there is ' + names[t] + ' food that few can eat'); }
    }
    if (W.lastStats && W.lastStats.protShort > W.cre.length * 0.3) { P.c[0] += 1.5; P.part[0] += 1; P.list.push('protein is short: elaborate bodies cannot build children on algae alone (scraps and meat are rich)'); }
    if (W.cre.length && W.food.length < 40) { P.size -= 0.8; P.sizeWhy = 'to need less food'; }
    if (P.o2) { P.size -= 0.6; P.sizeWhy = 'to need less air'; }
    if (temp > 0.25) { P.size -= 0.3; if (!P.sizeWhy) P.sizeWhy = 'to shed heat'; }
    P.size = clamp(P.size, -1.5, 2);
    if (W.cre.length && W.food.length < 40) { fx('eat', 1.5); fx('sense', 1.5); P.part[4] += 1; P.list.push('food is scarce'); }
    // the visible answers: a coat, a build, eyes, a colour
    const B = P.body = { coat: -1, plump: 0, eyes: 0, hue: -1 };
    if (temp < -0.25) { B.coat = 2; B.plump = 1; } else if (temp > 0.25) { B.coat = 0; B.plump = -1; }
    if (W.mods.length && G.modSum('poison') > 0.1 && B.coat < 0) B.coat = 1;
    if (light < 0.7) B.eyes = 1;
    let worst = null, wv = 0;
    for (let i = 0; i < W.zones.length; i++) { const z = W.zones[i], p = z.p, harm = (p.eats || 0) + (p.deadly || 0) * 1.5 + (z.alive > 0.25 ? p.poison * 0.5 : 0); if (harm > wv && (z.alive > 0.25 || p.eats > 0.05 || p.deadly > 0.05)) { wv = harm; worst = z; } if (p.poison > 0.3 && B.coat < 0) B.coat = 1; if (p.heat > 0.4 && B.coat < 0) { B.coat = 0; B.plump = -1; } if (p.heat < -0.4 && B.coat < 0) { B.coat = 2; B.plump = 1; } if (p.light < -0.3) B.eyes = 1; }
    if (worst && wv > 0.2) { B.hue = worst.hue; B.like = worst.word; P.list.push('looking like ' + worst.word + ' is the way to be overlooked by it'); }
    W.press = P;
    return P;
  };
})();

<script data-part="organs">
// ── Organs: new body parts invented for THIS pond (by the AI when there is one, by the game otherwise) ──
// An organ is a part gene like any other: mutation can grow it, it costs energy, and selection decides if it
// spreads. What it does comes from a fixed vocabulary of effects, so whatever is imagined stays fair.
(function () {
  'use strict';
  const clamp = G.clamp;
  // effect → how the engine reads it (all clamped):
  //   speed -1..1, sense 0..1, eat 0..1, armor 0..1, spike 0..1, toxin 0..1, photo 0..1 (feeds on light),
  //   glow 0..1, heat/cold/poison 0..1 (resistance), digest: -1 or a food kind 0..5
  const FX = ['speed', 'sense', 'eat', 'armor', 'spike', 'toxin', 'photo', 'glow', 'heat', 'cold', 'poison'];
  G.FX = FX;
  const MAX_ORGANS = 12;

  G.organOf = function (k) {
    const W = G.W;
    if (!W || !W.organs) return null;
    for (let i = 0; i < W.organs.length; i++) if (W.organs[i].id === k - 100) return W.organs[i];
    return null;
  };
  G.partName = function (k) { if (k < 100) return G.PT[k] || 'part'; const o = G.organOf(k); return o ? o.name.toLowerCase() : 'organ'; };

  /** Whatever was imagined becomes a fair, in-range organ. */
  G.cleanOrgan = function (raw) {
    if (!raw || typeof raw !== 'object') return null;
    const f = raw.fx && typeof raw.fx === 'object' ? raw.fx : {};
    const fx = {};
    let sum = 0;
    for (let i = 0; i < FX.length; i++) {
      const k = FX[i];
      let v = +f[k]; if (!isFinite(v)) v = 0;
      fx[k] = k === 'speed' ? clamp(v, -1, 1) : clamp(v, 0, 1);
      sum += Math.abs(fx[k]);
    }
    let digest = Math.round(+raw.digest); if (!(digest >= 0 && digest <= 5)) digest = -1;
    if (sum < 0.15 && digest < 0) return null;
    // an organ may not be good at everything: the strongest effects are kept, the total is capped
    if (sum > 1.8) for (let i = 0; i < FX.length; i++) fx[FX[i]] *= 1.8 / sum;
    return {
      name: String(raw.name || 'New organ').replace(/[<>"]/g, '').slice(0, 26),
      note: String(raw.note || '').replace(/[<>]/g, '').slice(0, 120),
      svg: raw.svg ? G.safeSvg(raw.svg) : '',
      fx: fx, digest: digest,
      hue: ((+raw.hue || 0) % 360 + 360) % 360,
      by: String(raw.by || raw.model || '').slice(0, 60),
    };
  };

  G.addOrgan = function (def, quiet) {
    const W = G.W;
    const o = G.cleanOrgan(def);
    if (!o) return null;
    if (W.organs.some(function (x) { return x.name.toLowerCase() === o.name.toLowerCase(); })) return null;
    if (W.organs.length >= MAX_ORGANS) {
      // make room: drop the oldest organ nobody carries
      const used = {};
      for (let i = 0; i < W.cre.length; i++) for (let j = 0; j < W.cre[i].g.p.length; j++) used[W.cre[i].g.p[j].k] = 1;
      let at = -1;
      for (let i = 0; i < W.organs.length; i++) if (!used[100 + W.organs[i].id]) { at = i; break; }
      if (at < 0) return null;
      W.organs.splice(at, 1);
    }
    o.id = W.nextOrgan++;
    o.gen = def.gen || W.gen;
    W.organs.push(o);
    if (!quiet) G.emit('organ-new', o);
    return o;
  };

  // ── the game's own imagination (no server needed) ──
  const KINDS = [
    { fx: { photo: 0.8 }, names: ['Sun Leaf', 'Light Sail', 'Green Frond', 'Algae Coat'], note: 'Feeds on light, so its owner can rest in the bright shallows.', shape: 'leaf', hue: 120 },
    { fx: { sense: 0.8 }, names: ['Feeler', 'Whisker Stalk', 'Scent Horn', 'Ripple Ear'], note: 'Senses food and danger from much further away.', shape: 'antenna', hue: 50 },
    { fx: { speed: 0.8 }, names: ['Jet Sac', 'Water Screw', 'Kick Fin', 'Paddle Tail'], note: 'A burst of speed.', shape: 'jet', hue: 195 },
    { fx: { armor: 0.8, speed: -0.3 }, names: ['Shell Plate', 'Stone Hide', 'Bone Shield'], note: 'Hard to bite, but slow.', shape: 'shell', hue: 40 },
    { fx: { eat: 0.9 }, names: ['Suction Mouth', 'Gulper Tube', 'Reaching Tongue', 'Net Mouth'], note: 'Reaches food from further away.', shape: 'tube', hue: 340 },
    { fx: { spike: 0.8 }, names: ['Thorn', 'Barb Horn', 'Needle Crown'], note: 'Anything that bites it gets hurt.', shape: 'thorn', hue: 280 },
    { fx: { toxin: 0.8 }, names: ['Bitter Gland', 'Stinger', 'Venom Sac'], note: 'It tastes terrible, and eating it costs dearly.', shape: 'bulb', hue: 100 },
    { fx: { glow: 0.7, sense: 0.3 }, names: ['Glow Bulb', 'Lantern Eye', 'Star Spot'], note: 'A light of its own, in the dark.', shape: 'bulb', hue: 55 },
    { fx: { heat: 0.8 }, names: ['Heat Skin', 'Ember Coat'], note: 'Shrugs off hot water.', shape: 'shell', hue: 15 },
    { fx: { cold: 0.8 }, names: ['Frost Coat', 'Winter Fur', 'Ice Fat'], note: 'Shrugs off the cold.', shape: 'fur', hue: 205 },
    { fx: { poison: 0.8 }, names: ['Filter Liver', 'Clean Gut'], note: 'Swims through poison unharmed.', shape: 'bulb', hue: 265 },
    { fx: { photo: 0.5, armor: 0.4, speed: -0.4 }, names: ['Reef Crust', 'Moss Shell'], note: 'A living crust: it feeds on light and protects, and barely moves.', shape: 'shell', hue: 140 },
    { fx: { eat: 0.4 }, digest: true, names: ['Grinder Gut', 'Second Stomach', 'Sifter'], note: 'Digests a food its owner could not eat before.', shape: 'tube', hue: 25 },
    { fx: { speed: 0.5, sense: 0.4 }, names: ['Hunter Fin', 'Chase Whisker'], note: 'Fast and alert: made for the chase.', shape: 'jet', hue: 350 },
  ];
  const SHAPES = {
    leaf: function (c) { return '<path d="M2 16 C10 2 26 4 30 16 C26 28 10 30 2 16 Z" fill="' + c + '" stroke="#07121f" stroke-width="2"/><path d="M4 16 L28 16" stroke="#07121f" stroke-width="1.5"/>'; },
    antenna: function (c) { return '<path d="M2 16 Q14 6 24 8" fill="none" stroke="' + c + '" stroke-width="4" stroke-linecap="round"/><circle cx="26" cy="8" r="5" fill="' + c + '" stroke="#07121f" stroke-width="2"/>'; },
    jet: function (c) { return '<polygon points="2,10 20,4 30,16 20,28 2,22" fill="' + c + '" stroke="#07121f" stroke-width="2"/><path d="M22 12 L30 16 L22 20" fill="none" stroke="#07121f" stroke-width="1.5"/>'; },
    shell: function (c) { return '<path d="M4 4 Q22 16 4 28 Z" fill="' + c + '" stroke="#07121f" stroke-width="2"/><path d="M6 10 Q13 16 6 22" fill="none" stroke="#07121f" stroke-width="1.5"/>'; },
    tube: function (c) { return '<rect x="2" y="11" width="20" height="10" rx="4" fill="' + c + '" stroke="#07121f" stroke-width="2"/><circle cx="24" cy="16" r="7" fill="#07121f" stroke="' + c + '" stroke-width="3"/>'; },
    thorn: function (c) { return '<polygon points="2,9 30,16 2,23" fill="' + c + '" stroke="#07121f" stroke-width="2"/>'; },
    bulb: function (c) { return '<path d="M2 16 L12 16" stroke="' + c + '" stroke-width="4"/><circle cx="20" cy="16" r="9" fill="' + c + '" stroke="#07121f" stroke-width="2"/><circle cx="17" cy="13" r="3" fill="#ffffff" opacity="0.7"/>'; },
    fur: function (c) { return '<path d="M3 6 L16 10 M3 12 L20 14 M3 18 L20 18 M3 24 L16 22" stroke="' + c + '" stroke-width="3.5" stroke-linecap="round"/>'; },
  };
  const ADJ = ['', '', 'Twin ', 'Great ', 'Fine ', 'Old ', 'Bright ', 'Deep '];

  G.offlineOrgan = function () {
    const r = G.rand;
    // most of the time, something that answers a pressure the pond is under right now
    let kind = KINDS[Math.floor(r() * KINDS.length)];
    const press = G.W && G.W.press ? G.W.press : null;
    if (press && r() < 0.75) {
      let tot = 0; const w = KINDS.map(function (k) { let s = 0.15; for (const f in k.fx) if (k.fx[f] > 0) s += (press.fx[f] || 0) * k.fx[f]; if (k.digest && press.digest !== undefined) s += 2; tot += s; return s; });
      let x = r() * tot;
      for (let i = 0; i < KINDS.length; i++) { x -= w[i]; if (x <= 0) { kind = KINDS[i]; break; } }
    }
    const fx = {};
    for (const k in kind.fx) fx[k] = kind.fx[k] * (0.7 + r() * 0.5);
    const hue = (kind.hue + (r() - 0.5) * 50 + 360) % 360;
    const col = G.hsl(hue, 80, 62, 1);
    return {
      name: ADJ[Math.floor(r() * ADJ.length)] + kind.names[Math.floor(r() * kind.names.length)],
      note: kind.note, fx: fx, digest: kind.digest ? (press && press.digest !== undefined ? press.digest : Math.floor(r() * 6)) : -1, hue: hue,
      svg: '<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">' + SHAPES[kind.shape](col) + '</svg>',
      by: '',

  };

  // every few generations the pond gets one new organ to try
  let busy = false;
  G.organTick = function (gen) {
    const W = G.W;
    if (!W || W.title || gen % 4 !== 2) return;
    const live = G.mode === 'play' && !G.catching && G.ai && G.ai.provider === 'server' && G.ai.available && G.ai.available();
    if (!live) { G.addOrgan(G.offlineOrgan()); return; }
    // the AI invents an organ now and then; in between, the game's own imagination fills in
    if (busy || !G.ai.allow('organ')) return;          // not now: with an AI, nothing is taken from the stock
    busy = true;
    const info = {
      gen: gen,
      species: W.species.filter(function (s) { return !s.extinct && s.n > 0; }).sort(function (a, b) { return b.n - a.n; }).slice(0, 5).map(function (s) { return { name: s.name, n: s.n, about: G.describeSpecies(s) }; }),
      things: W.zones.map(function (z) { return z.word; }).slice(0, 8),
      pressures: W.press ? W.press.list.slice(0, 6) : [],
      water: { temperature: W.set.temp, light: W.set.light, food: W.set.bloom },

// The genes decide what a creature IS: its build, what grows on it, its coat, its colours, what its world has done to it.

// ── Fields and strikes: what a world event can DO, said freely ──
// A typed event is no longer squeezed into a dozen pond-wide dials. It may lay down FIELDS: regions of the pond, each a
// shape (a line, a band, a circle, a ring, half the pond, all of it) made of some stuff (ice, fire, water, rock, plants,
// poison, light, dark, magic), doing any mix of things to whoever is in it: it can be solid (a wall, a boulder, a cage),
// burn, freeze, poison, slow, push, pull, feed, kill. It can be aimed at some creatures only, drift across the pond, grow,
// and arrive late, so an event unfolds in stages (the ground rumbles; then the lava comes; then ash). It may also call
// STRIKES from above: meteors, lightning, falling rocks, each hitting a spot.
// A wall of ice, a river of lava, a whirlpool, a safe garden, a poison cloud that drifts, a cage round the middle: all are
// the same few parts put together, so the AI can say almost anything and the pond can act it out.

<script data-part="sim">
// ── Running the pond: fixed steps, fast-forward, starting and seeding ponds ──
(function () {
  'use strict';
  let acc = 0;
  G.alpha = 1;
  G.speedSteps = [0, 1, 4, 16, 64];

  G.isBlocked = function () { return !!(G.ui.modal || G.ui.menuOpen); };

  G.setSpeed = function (s) {
    G.speed = s;
    G.paused = s === 0;
    G.emit('speed', s);
  };
  G.togglePause = function () {
    if (G.speed === 0) G.setSpeed(G.lastSpeed || 1);
    else { G.lastSpeed = G.speed; G.setSpeed(0); }
  };

  G.addSystem({
    name: 'sim',
    update: function (dt) {
      const W = G.W;
      if (!W) return;
      if (G.speed === 0 || G.isBlocked() || G.mode === 'boot' || G.catching || (typeof document !== 'undefined' && document.hidden)) { G.alpha = 1; return; }      // a pond nobody is looking at stands still
      const slow = G.mode === 'title';               // the title screen pond just drifts
      const sp = slow ? 0.5 : G.speed;
      const step = sp >= 16 ? 0.1 : G.K.dt;
      acc += dt * sp;
      const t0 = performance.now();
      let n = 0;
      const maxMs = sp >= 16 ? 24 : 14;
      while (acc >= step) {
        G.step(step);
        acc -= step; n++;
        if (n > 4000 || (n % 8 === 0 && performance.now() - t0 > maxMs)) { acc = Math.min(acc, step); break; }
      }
      G.alpha = sp >= 16 ? 1 : acc / step;
      G.simRate = n;
    },
  });

  G.hints = {};
  G.hint = function (key, text, ms) {
    if (G.hints[key]) return;
    G.hints[key] = 1;
    G.emit('hint', text, ms || 7000);
  };

  // a brand new pond: a random population of identical-ish blobs
  G.startPond = function (opts) {
    opts = opts || {};
    G.newWorld({ seed: (Date.now() ^ (Math.random() * 1e9)) >>> 0 });
    const W = G.W;
    if (opts.fossil && opts.fossil.g) {
      // seed from a fossil: a small herd of that species, each a little different
      for (let i = 0; i < 36; i++) {
        const res = G.mutate(G.cloneGenome(opts.fossil.g), 1.6, null);
        const c = G.makeCreature(res.g, null, null, res.muts);
        c.E = c.ph.Emax * 0.4;
        W.births.push({ at: G.rr(0.1, 3.5), c: c, x: W.ww * 0.5 + G.randn() * 170, y: W.wh * 0.5 + G.randn() * 120, from: null });

    G.R.sel = null;
    G.emit('new-pond', opts);
  };

    G.newWorld({ seed: (Date.now() ^ 0x5bd1e995) >>> 0 });
    const W = G.W;
    for (let i = 0; i < 22; i++) {

<script data-part="grow">
// ── The pond grows ──
// A pond of tiny cells is roomy; the same pond full of big creatures is a crush where nothing can be made out. So the pond
// itself widens as its creatures take up more of it: each generation it looks at how much of the water is covered by bodies
// and, when that is too much, grows a little (up to about two and a half times across). Everything in it moves apart with
// it, and the food stays what it was, so there is more room, not more mouths. The whole pond still fits the screen.
(function () {
  'use strict';

  if (typeof setInterval !== 'undefined' && typeof document !== 'undefined') setInterval(function () { const W = G.W, v = G.view; if (!W || W.title || !aim || G.mode !== 'play') return; const g = v.grow || 1; if (Math.abs(aim - g) < 0.002) { aim = 0; return; } G.pondGrowTo(g + G.clamp(aim - g, -0.004, 0.006)); }, 50);

<script data-part="beyond">
// ── Beyond the pond ──
// The pond has no wall round it. At its sides and its floor the water simply goes on, into a mist nobody has been through:
// far lights wink in it. When the pond grows (57_grow) it is this mist that
// draws back, and what was hidden becomes water to live in. Drawn over the pond, in the pond's own measure.
(function () {
  'use strict';
  const TAU = 6.2832;
  let pulse = 0;          // 1 just after the mist drew back, fading: the rim glows for a moment
  G.on('pond-grew', function () { pulse = 1; });
  G.drawBeyond = function (ctx) {
    const W = G.W; if (!W || W.title) return;
    const v = G.view, s = v.scale * v.dpr, t = G.rt || 0, ww = W.ww, wh = W.wh, B = Math.min(ww, wh) * 0.14, top = G.shoreY ? G.shoreY(W) : 0;
    // nothing of it is on screen when you are zoomed in on the middle
    const x0 = -v.ox / v.scale, y0 = -v.oy / v.scale, x1 = x0 + v.w / v.scale, y1 = y0 + v.h / v.scale;
    if (x0 > B && x1 < ww - B && y1 < wh - B) { pulse = Math.max(0, pulse - 0.01); return; }
    ctx.save(); ctx.setTransform(s, 0, 0, s, v.ox * v.dpr, v.oy * v.dpr);
    const mist = function (a) { return 'rgba(5,16,27,' + a + ')'; };

    band(0, 0, B, 0, -400, top, B + 400, wh - top + 400);                       // left
    band(ww, 0, ww - B, 0, ww - B, top, B + 400, wh - top + 400);               // right
    band(0, wh, 0, wh - B, -400, wh - B, ww + 800, B + 400);                    // the floor
    // the mist moves: slow banks of it drifting along the edges
    for (let i = 0; i < 26; i++) {
      const side = i % 3, u = ((i * 0.381966 + t * (0.004 + (i % 5) * 0.0012)) % 1), in_ = (0.25 + 0.55 * ((i * 0.7548) % 1)) * B, r = B * (0.5 + ((i * 0.5698) % 1) * 0.6);
      const x = side === 0 ? in_ : side === 1 ? ww - in_ : u * ww, y = side === 2 ? wh - in_ : top + u * (wh - top);
      const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, 'rgba(130,185,215,' + (0.17 + 0.07 * Math.sin(t * 0.4 + i)) + ')'); g.addColorStop(1, 'rgba(120,170,200,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    }
    // far lights in it: somebody else's ponds, or eyes
    for (let i = 0; i < 46; i++) {
      const side = i % 3, u = (i * 0.618034) % 1, in_ = (0.08 + 0.5 * ((i * 0.3247) % 1)) * B, tw = 0.5 + 0.5 * Math.sin(t * (0.6 + (i % 7) * 0.13) + i * 2.1);
      const x = side === 0 ? in_ : side === 1 ? ww - in_ : u * ww, y = side === 2 ? wh - in_ : top + u * (wh - top);
      ctx.beginPath(); ctx.arc(x, y, 2.2 + 3.2 * tw, 0, TAU); ctx.fillStyle = 'hsla(' + (170 + (i * 47) % 120) + ',80%,78%,' + (0.2 + 0.6 * tw) + ')'; ctx.fill();
    }

    const s = order.join('|');
    if (!order.length) { if (!box.classList.contains('hide')) box.classList.add('hide'); sig = ''; return; }
    box.classList.remove('hide');
    { const se = document.getElementById('season'); if (se && !se.classList.contains('hide') && window.innerWidth > 720) box.style.top = Math.round(se.getBoundingClientRect().bottom + 16) + 'px'; else box.style.top = ''; }      /* a clear gap under the seasons */
    // the heading folds the card away; under it, one line says what the card is
    if (shut === null) { try { shut = !!localStorage.getItem('primordia.versusShut'); } catch (e) { shut = false; } }
    let html = '<div id="vsHead" title="' + (shut ? 'Open' : 'Fold away') + '" style="display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer"><span class="ilabel" style="margin:0;color:var(--gold)">' + (shut ? 'DANGERS' : 'DANGERS IN THE POND') + '</span><span style="display:flex;align-items:center;gap:6px">' + (shut ? '<small style="padding:1px 8px;border-radius:999px;border:1px solid rgba(255,126,182,.6);color:#ffd3e2">' + order.length + '</small>' : '') + '<span style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:11px;background:rgba(7,18,31,.55);border:1px solid rgba(207,232,255,.25)">' + (shut ? '▸' : '▾') + '</span></span></div>';
    if (shut) { box.innerHTML = html; box.style.width = 'auto'; document.getElementById('vsHead').onclick = toggle; sig = s; return; }
    box.style.width = '';
    html += '<div style="font-size:11px;line-height:1.4;margin:3px 0 5px;color:rgba(207,232,255,.8)">Harmful things you or events put in the pond, and how far the creatures have got in beating each one. Click one to go to it.</div>';
    order.slice(0, 2).forEach(function (k) {
      const q = kinds[k], z = q.z, v = G.versus(z);
      const lock = z.p.vault > 0.2 ? 'It locks the food away. ' : z.p.deadly > 0.3 ? 'It kills with one touch. ' : '';
      const mood = lock + (v.carry > 0.5 ? 'They have the answer: <b>' + v.weak + '</b>.' : v.carry > 0.15 ? 'They are learning: <b>' + v.weak + '</b> hurt it.' : 'It is weak to <b>' + v.weak + '</b>. Few have them yet.');
      html += '<div data-z="' + z.id + '" style="cursor:pointer;padding:6px 0 4px;border-top:1px solid rgba(207,232,255,.12)"><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:12.5px">' + esc(z.word) + (q.n > 1 ? ' <small>×' + q.n + '</small>' : '') + '</b><small>' + (q.ate ? 'it has killed ' + q.ate : 'since gen ' + z.born) + '</small></div>' +
        '<div style="font-size:11px;margin:2px 0 3px;color:rgba(207,232,255,.85)">' + mood + '</div>' +
        bar('have ' + v.weak, v.carry, PAL.algae) + (z.p.vault > 0.2 ? '' : bar('can bear it', v.adapt, PAL.gold)) + bar('its life left', q.left, PAL.rose) + '</div>';
    });
    box.innerHTML = html;
    const rows = box.querySelectorAll('[data-z]');
    for (let i = 0; i < rows.length; i++) rows[i].onclick = function () { const id = +this.dataset.z; const z = G.W.zones.filter(function (q) { return q.id === id; })[0]; if (z) { G.select(null); G.selectZone(z); G.focusOn(z.x, z.y, Math.max(1.5, G.cam.z)); } };
    document.getElementById('vsHead').onclick = toggle;
    sig = s;
  }

  // milestones: the moments worth shouting about
  G.versusMilestones = function () {
    const W = G.W;
    for (let i = 0; i < W.zones.length; i++) {
      const z = W.zones[i];
      if (!G.isBad(z) || z.age < 30) continue;
      const v = G.versus(z), k = z.word.toLowerCase();
      if (v.carry > 0.25) G.discover('vs25' + k, 'They are learning! A quarter of the pond now carries ' + v.weak + ', the weakness of ' + z.word + '.');
      if (v.carry > 0.55) G.discover('vs55' + k, 'Most of the pond now carries ' + v.weak + '. ' + z.word + ' is in trouble.');
    }
  };

  G.addSystem({
    name: 'versus',
    init: function () {
      box = el('div', 'glass hide', '', $('ui')); box.id = 'versus';
      G.on('zone-killed', function (z) {
        if (G.mode !== 'play') return;
        G.R.shake = 0.5; G.R.flash = 0.8; G.R.flashCol = PAL.gold;
        G.R.ring(z.x, z.y, PAL.gold, z.r0 * 2.2, 1.6); G.R.ring(z.x, z.y, PAL.algae, z.r0 * 1.5, 1.2); G.R.sparkle(z.x, z.y, PAL.gold, 40, 160);
        G.sfx('discovery');
      });
      G.on('zone', function (z) { if (G.mode === 'play' && G.isBad(z) && !z.genNote && z.genN === 1) G.hint('vs' + z.id, z.word + ' is dangerous. Watch DANGERS IN THE POND (left): life will look for its weakness.', 9000); });
    },
    update: function () {
      if (G.mode !== 'play' || !G.W) return;
      const now = performance.now();
      if (now - last < 600) return;
      last = now;
      render();
    },
  });
})();
