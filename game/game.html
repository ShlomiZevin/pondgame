<script data-part="wish">
// ── The pond's wish: the goal of the game ──
// The pond dreams of one creature at a time ("a brave little thing with a blade"). The wish is always on screen. The player
// makes it come true with what they already have: dropping things in, causing events, keeping and breeding. Every so often
// the AI is shown a picture of the pond's living kinds and says how close each is to the wish, so the card can say "closest
// so far: 6 of 10, it has the blade but no fur yet". When one is close enough the wish comes true: the creature is kept as
// a LEGEND, the level rises, and the pond dreams a harder one. Wishes, level and legends live on the server, per player.
(function () {
  'use strict';
  const NEED = 8;                 // how close (of 10) a creature must be for the wish to come true
  const S = G.wish = { level: 1, cur: null, best: null, legends: [], busy: false, open: false, lastKeys: '' };
  if (G.ai) { G.ai.gaps.wish = 4000; G.ai.caps.wish = 40; G.ai.gaps.wishcheck = 4000; G.ai.caps.wishcheck = 160; G.ai.LABEL.wish = 'The wishes of the pond'; G.ai.LABEL.wishcheck = 'Checking the creatures against the wish'; }
  const live = function () { return G.mode === 'play' && !G.catching && G.W && !G.W.title && G.host && G.host.ready && G.host.caps && G.host.caps.ai && G.ai.provider === 'server' && G.ai.hasFuel(); };
  const esc = function (s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  const brief = function () { try { return G.worldBrief ? G.worldBrief() : {}; } catch (e) { return {}; } };

  // ── the card ──
  let box = null;
  function ui() {
    if (box || typeof document === 'undefined') return box;
    const st = document.createElement('style');
    st.textContent = '#wish{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:2;width:min(470px,calc(100vw - 28px));padding:8px 14px;border-radius:18px;cursor:pointer;font:500 12.5px system-ui,sans-serif;color:#cfe8ff;line-height:1.35}' +
      '#wish .wk{font:700 9.5px system-ui,sans-serif;letter-spacing:.2em;color:#f6d365;text-transform:uppercase;display:flex;justify-content:space-between;gap:10px}' +
      '#wish .wt{font:700 15px system-ui,sans-serif;color:#fff;margin:2px 0 1px}' +
      '#wish .wbar{height:7px;border-radius:4px;background:rgba(207,232,255,.14);overflow:hidden;margin:5px 0 3px;position:relative}#wish .wbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#33d6a6,#f6d365);transition:width .6s}#wish .wbar b{position:absolute;top:-2px;bottom:-2px;left:' + NEED * 10 + '%;width:2px;background:#fff;opacity:.7}' +
      '#wish .wk{display:flex;justify-content:space-between;gap:10px;white-space:nowrap}#wish .wk span:last-child{letter-spacing:.06em;text-transform:none;font-size:11px;color:#ffe9a8}#wish .wt{font-size:17px !important;line-height:1.25;margin:3px 0 6px}' +
      '#wish .wrow{display:flex;justify-content:space-between;font:600 12px system-ui,sans-serif;color:#dcecff}#wish .wrow b{color:#f6d365;font-size:13px}#wish .wrow span:last-child{color:#b9cde2;font-weight:500}' +
      '#wish .wsub{font:500 12.5px/1.4 system-ui,sans-serif;color:#eaf4ff;white-space:normal !important;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px}#wish.open .wsub{display:block}#wish .wsub u{text-decoration:none;font:800 9px system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#8fb2d6;margin-right:5px}' +
      '#wish .wfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:9px;padding-top:9px;border-top:1px solid rgba(207,232,255,.16)}#wish .wfoot span{font:500 11.5px/1.4 system-ui,sans-serif;color:#b9cde2;white-space:normal}#wish .wfoot .wbtn{flex:none;margin:0;background:#f6d365;color:#1a2433;border-color:#f6d365;font-weight:800}' +
      '#wish #wishMin{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin-left:8px;border-radius:50%;text-decoration:none;font-size:11px;color:#cfe8ff;background:rgba(7,18,31,.55);border:1px solid rgba(207,232,255,.25);vertical-align:middle}#wish #wishMin:hover{border-color:#f6d365;color:#f6d365}#wish.min{width:auto;max-width:min(470px,calc(100vw - 28px));padding:7px 14px}#wish.min .wk{align-items:center}#wish.min .wmt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-transform:none;letter-spacing:0;font:700 12.5px system-ui,sans-serif;color:#fff}' +
      '#wish .wmore{display:none;margin-top:8px;padding-top:8px;border-top:1px solid rgba(207,232,255,.14)}#wish.open .wmore{display:block}' +
      '#wish .wmore p{margin:0;font-size:12px;line-height:1.45;color:#cfe8ff;opacity:.9}#wish .wsay{font-style:italic;font-size:13px !important;color:#fff !important;opacity:1 !important}' +
      '#wish .wlab{font:700 9px system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#f6d365;opacity:.85;margin:9px 0 3px}' +
      '#wish .wneeds{display:flex;flex-wrap:wrap;gap:5px}#wish .wchip{display:inline-flex;align-items:center;height:22px;padding:0 10px;border-radius:11px;background:rgba(51,214,166,.14);border:1px solid rgba(51,214,166,.45);font:600 11.5px system-ui,sans-serif;color:#dffbf1;white-space:nowrap}' +
      '#wish .wfoot{display:flex;justify-content:flex-end;margin-top:10px}' +
      '#wish .wbtn{padding:0 14px;height:32px;border-radius:999px;border:1px solid rgba(207,232,255,.25);background:rgba(7,18,31,.45);color:#cfe8ff;font:700 10px system-ui,sans-serif;letter-spacing:.14em;cursor:pointer}' +
      '#wish small{opacity:.8}#wish .wsub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#wish.open{z-index:90;background:rgba(9,28,40,.97)}#wish .wdream{display:flex;align-items:center;gap:9px;font:600 13px system-ui,sans-serif;color:#fff;padding:3px 0}#wish .wdot{width:9px;height:9px;border-radius:50%;background:#f6d365;animation:wishp 1s ease-in-out infinite}@keyframes wishp{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}#wish.open .wsub{white-space:normal}' +
      '@media (min-width:721px){#banner.show{transform:translate(-50%,112px) !important}}' +
      '@media (max-width:720px){#wish{top:auto;bottom:74px;font-size:12px}#wish .wt{font-size:13.5px}}@media (max-height:560px){#wish .wsub{display:none}}';
    document.head.appendChild(st);
    box = document.createElement('div'); box.id = 'wish'; box.className = 'glass hide';
    (document.getElementById('ui') || document.body).appendChild(box);
    box.addEventListener('click', function (e) {
      if (e.target && e.target.id === 'wishMin') { e.stopPropagation(); S.min = !S.min; try { localStorage.setItem('primordia.wishMin', S.min ? '1' : ''); } catch (er) {} if (G.sfx) G.sfx('click'); draw(); return; }
      if (S.min) { S.min = false; try { localStorage.setItem('primordia.wishMin', ''); } catch (er) {} if (G.sfx) G.sfx('click'); draw(); return; }
      if (e.target && e.target.id === 'wishAnother') { e.stopPropagation(); another(); return; }
      if (e.target && e.target.id === 'wishCheck') { e.stopPropagation(); check(true); draw(); return; }
      S.open = !S.open; box.classList.toggle('open', S.open); if (G.sfx) G.sfx('click');
    });
    return box;
  }
  function draw() {
    if (!ui()) return;
    const on = G.mode === 'play' && G.W && !G.W.title && (S.cur || S.busy);
    box.classList.toggle('hide', !on);
    if (!on) return;
    if (S.busy || !S.cur) { box.classList.remove('open'); S.open = false; box.innerHTML = '<div class="wk"><span>✦ The wish of the pond</span></div><div class="wdream"><span class="wdot"></span>' + (S.asked === 'another' ? 'The pond is dreaming of something else…' : S.asked === 'next' ? 'The pond is dreaming its next wish…' : 'The pond is dreaming…') + '</div>'; return; }
    const b = S.best, pct = b ? Math.round(b.close * 10) : 0;
    if (S.min === undefined) { try { S.min = !!localStorage.getItem('primordia.wishMin'); } catch (er) { S.min = false; } }
    box.classList.toggle('min', !!S.min);
    if (S.min) { box.classList.remove('open'); S.open = false; box.innerHTML = '<div class="wk" title="Open the wish"><span>✦ Wish</span><span class="wmt">' + esc(S.cur.title) + '</span><span>' + (b ? b.close : 0) + ' of 10 ▸</span></div>'; return; }
    const here = (G.W && G.W.wishN) || 0;
    box.innerHTML = '<div class="wk"><span>✦ The pond wishes for</span><span>' + (here ? '★ ' + here + ' granted in this pond' : '') + '<u id="wishMin" title="Fold away">▾</u></span></div>' +
      '<div class="wt">' + esc(S.cur.title) + '</div>' +
      '<div class="wrow"><span>Closest creature: <b>' + (b ? b.close : 0) + ' of 10</b></span><span>comes true at ' + NEED + '</span></div>' +
            '<div class="wbar"><i style="width:' + pct + '%"></i><b></b></div>' +
      '<div class="wsub">' + (b ? '<u>Still missing</u> ' + esc(String(b.why).replace(/\.+$/, '')) + '.' : 'Nobody has been looked at yet.') + (G.ai.over && G.ai.over('wishcheck') ? ' <b style="color:#ff9db0">Looking is OFF: its budget for this pond is used up.</b>' : '') + '</div>' +
      '<div class="wfoot"><span>' + (S.note || 'The pond looks at its creatures only when you ask. One look costs about a third of a cent.') + '</span><button class="wbtn" id="wishCheck"' + (S.checking || (G.ai.over && G.ai.over('wishcheck')) ? ' disabled style="opacity:.5"' : '') + '>' + (S.checking ? 'LOOKING…' : 'CHECK NOW') + '</button></div>' +
      '<div class="wmore"><p class="wsay">“' + esc(S.cur.text) + '”</p>' +
      '<div class="wlab">It must have</div><div class="wneeds">' + S.cur.needs.map(function (n) { return '<span class="wchip">' + esc(n) + '</span>'; }).join('') + '</div>' +
      (S.cur.hint ? '<div class="wlab">A thought</div><p>' + esc(S.cur.hint) + '</p>' : '') +
      '<div class="wlab">How</div><p>' + (S.level > 1 ? 'This is wish number ' + S.level + ' for you; each one is a little harder than the last. ' : '') + 'It comes true when a living creature reaches ' + NEED + ' of 10. You steer: ADD things, cause WORLD events, ★ KEEP and ♥ BREED the ones heading the right way.</p>' +
      (S.legends.length ? '<div class="wlab">Wishes you granted before, in any pond</div><p>' + S.legends.slice(-4).reverse().map(function (l) { return esc(l.title) + (l.name ? ' (' + esc(l.name) + ')' : ''); }).join(' · ') + '</p>' : '') +
      '<div class="wfoot"><button class="wbtn" id="wishAnother">A DIFFERENT WISH</button></div></div>';
  }

  // ── asking the server ──
  function take(r) {
    if (!r) return;
    if (typeof r.level === 'number') S.level = r.level;
    if (Array.isArray(r.legends)) S.legends = r.legends;
    if (r.wish && (!S.cur || S.cur.id !== r.wish.id)) { S.cur = r.wish; S.best = null; S.lastKeys = ''; if (G.mode === 'play' && G.banner) G.banner('The pond wishes for', r.wish.title + '. ' + (r.wish.text || ''), 7000); }
    else if (r.wish) S.cur = r.wish;
  }
  function fetchWish(extra) {
    if (S.busy || !live() || !G.ai.allow('wish')) return;
    S.busy = true; S.asked = extra && extra.another ? 'another' : 'first'; draw();
    const p = { op: 'get', pond: brief(), model: G.ai.model || undefined }; if (extra) for (const k in extra) p[k] = extra[k];
    G.host.call('wish', p, 60000).then(function (r) { S.busy = false; G.ai.tally('wish', r && r.source, r && r.usd); take(r); draw(); }, function () { S.busy = false; draw(); });
  }
  function another() { if (!S.cur) return; if (G.sfx) G.sfx('click'); fetchWish({ another: 1 }); }

  // one living creature of each kind of look, the commonest first
  function candidates(max) {
    const W = G.W, by = {}, keys = [];
    for (let i = 0; i < W.cre.length; i++) { const c = W.cre[i]; if (c.dead || !c.g || !c.g.f) continue; const k = (G.shapeOf ? G.shapeOf(c.g) : '') + '|' + (G.hueOf ? G.hueOf(c.g) : 0); if (!by[k]) { by[k] = { n: 0, c: c }; keys.push(k); } by[k].n++; if (G.charmOf && G.charmOf(c) > G.charmOf(by[k].c)) by[k].c = c; }
    keys.sort(function (a, b) { return by[b].n - by[a].n; });
    return keys.slice(0, max).map(function (k) { return by[k].c; });
  }
  // The pond looks at its creatures against the wish only when the player asks (the CHECK NOW button): looking costs, and looking every minute cost more than it told.
  function check(asked) {
    const W = G.W;
    if (!asked) return;
    S.note = '';
    if (!S.cur || S.busy || S.checking || !live() || !G.sheet || W.cre.length < 4) { S.note = !live() ? 'No AI is connected.' : 'Not just now.'; return; }
    const picks = candidates(8); if (picks.length < 1) { S.note = 'Nobody to look at yet.'; return; }
    const sig = picks.map(function (c) { return G.form.key(c.g.f); }).join('~');
    if (sig === S.lastKeys) { S.note = 'Nothing has changed since the last look.'; return; }                           // nothing new to look at: no charge
    if (!G.ai.allow('wishcheck')) { S.note = G.ai.over && G.ai.over('wishcheck') ? 'Its budget for this pond is used up.' : 'One moment: it has only just looked.'; return; }
    const img = G.sheet(picks.map(function (c) { return c.g.f; }), { cw: 200, ch: 206, sc: 0.55, cols: 4 });
    if (!img) return;
    S.checking = true; S.lastKeys = sig;
    const wishId = S.cur.id;
    G.host.call('wish', { op: 'check', image: img, mime: 'image/jpeg', count: picks.length, model: G.ai.model || undefined }, 90000).then(function (r) {
      S.checking = false;
      G.ai.tally('wishcheck', r && r.source, r && r.usd);
      if (G.W !== W || !S.cur || S.cur.id !== wishId || !r || !Array.isArray(r.marks)) return;
      let top = null;
      for (let i = 0; i < r.marks.length; i++) { const m = r.marks[i], c = picks[m.id - 1]; if (!c) continue; if (!top || m.close > top.close) top = { close: m.close, why: m.why, c: c }; }
      if (!top) return;
      const sp = top.c.sp && G.speciesById ? G.speciesById(top.c.sp) : null;
      if (!S.best || top.close >= S.best.close || W.gen - S.best.gen > 12) S.best = { close: top.close, why: top.why, name: sp ? sp.name : '', gen: W.gen };
      if (top.close >= NEED && !top.c.dead) grant(top.c, top); else draw();
    }, function () { S.checking = false; });
  }

  // ── it came true ──
  function story() {
    const W = G.W, bits = [];
    (W.zones || []).slice(-4).forEach(function (z) { bits.push(z.word + ' (dropped in generation ' + z.born + ')'); });
    (W.events || []).slice(-3).forEach(function (e) { bits.push(e.name + ' (generation ' + e.g + ')'); });
    return 'Born in generation ' + W.gen + (bits.length ? '. In its world: ' + bits.join(', ') : ', in a quiet pond') + '.';
  }
  function grant(c, top) {
    const W = G.W, wish = S.cur, sp = c.sp && G.speciesById ? G.speciesById(c.sp) : null;
    let item = null;
    try { item = G.keep ? G.keep(c) : null; } catch (e) { console.error(e); }
    if (item) item.age = ('Legend · ' + wish.title).slice(0, 70);          // the collection shows this line under its name
    const name = item ? item.name : (sp ? sp.name : 'A creature');
    if (G.sfx) G.sfx('discovery');
    if (G.select) G.select(c); if (G.focusOn) G.focusOn(c.x, c.y, 2.2);
    if (G.banner) G.banner('A wish came true', wish.title + ': ' + name + '. ' + top.why + '. It is a Legend now, kept in your collection (BOOK).', 11000);
    if (G.log) G.log('disc', 'A wish came true: ' + wish.title, name + ' is a Legend. ' + top.why + '. ' + story());
    if (W.discLog) W.discLog.push({ key: 'wish' + wish.id, text: 'A wish came true: ' + wish.title + '. ' + name + ' became a Legend. ' + story(), gen: W.gen });
    if (G.markDirty) G.markDirty();
    S.cur = null; S.best = null; S.busy = true; S.asked = 'next'; draw();
    W.wishN = (W.wishN || 0) + 1;

  function drawSpeciesTree(cv, note) {
    const W = G.W, ctx = cv.getContext('2d'), w = cv.width, h = cv.height;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, w, h);
    const list = W.species.slice().sort(function (a, b) { return a.born - b.born || a.id - b.id; });
    if (list.length < 2) { note.textContent = 'The tree grows as species split apart. Give it a few generations.'; return; }
    const g0 = 1, g1 = Math.max(W.gen, 2), pad = 40;
    const X = function (g) { return pad + (w - pad * 2) * (g - g0) / (g1 - g0); };
    const lane = {};
    list.forEach(function (s, i) { lane[s.id] = i; });
    const lh = Math.min(26, (h - pad * 2) / list.length);
    const Y = function (id) { return pad + lh * lane[id] + lh / 2; };
    list.forEach(function (s) {
      const col = G.hsl(s.hue, 75, 65, 1);
      const end = s.extinct ? s.diedGen : g1;
      const y = Y(s.id);
      if (s.parent && lane[s.parent] !== undefined) {
        ctx.strokeStyle = G.rgba(PAL.frost, 0.25); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(X(s.born), Y(s.parent)); ctx.bezierCurveTo(X(s.born), y, X(s.born) + 8, y, X(s.born) + 14, y); ctx.stroke();
      }
      ctx.strokeStyle = col; ctx.globalAlpha = s.extinct ? 0.5 : 0.95; ctx.lineCap = 'round';
      const hist = s.hist || [];
      for (let k = 0; k < hist.length; k++) {
        const gen = Math.max(s.born, g1 - hist.length + 1 + k), gx = X(gen);
        ctx.lineWidth = Math.max(2, Math.min(lh * 0.8, Math.sqrt(hist[k]) * 1.2));
        ctx.beginPath(); ctx.moveTo(gx, y); ctx.lineTo(X(Math.min(g1, gen + 1)), y); ctx.stroke();
      }
      ctx.globalAlpha = 1;
      if (s.extinct) { ctx.fillStyle = G.rgba(PAL.rose, 0.8); ctx.beginPath(); ctx.arc(X(end), y, 4, 0, 6.2832); ctx.fill(); }
      if (lh >= 14) { ctx.fillStyle = G.rgba(PAL.frost, 0.85); ctx.font = '14px system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.fillText(s.name, X(s.born) + 16, y - lh * 0.3 - 1); }
    });
    ctx.fillStyle = G.rgba(PAL.frost, 0.5); ctx.font = '16px system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.fillText('gen 1', 6, h - 8);

        '<div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0 0;margin-top:4px;border-top:1px solid rgba(207,232,255,.15)"><span>Total</span><span><b style="color:var(--gold)">' + G.ai.money(t.usd) + '</b> · <b>' + t.fresh + '</b> new answers · ' + (t.asked - t.fresh) + ' reused for free' + (t.unpriced ? ' · ' + t.unpriced + ' with no price set' : '') + '</span></div>', root);
      el('div', 'desc', 'Breeding and selection never ask the AI: they run every generation on their own, using the learned guess the pond keeps of what the watcher likes. The watcher looks by the clock (so at fast-forward more generations pass between looks); plans and marvels come by the generation (so a faster pond asks for those sooner). Each kind has a budget you can set in the costs sheet.', root).style.marginTop = '6px';
      el('h3', '', 'WHO IMAGINES', root).style.cssText = 'font-size:12px;letter-spacing:.2em;margin:14px 0 4px;color:var(--gold)';
      el('div', 'desc', 'The AI that decides what your words become, and suggests mutations. Each one imagines differently.', root);
      const row = el('div', 'chips', '', root);
      const cur = G.ai.model || (G.ai.models[0] && G.ai.models[0].id);
      G.ai.models.forEach(function (m) {
        const b = el('button', 'chip', esc(m.label), row);
        if (m.id === cur) b.style.cssText = 'border-color:var(--gold);box-shadow:0 0 12px rgba(246,211,101,.35)';
        b.onclick = function () { G.ai.model = m.id; G.sfx('click'); G.markDirty(); const kids = row.children; for (let i = 0; i < kids.length; i++) kids[i].style.cssText = ''; b.style.cssText = 'border-color:var(--gold);box-shadow:0 0 12px rgba(246,211,101,.35)'; if (G.W) { G.W.pool = []; G.W.poolBusy = false; G.ai.refill(); } };
      });
    }
    if (withStart && G.mode === 'play') {
      const st = el('button', 'btn sm rose', 'START OVER', root); st.style.marginTop = '14px';
      st.onclick = function () { G.confirm('Erase the saved pond, guide and fossils?', 'ERASE', function () { G.closeMenu(); G.eraseSave(); G.W.fossils = []; G.newPond({}); }); };
    }
  }

  // ── title screen ──
  G.buildTitle = function () {
    const t = el('div', 'overlay', '', $('ui')); t.id = 'title';
    const tc = touchy();
    const keys = [
      ['T', 'ADD', 'Add a thing'], ['', 'WORLD', 'Weather and disasters'], ['1 2 3 4', 'SPEED', 'Fast-forward'], ['Space', 'PAUSE', 'Pause time'],
      ['F', 'BOOK', 'Book of Life'], ['G', 'TREE', 'Family tree'], ['Click', 'TAP', 'Inspect a creature'], ['N', 'NEW', 'A new pond'],
    ];
    t.innerHTML = '<h1>PRIMORDIA</h1><div class="tag">Be nature. Watch life invent itself.</div>' +
      '<div class="actions"><button class="btn big pulse" id="tBegin">BEGIN</button><button class="btn big hide" id="tCont">CONTINUE</button></div>' +
      '<div class="nature">you are nature · nothing here is scripted</div>' +
      '<div class="glass keys">' + keys.map(function (k) { return '<div>' + (tc ? '<span class="kc">' + k[1] + '</span>' : '<span class="kc">' + (k[0] || k[1]) + '</span>') + '<span>' + k[2] + '</span></div>'; }).join('') + '</div>' +
      '<div class="sound-row"><button class="btn sm" id="tSound">' + ICON.speaker + 'SOUND</button></div>';
    $('tBegin').onclick = function () { G.sfx('click'); G.beginGame(); };
    $('tSound').onclick = function () { G.sfx('click'); G.openMenu(); };
    $('tCont').onclick = function () { G.sfx('click'); G.beginGame(true); };
    UI.titleEl = t;
  };
  G.showContinue = function (on) { const c = $('tCont'); if (c) c.classList.toggle('hide', !on); const b = $('tBegin'); if (b && on) b.textContent = 'NEW POND'; };

  G.beginGame = function (cont) {
    if (G.mode === 'play') return;
    const sv = cont ? G.pendingSave : null;
    if (sv) { G.applySave(sv); }
    else { G.startPond({}); }
    G.mode = 'play';
    G.setSpeed(1);
    G.showHud(true);
    UI.titleEl.classList.add('out');
    setTimeout(function () { if (UI.titleEl) UI.titleEl.classList.add('hide'); }, 950);
    G.emit('begin');
    // the pond went on living while the game was closed
    if (sv && sv.at) G.startCatchUp((Date.now() - sv.at) / 1000);
    // the server already lived the time for us: show what it found
    if (sv && G.pendingReport) { const r = G.pendingReport; G.pendingReport = null; setTimeout(function () { G.showAwayReport(r); }, 400); }
  };

  // ── keys ──
  G.on('key', function (k, e) {
    if (G.mode === 'title') {
      if (k === 'Enter' || k === ' ') { if (!UI.menuOpen) G.beginGame(); }
      if (k === 'm') { if (window.PXS && PXS.toggleMute) PXS.toggleMute(); }
      if (k === 'Escape' && UI.menuOpen) G.closeMenu();
      return;
    }
    if (G.mode !== 'play') return;
    if (k === 'm') { if (window.PXS && PXS.toggleMute) PXS.toggleMute(); return; }
    if (k === 'Escape') {
      if (UI.menuOpen) G.closeMenu();
      else if (UI.modal && UI.modal !== 'still') closeModal();
      else if (UI.placing || UI.meteor) G.cancelPlacing();
      else if (UI.popName) G.closePop();
      else if (G.R.sel) G.select(null);
      else G.openMenu();
      return;
    }
    if (UI.menuOpen || (UI.modal && UI.modal !== 'still')) {
      if ((k === 'f' && UI.modal === 'guide') || (k === 'g' && UI.modal === 'tree')) closeModal();
      return;
    }
    if (UI.modal) return;
    if (k === ' ') G.togglePause();
    else if (k === '1') G.setSpeed(1);
    else if (k === '2') G.setSpeed(4);
    else if (k === '3') G.setSpeed(16);
    else if (k === '4') G.setSpeed(64);
    else if (k === '=' || k === '+') G.zoomAt(1.35);
    else if (k === '-') G.zoomAt(1 / 1.35);
    else if (k === '0') { G.cam.z = 1; G.applyCam(); }
    else if (k === 't') G.act('add');
    else if (k === 'f') G.act('guide');
    else if (k === 'g') G.act('tree');
    else if (k === 'n') G.act('new');
  });
  G.on('escape', function () { if (G.mode === 'play' && UI.popName) G.closePop(); });
  G.on('speed', function () { if (UI.popName === 'speed') G.closePop(); });
})();

<script data-part="away">
// ── While you are away the pond stops. ──
// Its clock runs only while you watch: close the game or leave the tab and it comes back exactly as you left it. (It used
// to catch up, living the time you were gone by itself, but most of what happens in a pond is imagined by the AI while you
// watch, so time lived without it was not the same pond.) The catching-up below is kept, switched off: G.awayLives = true brings it back.
(function () {
  'use strict';
  const el = G.el, $ = G.$, esc = G.escapeHtml;
  const MAX_AWAY = 32 * 150;          // at most 150 generations of catching up (about 80 minutes of pond time)
  const MIN_AWAY = 25;                // seconds; shorter than this is just looking away
  let job = null, hiddenAt = 0;
  G.catching = false;
  G.awayLives = false;

  G.startCatchUp = function (seconds, label) {
    const W = G.W;
    if (!G.awayLives || !W || W.title || W.extinct || !(seconds >= MIN_AWAY)) return false;
    const target = Math.min(seconds, MAX_AWAY);
    job = {
      target: target, done: 0, real: seconds, label: label || 'away',
      gen0: W.gen, sp0: new Set(W.species.map(function (s) { return s.id; })), disc0: W.discLog.length, fos0: W.fossils.length,
      pop0: W.cre.length, fit0: W.hist.length ? W.hist[W.hist.length - 1].avg : 0, t0: performance.now(), skipped: false,
    };
    G.catching = true;
    G.prevMode = G.mode;
    G.mode = 'catchup';
    G.closeMenu && G.closeMenu();
    G.closeModal && G.closeModal();
    const o = el('div', 'overlay', '', $('ui')); o.id = 'catchup'; o.style.zIndex = 20;
    o.innerHTML = '<div class="glass sheet" style="width:min(460px,100%);align-items:center;text-align:center"><h2 style="font-size:18px;letter-spacing:.2em;margin-bottom:8px">THE POND KEPT GOING</h2>' +
      '<small id="cuLine" style="margin-bottom:12px"></small><div class="meter" style="width:100%;height:10px"><i id="cuBar" style="width:0;background:linear-gradient(90deg,#ff7eb6,#f6d365,#33d6a6)"></i></div>' +
      '<div class="ilabel" id="cuGen" style="margin:10px 0 12px">generation ' + W.gen + '</div><button class="btn sm" id="cuSkip">SKIP AHEAD</button></div>';
    job.el = o;
    $('cuLine').textContent = 'You were away ' + fmtTime(seconds) + '. Life went on without you…';
    $('cuSkip').onclick = function () { job.skipped = true; };
    return true;
  };

  function fmtTime(s) {
    s = Math.round(s);
    if (s < 90) return s + ' seconds';
    if (s < 5400) return Math.round(s / 60) + ' minutes';
    if (s < 172800) return (s / 3600).toFixed(1).replace('.0', '') + ' hours';
    return Math.round(s / 86400) + ' days';
  }

  function finish() {
    const W = G.W, j = job;
    job = null;
    G.catching = false;
    G.mode = G.prevMode || 'play';
    if (j.el) j.el.remove();
    const gens = W.gen - j.gen0;
    const last = W.hist.length ? W.hist[W.hist.length - 1] : null;
    if (W.extinct) { G.emit('extinct'); return; }
    if (gens < 1) return;
    G.showAwayReport({
      gens: gens, alive: W.cre.length, fitness: last ? last.avg : 0,
      newSpecies: W.species.filter(function (s) { return !j.sp0.has(s.id); }).length,
      diedOut: W.species.filter(function (s) { return s.extinct && s.diedGen > j.gen0; }).length,
      discoveries: W.discLog.slice(j.disc0).map(function (d) { return d.text; }),
      capped: j.target < j.real, capGens: Math.round(MAX_AWAY / 32),
    });
  }

  // what happened while the player was away (made here, or by the server)
  G.showAwayReport = function (r) {
    const W = G.W;
    const gens = r.gens, newSp = r.newSpecies || 0, died = r.diedOut || 0, found = r.discoveries || [];
    const rows = [
      '<b>' + gens + '</b> generations passed' + (r.capped ? ' <small>(the pond catches up at most ' + (r.capGens || 150) + ' generations)</small>' : ''),
      '<b>' + (r.alive !== undefined ? r.alive : W.cre.length) + '</b> creatures alive' + (r.fitness ? ' · average fitness <b>' + (+r.fitness).toFixed(2) + '</b>' : ''),
      newSp ? '<b>' + newSp + '</b> new species appeared' : 'No new species appeared',
      died ? '<b>' + died + '</b> species died out' : 'No species died out',
    ];
    const disc = found.length ? '<div class="ilabel" style="margin-top:12px">Evolution invented</div>' + found.slice(0, 5).map(function (t) { return '<div style="margin:4px 0;color:var(--gold)">' + esc(t) + '</div>'; }).join('') : '';
    const o = el('div', 'overlay', '', $('ui')); o.id = 'awayReport'; o.style.zIndex = 15;
    o.innerHTML = '<div class="glass sheet" style="width:min(480px,100%);align-items:flex-start"><h2 style="font-size:17px;letter-spacing:.2em;margin-bottom:10px">WHILE YOU WERE AWAY</h2>' + rows.map(function (r) { return '<div style="margin:5px 0;line-height:1.4">' + r + '</div>'; }).join('') + disc +
      '<div style="margin-top:14px;align-self:center"><button class="btn big" id="arGo">SEE THE POND</button></div></div>';
    $('arGo').onclick = function () { o.remove(); G.sfx && G.sfx('click'); G.hint('nature', 'You are nature: change the world and see how life answers.', 6000); };
    G.log && G.log('sel', 'Away', gens + ' generations passed while you were gone.');
    G.emit('catchup-done', gens);
  };

  G.addSystem({
    name: 'away',
    update: function () {
      if (!job) return;
      const W = G.W;
      const t0 = performance.now();
      // spend about 16 ms of every frame catching up
      while (job.done < job.target && !job.skipped && !W.extinct && performance.now() - t0 < 16) {
        for (let i = 0; i < 20 && job.done < job.target; i++) { G.step(0.1); job.done += 0.1; }
      }
      const bar = $('cuBar'), gen = $('cuGen');
      if (bar) bar.style.width = Math.min(100, 100 * job.done / job.target).toFixed(1) + '%';
      if (gen) gen.textContent = 'generation ' + W.gen + ' · ' + W.cre.length + ' alive';
      if (job.done >= job.target || job.skipped || W.extinct) finish();
    },
  });

  // leaving the tab and coming back counts as being away too
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { hiddenAt = Date.now(); if (G.mode === 'play') G.saveNow && G.saveNow(); return; }
    if (hiddenAt && G.mode === 'play' && !G.paused) {
      const s = (Date.now() - hiddenAt) / 1000;
      hiddenAt = 0;
      if (s >= MIN_AWAY) G.startCatchUp(s);
    }
    hiddenAt = 0;
  });
})();

</script>
<script data-part="tree">
// ── The family tree, made to be read: cards with pictures and plain words instead of a diagram ──
(function () {
  'use strict';
  const PAL = G.PAL, el = G.el, $ = G.$, esc = G.escapeHtml, UI = G.ui;
  const FOOD = ['gold', 'lime', 'green', 'blue', 'violet', 'pink'];
  const PARTS = ['mouth', 'fin', 'spike', 'armour plate', 'eye', 'lamp', 'poison gland', 'tail', 'cilia fringe'];

  function plural(n, w) { return n + ' ' + (n === 1 ? w : /s$|x$/.test(w) ? w + 'es' : /y$/.test(w) ? w.slice(0, -1) + 'ies' : w + 's'); }

  /** What is different in body b compared with body a, in plain words (most important first). */
  G.genomeDiff = function (a, b) {
    const pa = G.derive(a), pb = G.derive(b), out = [];
    const push = function (t, good) { out.push({ t: t, good: good !== false }); };
    // the body first: what grew, what was lost, what it turned into
    const ka = G.form.kind(a.f), kb = G.form.kind(b.f);
    if (ka.kind !== kb.kind) push('became a ' + kb.kind.toLowerCase() + ' (was a ' + ka.kind.toLowerCase() + ')');
    const fd = G.form.diff(a.f, b.f);
    for (let i = 0; i < fd.length; i++) push(fd[i][0], fd[i][1]);
    // organs
    const orgs = function (g) { const o = {}; for (let i = 0; i < g.p.length; i++) o[g.p[i].k] = 1; return o; };
    const oa = orgs(a), ob = orgs(b);
    for (const k in ob) if (!oa[k]) { const o = G.organOf(+k); if (o) push('new organ: ' + o.name); }
    for (const k in oa) if (!ob[k]) { const o = G.organOf(+k); if (o) push('lost its ' + o.name, false); }
    // size, speed
    if (Math.abs(pb.r - pa.r) / pa.r > 0.12) push((pb.r > pa.r ? 'bigger: ' : 'smaller: ') + pa.r.toFixed(0) + ' → ' + pb.r.toFixed(0), true);
    if (Math.abs(pb.speed - pa.speed) / pa.speed > 0.15) push((pb.speed > pa.speed ? 'faster: ' : 'slower: ') + pa.speed.toFixed(0) + ' → ' + pb.speed.toFixed(0), pb.speed > pa.speed);
    // way of life
    if (pb.photo > 0.3 && pa.photo <= 0.3) push('now feeds on light');
    for (let i = 0; i < 6; i++) {
      if (pb.dig[i] >= 0.5 && pa.dig[i] < 0.5) push('can now eat ' + FOOD[i] + ' food');
      else if (pb.dig[i] < 0.2 && pa.dig[i] >= 0.2) push('can no longer eat ' + FOOD[i] + ' food', false);
    }
    const RES = ['heat', 'cold', 'poison'];
    for (let i = 0; i < 3; i++) if (pb.res[i] >= 0.5 && pa.res[i] < 0.5) push(RES[i] + '-proof');
    // brain
    if (b.h !== a.h) push(b.h > a.h ? 'brain grew: ' + plural(b.h, 'thinking cell') : 'a simpler brain', b.h > a.h);
    else if (Math.abs(b.w.length - a.w.length) >= 3) push('brain rewired: ' + a.w.length + ' → ' + b.w.length + ' wires', b.w.length > a.w.length);
    let dh = Math.abs(pb.hue - pa.hue); if (dh > 180) dh = 360 - dh;
    if (dh > 45) push('changed colour');
    return out.slice(0, 5);
  };

  function picture(parent, genome, id, px, skin) {
    const cv = el('canvas', '', '', parent);
    cv.width = cv.height = px * 2; cv.style.cssText = 'width:' + px + 'px;height:' + px + 'px;display:block;margin:0 auto';
    const pv = G.preview(genome, id || 3); pv.ang = -0.35; pv.glow = 0.7;
    G.drawFit(cv.getContext('2d'), pv, px, px, px * 0.88, 1.2);
    return cv;
  }
  function card(row, genome, id, title, sub, diffs, mark, skin) {
    const c = el('div', '', '', row);
    c.style.cssText = 'flex:0 0 172px;padding:10px;border-radius:14px;background:rgba(7,18,31,.5);border:1px solid ' + (mark ? 'var(--gold)' : 'rgba(207,232,255,.14)') + ';' + (mark ? 'box-shadow:0 0 16px rgba(246,211,101,.25)' : '');
    picture(c, genome, id, 104, skin);
    el('div', '', '<b style="font-size:13px">' + esc(title) + '</b>', c).style.cssText = 'text-align:center;margin-top:4px;line-height:1.25';
    el('div', '', esc(sub), c).style.cssText = 'text-align:center;font-size:11px;color:rgba(207,232,255,.65);margin-bottom:6px';
    if (diffs === null) el('div', '', 'where this line begins', c).style.cssText = 'font-size:12px;color:rgba(207,232,255,.6);text-align:center';
    else if (!diffs.length) el('div', '', 'only small changes', c).style.cssText = 'font-size:12px;color:rgba(207,232,255,.6);text-align:center';
    else diffs.forEach(function (d) { const w = d.good && G.whyLine ? G.whyLine(d.t) : ''; el('div', '', (d.good ? '+ ' : '− ') + esc(d.t) + (w ? '<div style="font-size:10.5px;line-height:1.25;color:rgba(207,232,255,.6);margin:0 0 3px 10px">' + esc(w) + '</div>' : ''), c).style.cssText = 'font-size:12.5px;line-height:1.35;color:' + (d.good ? 'var(--algae)' : 'var(--rose)'); });
    return c;
  }
  function arrow(row) { el('div', '', '→', row).style.cssText = 'flex:none;align-self:center;font-size:22px;color:rgba(207,232,255,.45)'; }
  function heading(root, title, text) {
    el('h3', '', title, root).style.cssText = 'font-size:13px;letter-spacing:.16em;color:var(--gold);margin:6px 0 2px';
    el('div', '', text, root).style.cssText = 'font-size:12.5px;color:rgba(207,232,255,.75);margin-bottom:8px';
  }
  function strip(root) { const r = el('div', '', '', root); r.style.cssText = 'display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:10px;align-items:stretch'; return r; }

  function renderAncestry(root) {
    root.innerHTML = '';
    const c = G.R.sel;
    if (!c) { el('div', 'empty', 'Click a creature in the pond first, then open the tree to see where it came from.', root); return; }
    // the deep past: species by species (this is remembered even after closing the game)
    const chainS = [];
    let s = G.speciesById(c.sp), guard = 0;
    if (!s) { const fv = G.features(c.g); let bd = 1e9; G.W.species.forEach(function (q) { if (q.extinct || !q.rep) return; const d = G.fdist(fv, q.fv); if (d < bd) { bd = d; s = q; } }); }
    while (s && s.rep && guard++ < 8) { chainS.push(s); s = s.parent ? G.speciesById(s.parent) : null; }
    chainS.reverse();
    if (chainS.length) {
      heading(root, 'ITS DEEP PAST, SPECIES BY SPECIES', chainS.length > 1 ? 'From the oldest kind this creature descends from, to its own kind today. Green is gained, pink is lost.' : 'Its kind has not split from another yet.');
      const row = strip(root);
      chainS.forEach(function (sp, i) {
        if (i) arrow(row);
        card(row, sp.rep, sp.id, sp.name, 'appeared in generation ' + sp.born + (sp.extinct ? ' · died out' : ' · ' + sp.n + ' alive'), i === 0 ? null : G.genomeDiff(chainS[i - 1].rep, sp.rep), i === chainS.length - 1, sp.skin);
      });
    }
    // the recent family: birth by birth
    const chain = [{ g: c.g, gen: c.born, id: c.id, mate: c.mate }];
    let p = c.dad;
    while (p && chain.length < 8) { chain.push({ g: p.g, gen: p.gen, id: p.id, mate: p.mate }); p = p.up; }
    chain.reverse();
    heading(root, 'ITS RECENT FAMILY, BIRTH BY BIRTH', chain.length > 1 ? 'Each card is one birth: a child, and how it differs from its mother.' : 'This creature has no recorded parents (a founder, or the pond was reloaded since).');
    const row2 = strip(root);
    chain.forEach(function (a, i) {
      if (i) arrow(row2);
      card(row2, a.g, a.id, '#' + a.id + (i === chain.length - 1 ? ' (chosen)' : ''), 'born in generation ' + a.gen + (a.mate && a.mate.id ? ' · two parents' : ''), i === 0 ? null : G.genomeDiff(chain[i - 1].g, a.g), i === chain.length - 1);
    });
    // then and now, at a glance
    const first = chainS.length > 1 ? chainS[0].rep : chain.length > 1 ? chain[0].g : null;
    if (first) {
      const all = G.genomeDiff(first, c.g);
      heading(root, 'THEN AND NOW', all.length ? 'Everything that separates this creature from the start of its line:' : 'It is still very like the start of its line.');
      if (all.length) el('div', '', all.map(function (d) { return '<span style="display:inline-block;margin:0 8px 6px 0;padding:5px 10px;border-radius:999px;font-size:12.5px;border:1px solid ' + (d.good ? 'rgba(51,214,166,.6)' : 'rgba(255,126,182,.6)') + '">' + (d.good ? '+ ' : '− ') + esc(d.t) + '</span>'; }).join(''), root);
    }
  }

  function renderSpecies(root) {
    root.innerHTML = '';
    const W = G.W;
    const all = W.species.filter(function (s) { return s.rep; });
    if (all.length < 2) { el('div', 'empty', 'The tree grows as kinds split apart. Give it a few generations.', root); return; }
    const byId = {}; all.forEach(function (s) { byId[s.id] = s; });
    const kids = {}; const roots = [];

      const lane = el('div', '', '', r); lane.style.cssText = 'flex:1;height:12px;border-radius:6px;background:rgba(7,18,31,.55);position:relative;min-width:60px';

      (kids[s.id] || []).slice().sort(function (a, b) { return a.born - b.born; }).forEach(function (ch) { rowOf(ch, depth + 1); });
    };
    roots.sort(function (a, b) { return a.born - b.born; }).forEach(function (s) { rowOf(s, 0); });

<script data-part="budget">
// ── A budget for every thing the AI does ──
// Each kind of AI work has its own budget in dollars FOR THIS POND (what a pond has spent is kept in its save, G.ai.life).
// When a kind has used its budget it stops, in this pond, for good: nothing more is asked of the AI for it, the place where
// it shows says so, and it is marked OFF in the costs sheet (the $ chip, top right). A new pond starts with full budgets.
// The numbers are in one table, here. The server's prices decide what a call costs; this only decides when to stop.
(function () {
  'use strict';
  if (!G.ai) return;
  const A = G.ai;
  //                 dollars for one pond            what one call costs, roughly
  A.budget = {
    thing: 0.40,     // things you type in ADD                     1-2 cents
    figure: 0.80,    // the picture of a typed thing or a monument  4-6 cents
    event: 0.40,     // world events you type in WORLD              2 cents
    nature: 0.25,    // events the pond causes by itself            1.7 cents
    deed: 0.40,      // plans the creatures make                    1.2 cents
    marvel: 0.40,    // rare marvels                                1.2 cents
    icon: 0.50,      // a marvel's picture
    voice: 0.30,     // a line spoken aloud                         13 cents
    sound: 0.15,
    wish: 0.10,      // dreaming a wish                             0.4 cents
    wishcheck: 0.30, // looking whether the wish came true          0.35 cents
    watch: 0.50,     // the watcher grading living creatures        0.4 cents
    judge: 0.30, check: 0.10,
    organ: 0.20, design: 0.20, plan: 0.20, paint: 0.15, story: 0.25, ideas: 0.10,
  };
  A.budgetDefault = 0.20;
  const ALIAS = { 'mutation-ideas': 'ideas' };
  const key = function (k) { return ALIAS[k] || k; };
  A.budgetSet = A.budgetSet || {};      // what the PLAYER set, by kind (dollars for this pond; 0 turns that kind off). It is kept in the pond's save and carried into a new pond.
  A.budgetDefaultOf = function (kind) { const b = A.budget[key(kind)]; return typeof b === 'number' ? b : A.budgetDefault; };
  A.budgetOf = function (kind) { const s = A.budgetSet[key(kind)]; return typeof s === 'number' ? s : A.budgetDefaultOf(kind); };
  A.spentOn = function (kind) { const L = A.life[key(kind)]; return L ? L.usd || 0 : 0; };
  /** has this kind used up its budget in this pond? */
  A.over = function (kind) { return A.spentOn(kind) >= A.budgetOf(kind) - 1e-9; };

  // 1. nothing automatic is asked for once its budget is used
  const allow0 = A.allow;
  A.allow = function (kind) { if (A.over(kind)) return false; return allow0(kind); };
  // 2. what the player types (a thing, a world event) is refused with a clear reason, not quietly made up without the AI
  const ask0 = A.ask;
  A.ask = function (task, input, schema) {
    const kind = task === 'event' && input && typeof input === 'object' && input.auto ? 'nature' : task;
    if ((kind === 'thing' || kind === 'event') && A.provider === 'server' && A.over(kind)) { const e = new Error('budget'); e.budget = true; e.kind = kind; return Promise.reject(e); }
    return ask0(task, input, schema);
  };
  // 3. the moment a budget runs out, say so once
  let told = {};
  const tally0 = A.tally;
  A.tally = function (kind, source, usd) {
    tally0(kind, source, usd);
    const k = key(kind);
    if (!told[k] && A.over(k)) { told[k] = 1; const name = A.LABEL[k] || k; if (G.note) G.note('A budget is used up', name + ' has used its ' + A.money(A.budgetOf(k)) + ' for this pond, so it is off now. See the $ chip for all of them.'); if (G.log) G.log('sel', 'Budget used up', name + ': ' + A.money(A.budgetOf(k)) + ' for this pond. It is off now.'); G.emit('budget-out', k); mark(); }
  };
  G.on('new-pond', function () { told = {}; setTimeout(mark, 50); });
  /** the player sets a budget (dollars for this pond; 0 = off; nothing = back to the usual one) */
  A.setBudget = function (kind, v) {
    const k = key(kind);
    if (v === null || v === undefined || v === '' || !isFinite(+v)) delete A.budgetSet[k]; else A.budgetSet[k] = Math.max(0, Math.min(50, Math.round(+v * 100) / 100));
    delete told[k]; if (G.markDirty) G.markDirty(); setTimeout(mark, 20);
  };
  A.resetBudgets = function () { A.budgetSet = {}; told = {}; if (G.markDirty) G.markDirty(); setTimeout(mark, 20); };

  // 4. it shows: ADD and WORLD are dimmed and badged when they can no longer ask
  function mark() {
    if (typeof document === 'undefined') return;
    const B = document.querySelectorAll('#toolbar button'); if (!B.length) return;
    for (let i = 0; i < B.length; i++) { const b = B[i], t = (b.textContent || '').trim().toUpperCase(), kind = t.indexOf('ADD') === 0 ? 'thing' : t.indexOf('WORLD') === 0 ? 'event' : '';
      if (!kind) continue; const off = A.provider === 'server' && A.over(kind);
      b.style.opacity = off ? '0.45' : ''; b.title = off ? 'Off: its budget for this pond is used up' : '';
      let tag = b.querySelector('.boff'); if (off && !tag) { tag = document.createElement('i'); tag.className = 'boff'; tag.textContent = 'OFF'; tag.style.cssText = 'font:800 8.5px system-ui,sans-serif;font-style:normal;letter-spacing:.08em;color:#ff9db0;margin-left:5px'; b.appendChild(tag); } else if (!off && tag) tag.remove(); }
  }
  if (typeof setInterval !== 'undefined' && typeof document !== 'undefined') setInterval(mark, 3000);

  // the pace of the automatic ones (milliseconds of real time between two of a kind)
  const g = A.gaps, c = A.caps;
  g.deed = 8000; c.deed = 40;      // plans and marvels are spaced by GENERATIONS (see 54_deeds.js and 46b_marvels.js); this only stops two being asked for at once
  g.marvel = 8000;
  g.nature = 300000;
  g.wishcheck = 4000;      // the wish is looked at only when the player presses CHECK NOW; this only stops a double press
})();

<script data-part="audio">
// ── Sound: soft plops, bubbles and chimes, all from Plaxzy's sound library ──
(function () {
  'use strict';
  const SND = {
    click: 'ui/click',
    birth: 'toon/pop',
    mutation: 'magic/sparkle',
    death: 'water/bubbles',
    season: 'arcade/tone',
    drip: 'water/drip',
    discovery: 'magic/heal',
    squeak: 'animal/creature_cute',
    predator: 'animal/creature_monster',
    meteor: 'fight/explosion',
    extinct: 'music/happy_and_sad_tuba_fanfare',
  };
  // quiet things must not turn into noise: each sound has its own breathing space (ms)
  const GAP = { click: 40, birth: 130, mutation: 400, death: 260, season: 800, drip: 200, discovery: 600, squeak: 900, predator: 2500, meteor: 600, extinct: 3000 };
  const last = {};
  let ambient = null, started = false;
  G.sfx = function (name, opts) {
    if (!window.PXS || !SND[name]) return null;
    const now = performance.now();
    if (now - (last[name] || 0) < (GAP[name] || 0)) return null;
    last[name] = now;
    try { return PXS.play(name, opts); } catch (e) { console.error(e); return null; }
  };
  function pan(x) { return G.W ? G.clamp((x / G.W.ww - 0.5) * 1.6, -1, 1) : 0; }
  // the soundtrack starts on the first tap of BEGIN, not before
  G.startSound = function () {
    if (started || !window.PXS) return;
    started = true;
    try {
      PXS.music('music/drifting');
      ambient = PXS.loop('loop/underwater', { speed: 0.2 });
    } catch (e) { console.error(e); }
  };
  G.stopSound = function () {
    started = false;
    try { if (ambient) ambient.stop(); ambient = null; PXS.stopMusic(); PXS.stopSfx(); } catch (e) { console.error(e); }
  };

  G.addSystem({
    name: 'audio',
    init: function () {
      if (window.PXS) { try { PXS.define(SND); } catch (e) { console.error(e); } }
      const calm = function () { return G.mode === 'play' && G.speed <= 4 && !G.isBlocked(); };
      G.on('begin', G.startSound);
      G.on('birth', function (c) { if (calm()) { G.sfx('birth', { volume: 0.7, pan: pan(c.x) }); if (Math.random() < 0.12) G.sfx('squeak', { volume: 0.5, pan: pan(c.x) }); } });
      G.on('mutation', function (c) { if (calm()) G.sfx('mutation', { volume: 0.7, pan: pan(c.x) }); });
      G.on('death', function (c, cause) { if (calm() && cause !== 'starved') G.sfx('death', { volume: 0.55, pan: pan(c.x) }); });
      G.on('season', function () { if (G.mode === 'play' && G.speed <= 16) G.sfx('season', { volume: 0.6 }); });
      G.on('placed', function () { G.sfx('drip', { volume: 0.9 }); });
      G.on('zone', function () { G.sfx('drip', { volume: 0.9 }); });
      G.on('disaster', function (kind) { if (kind === 'meteor') G.sfx('meteor', { volume: 0.8 }); else G.sfx('mutation', { volume: 0.9 }); });
      G.on('discovery', function () { /* the banner plays its own chime */ });
      G.on('eat', function () { /* eating is silent: there are hundreds of meals a season */ });
      G.on('death', function (c, cause, by) { if (cause === 'eaten' && calm() && Math.random() < 0.25) G.sfx('predator', { volume: 0.4, pan: pan(c.x) }); });
      G.on('new-pond', function () { if (window.PXS) { try { PXS.stopSfx(); } catch (e) { console.error(e); } } });
      // the pond hushes when time is fast
      G.on('speed', function (s) { if (ambient && ambient.set) { try { ambient.set({ speed: s === 0 ? 0 : s >= 16 ? 0.7 : 0.2 }); } catch (e) { console.error(e); } } });
    },
  });
})();

    if (!W.cre.length && !W.fossils.length) G.startPond({});
  };

  // ask for the save as soon as the page is up; the title screen shows at once
  G.addSystem({
    name: 'save',
    init: function () {
      if (!hasSave() || typeof Plaxzy.save.load !== 'function') return;
      try {
        Plaxzy.save.load(function (d) {
          try {
            if (G.validSave(d)) { G.pendingSave = G.newerSave(d); if (G.showContinue) G.showContinue(true); }
          } catch (e) { console.error(e); }
        });
      } catch (e) { console.error(e); }
    },
  });
})();

</script>
<script data-part="host">
// ── Talking to the page around the game (and through it, to the Primordia server) ──
// The game runs in a sandbox with no network, so it asks the host page with postMessage:
//   game → host   { __primordia: 1, id, op, payload }      op: hello | ai.thing | ai.ideas | pond.get | pond.put | pond.del
//   host → game   { __primordia: 1, id, ok, data, error }  the answer to one request
//   host → game   { __primordia: 1, op: 'host', caps: { ai: true, pond: true } }   "I can do these"
// With no host (a plain file, or a site that does not know this) nothing happens and the game plays alone.
(function () {
  'use strict';
  const H = G.host = { ready: false, caps: {}, pending: {}, nextId: 1 };

  H.call = function (op, payload, ms) {
    return new Promise(function (resolve, reject) {
      if (!window.parent || window.parent === window) { reject(new Error('no host')); return; }
      const id = H.nextId++;
      const timer = setTimeout(function () { delete H.pending[id]; reject(new Error('timeout')); }, ms || 20000);
      H.pending[id] = { resolve: resolve, reject: reject, timer: timer };
      try { window.parent.postMessage({ __primordia: 1, id: id, op: op, payload: payload }, '*'); }
      catch (e) { clearTimeout(timer); delete H.pending[id]; reject(e); }
    });
  };

  window.addEventListener('message', function (e) {
    const d = e.data;
    if (!d || d.__primordia !== 1 || e.source !== window.parent) return;
    if (d.op === 'host') {
      if (typeof d.fuel === 'number') G.ai.fuel = Math.max(0, Math.floor(d.fuel));
      const first = !H.ready;            // a host may announce itself more than once
      H.ready = true; H.caps = d.caps || {};
      if (H.caps.ai) G.ai.provider = 'server';
      if (first) {
        G.emit('host-ready', H.caps);
        if (H.caps.ai) H.call('ai.models', {}).then(function (r) {
          if (!r || !Array.isArray(r.models)) return;
          G.ai.models = r.models.filter(function (m) { return m && typeof m.id === 'string'; }).slice(0, 12).map(function (m) { return { id: m.id.slice(0, 60), label: String(m.label || m.id).slice(0, 40) }; });
          if (!G.ai.labelOf(G.ai.model)) G.ai.model = typeof r.default === 'string' && G.ai.labelOf(r.default) ? r.default : '';
          G.ai.sound = !!r.sound;
          G.ai.paintOn = !!r.paint;
        }).catch(function () { /* an older host: one model, no choice */ });
      }
      return;
    }
    if (d.op === 'fuel') { G.ai.fuel = typeof d.fuel === 'number' ? Math.max(0, Math.floor(d.fuel)) : null; return; }     // the host topped it up (or lifted the limit)
    const p = H.pending[d.id];
    if (!p) return;
    clearTimeout(p.timer); delete H.pending[d.id];
    if (d.ok) p.resolve(d.data); else { const er = new Error(d.error || 'failed'); er.refused = d.error === 'refused'; er.code = d.error; p.reject(er); }
  });

  // ── the pond lives on the server too ──
  let pushTimer = 0;
  function push() {
    pushTimer = 0;
    if (!H.ready || !H.caps.pond || G.mode !== 'play' || !G.collectSave) return;
    const save = G.collectSave();
    if (save) H.call('pond.put', { save: save }).catch(function () { /* the local save still has it */ });
  }
  G.on('saved', function () {
    if (!H.ready || !H.caps.pond || pushTimer) return;
    pushTimer = setTimeout(push, 3000);     // a burst of saves is one request
  });
  // tell the host each time fuel is spent, so it can charge for it
  G.on('fuel', function (left, kind) { try { window.parent.postMessage({ __primordia: 1, op: 'fuel.spent', kind: kind, left: left }, '*'); } catch (e) { /* no host */ } });
  G.on('save-erased', function () { if (H.ready && H.caps.pond) H.call('pond.del', {}).catch(function () {}); });

  G.on('host-ready', function (caps) {
    if (!caps.pond) return;
    // ask for the pond as it is now; if the server's is newer than this browser's, carry on from that one
    H.call('pond.get', {}, 45000).then(function (res) {
      if (!res || !res.save || G.mode === 'play' || G.mode === 'catchup') return;
      const local = G.pendingSave;
      if (!G.validSave(res.save)) return;
      if (local && (+local.at || 0) > (+res.save.at || 0) + 1000) return;
      G.pendingSave = res.save;
      G.pendingReport = res.report && res.report.gens > 0 ? res.report : null;
      if (G.showContinue) G.showContinue(true);
    }).catch(function () { /* offline: the browser's own save is used */ });
  });

  // a sound of its own for each thing: asked for once, kept, and played through Plaxzy Sound
  const SND = {};
  G.thingSound = function (name) {
    const k = String(name || '').toLowerCase();
    if (SND[k] === 'ready' && window.PXS) { try { PXS.play('thing:' + k, { volume: 0.9 }); } catch (e) { console.error(e); } return true; }
    return false;
  };
  G.on('placed', function (info) {
    const k = String(info.name || '').toLowerCase();
    if (G.thingSound(k) || SND[k] || !H.ready || !G.ai.sound || !window.PXS || !G.ai.allow('sound')) return;
    SND[k] = 'asked';
    H.call('ai.sound', { word: info.name, note: info.note }, 90000).then(function (r) {
      G.ai.tally('sound', r && r.source, r && r.usd);
      if (!r || !r.sound || !/^audio\/(mpeg|wav|ogg|mp4)$/.test(r.sound.mime) || typeof r.sound.b64 !== 'string' || r.sound.b64.length > 600000) { SND[k] = 'none'; return; }
      const def = {}; def['thing:' + k] = 'data:' + r.sound.mime + ';base64,' + r.sound.b64;
      try { PXS.define(def); SND[k] = 'ready'; G.thingSound(k); } catch (e) { SND[k] = 'none'; console.error(e); }
    }, function () { SND[k] = 'none'; });
  });

  G.addSystem({
    name: 'host',
    init: function () {
      if (window.parent && window.parent !== window) {
        const hello = function (n) {
          if (H.ready || n > 4) return;
          try { window.parent.postMessage({ __primordia: 1, op: 'hello' }, '*'); } catch (e) { /* no host */ }
          setTimeout(function () { hello(n + 1); }, 1200);
        };
        hello(0);
      }
    },
  });
})();

</script>
<script data-part="boot">
// ── Boot: the title screen over a drifting pond ──
(function () {
  'use strict';
  G.addSystem({
    name: 'boot',
    init: function () {
      if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) { G.touch = true; document.body.classList.add('touch'); }
      G.startTitlePond();
      G.buildTitle();
      if (G.pendingSave && G.showContinue) G.showContinue(true);
    },
  });
  G.on('resize', function () { if (G.W) { G.W.ww = G.view.ww; G.W.wh = G.view.wh; } });
})();

</script>
