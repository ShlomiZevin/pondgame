<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Primordia</title>
<style>
:root { --deep:#07121f; --teal:#0f3b4a; --algae:#33d6a6; --gold:#f6d365; --rose:#ff7eb6; --violet:#a78bfa; --frost:#cfe8ff; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--deep); color: var(--frost);
  font-family: system-ui, "Trebuchet MS", "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; }
canvas#pond { position: fixed; left: 0; top: 0; width: 100%; height: 100%; touch-action: none; display: block; cursor: crosshair; }
canvas#pond.placing { cursor: copy; }
#ui { position: fixed; inset: 0; pointer-events: none; }
#ui > * { pointer-events: auto; }
.hide { display: none !important; }
body.touch .kbd { display: none !important; }

.glass { background: linear-gradient(160deg, rgba(15,59,74,.66), rgba(7,18,31,.58)); border: 1px solid rgba(207,232,255,.22);
  border-radius: 18px; box-shadow: 0 10px 34px rgba(0,0,0,.38), inset 0 0 24px rgba(51,214,166,.10), inset 0 1px 0 rgba(255,255,255,.13);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: var(--frost); }
h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: .04em; text-shadow: 0 0 14px rgba(51,214,166,.55); }
small { color: rgba(207,232,255,.7); }

/* buttons: glass pills that squish */
.btn { appearance: none; border: 1px solid rgba(207,232,255,.28); color: var(--frost); cursor: pointer; font: 700 12px system-ui, "Trebuchet MS", sans-serif;
  letter-spacing: .1em; text-transform: uppercase; min-height: 44px; min-width: 44px; padding: 8px 14px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  background: linear-gradient(180deg, rgba(207,232,255,.14), rgba(15,59,74,.55)); box-shadow: inset 0 0 14px rgba(51,214,166,.16), 0 4px 14px rgba(0,0,0,.3);
  transition: transform .12s, box-shadow .2s, background .2s, border-color .2s; }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn:hover { border-color: rgba(51,214,166,.8); box-shadow: inset 0 0 18px rgba(51,214,166,.35), 0 0 16px rgba(51,214,166,.25); }
.btn:active { transform: scale(.92, .88); }
.btn.on { border-color: var(--gold); box-shadow: inset 0 0 18px rgba(246,211,101,.35), 0 0 16px rgba(246,211,101,.25); }
.btn.big { min-height: 58px; padding: 12px 34px; font-size: 16px; letter-spacing: .22em; }
.btn.rose { border-color: rgba(255,126,182,.6); }
.btn.sm { min-height: 36px; padding: 5px 12px; font-size: 11px; }
.btn.pulse { animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { box-shadow: inset 0 0 14px rgba(51,214,166,.2), 0 0 0 rgba(51,214,166,0); } 50% { box-shadow: inset 0 0 26px rgba(51,214,166,.5), 0 0 28px rgba(51,214,166,.4); } }

/* season bar: the algorithm, always on screen */
#season { position: fixed; left: 14px; top: 14px; width: min(400px, calc(100vw - 340px)); padding: 10px 12px 12px; }
#season .gen { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; gap: 8px; }
#season .gen b { font-size: 12px; letter-spacing: .2em; color: var(--gold); text-shadow: 0 0 10px rgba(246,211,101,.5); }
#season .gen span { font-size: 11px; color: rgba(207,232,255,.65); }
.segs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.seg { border-radius: 12px; padding: 6px 4px 5px; text-align: center; border: 1px solid rgba(207,232,255,.12); background: rgba(7,18,31,.35); opacity: .5; transition: opacity .4s, background .4s, box-shadow .4s, border-color .4s, transform .4s; }
.seg svg { width: 22px; height: 22px; display: block; margin: 0 auto 2px; }
.seg b { display: block; font-size: 10px; letter-spacing: .14em; }
.seg small { display: block; font-size: 9px; letter-spacing: .04em; margin-top: 1px; }
.seg.on { opacity: 1; transform: translateY(-1px); }
.seg[data-s="0"].on { border-color: var(--rose); box-shadow: 0 0 18px rgba(255,126,182,.4), inset 0 0 14px rgba(255,126,182,.25); color: #ffd3e6; }
.seg[data-s="1"].on { border-color: var(--algae); box-shadow: 0 0 18px rgba(51,214,166,.4), inset 0 0 14px rgba(51,214,166,.25); color: #c8ffee; }
.seg[data-s="2"].on { border-color: var(--gold); box-shadow: 0 0 18px rgba(246,211,101,.4), inset 0 0 14px rgba(246,211,101,.25); color: #fff0c2; }
.seg[data-s="3"].on { border-color: var(--frost); box-shadow: 0 0 18px rgba(207,232,255,.4), inset 0 0 14px rgba(207,232,255,.25); color: #fff; }
.seg.done { opacity: .75; }
#season .cap { margin-top: 9px; line-height: 1.3; }
#season .cap b { display: block; font-size: 12px; letter-spacing: .12em; }
#season .cap span { font-size: 12px; color: rgba(207,232,255,.82); }
#season .count { margin-top: 5px; font-size: 11px; color: var(--gold); letter-spacing: .04em; min-height: 14px; }
#season .prog { height: 3px; background: rgba(207,232,255,.12); border-radius: 3px; margin-top: 8px; overflow: hidden; }
#season .prog i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--rose), var(--gold), var(--algae)); border-radius: 3px; }

/* evolution panel: a microscope slide */
#panel { position: fixed; right: 14px; top: 14px; width: 306px; padding: 0; overflow: hidden; }
#panel .phead { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 11px 14px; background: none; border: 0; color: var(--frost); cursor: pointer; font: 700 12px system-ui, sans-serif; letter-spacing: .2em; text-transform: uppercase; min-height: 44px; }
#panel .phead span { color: var(--gold); letter-spacing: .04em; font-weight: 600; margin: 0 8px 0 10px; font-size: 11px; white-space: nowrap; }
#panel .phead svg { width: 18px; height: 18px; transition: transform .3s; }
#panel.min .phead svg { transform: rotate(180deg); }
#panel.min .pbody { display: none; }
#panel .pbody { padding: 0 14px 14px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
.stats div { background: rgba(7,18,31,.4); border-radius: 10px; padding: 6px 4px; text-align: center; border: 1px solid rgba(207,232,255,.1); }
.stats b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(51,214,166,.4); }
.stats small { font-size: 9px; letter-spacing: .1em; text-transform: uppercase; }
.tabs { display: flex; gap: 5px; margin-bottom: 6px; }
.tabs button { flex: 1; min-height: 32px; border-radius: 999px; border: 1px solid rgba(207,232,255,.18); background: rgba(7,18,31,.4); color: rgba(207,232,255,.75); font: 700 9.5px system-ui, sans-serif; letter-spacing: .1em; cursor: pointer; }
.tabs button.on { border-color: var(--algae); color: #fff; box-shadow: 0 0 12px rgba(51,214,166,.35); }
#graph { width: 100%; height: 92px; display: block; border-radius: 10px; background: rgba(7,18,31,.4); }
.gnote { font-size: 10.5px; color: rgba(207,232,255,.7); margin: 5px 0 8px; min-height: 26px; line-height: 1.3; }
.log { height: 108px; overflow-y: auto; font-size: 11.5px; line-height: 1.35; padding-right: 4px; scrollbar-width: thin; }
.log div { padding: 3px 0; border-bottom: 1px solid rgba(207,232,255,.07); }
.log div.mut b { color: var(--rose); } .log div.disc b { color: var(--gold); } .log div.sel b { color: var(--frost); } .log div.sp b { color: var(--violet); }
.log small { margin-right: 5px; }

/* toolbar */
#toolbar { position: fixed; left: 14px; bottom: 14px; display: flex; gap: 8px; align-items: center; padding: 7px; border-radius: 999px; max-width: calc(100vw - 28px); }
#toolbar .btn { padding: 8px 13px; }
#toolbar .btn.ic { padding: 8px; }
.pop { position: fixed; left: 14px; bottom: 82px; width: min(340px, calc(100vw - 28px)); padding: 14px; z-index: 5; max-height: calc(100vh - 100px); overflow-y: auto; }
.pop h3 { font-size: 12px; letter-spacing: .2em; margin-bottom: 10px; color: var(--gold); }
.pop .row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
.pop label { flex: 0 0 96px; font-size: 11px; letter-spacing: .06em; }
.pop .val { flex: 0 0 38px; text-align: right; font-size: 11px; color: var(--gold); font-variant-numeric: tabular-nums; }
.pop .desc { font-size: 10.5px; color: rgba(207,232,255,.65); margin: -3px 0 6px; }
input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 34px; background: transparent; touch-action: pan-x; min-width: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 6px; background: linear-gradient(90deg, rgba(51,214,166,.7), rgba(246,211,101,.7)); box-shadow: 0 0 10px rgba(51,214,166,.3); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; margin-top: -9px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, var(--frost) 55%, var(--algae)); border: 0; box-shadow: 0 0 14px rgba(207,232,255,.7); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 6px; background: linear-gradient(90deg, rgba(51,214,166,.7), rgba(246,211,101,.7)); }
input[type=range]::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: var(--frost); border: 0; box-shadow: 0 0 14px rgba(207,232,255,.7); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { border: 1px solid rgba(207,232,255,.25); background: rgba(7,18,31,.4); color: var(--frost); border-radius: 999px; padding: 7px 12px; font-size: 12px; cursor: pointer; min-height: 36px; }
.chip:hover { border-color: var(--algae); }
.disasters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 8px; }
.disasters .btn { padding: 8px 6px; font-size: 10.5px; letter-spacing: .06em; }
.speeds { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.speeds .btn { padding: 8px 4px; }
input[type=text] { width: 100%; min-height: 46px; border-radius: 14px; border: 1px solid rgba(207,232,255,.3); background: rgba(7,18,31,.55); color: var(--frost); padding: 0 14px; font: 600 16px system-ui, "Trebuchet MS", sans-serif; outline: none; -webkit-user-select: text; user-select: text; }
input[type=text]:focus { border-color: var(--algae); box-shadow: 0 0 16px rgba(51,214,166,.35); }
.thingcard { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(7,18,31,.45); border: 1px solid rgba(207,232,255,.14); font-size: 12.5px; line-height: 1.4; }
.thingcard b { color: var(--gold); }
.tog { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.tog .btn { flex: 0 0 auto; min-width: 92px; }

/* inspector */
#inspector, #zcard { position: fixed; right: 14px; bottom: 14px; width: 306px; padding: 12px; }
#zcard .ihead { display: flex; gap: 10px; align-items: center; }
#zcard .ihead b { display: block; font-size: 14px; }
#zcard .ihead small { font-size: 11px; display: block; line-height: 1.3; }
#zcard .x { margin-left: auto; align-self: flex-start; background: none; border: 0; color: var(--frost); cursor: pointer; width: 36px; height: 36px; flex: none; }
#inspector .ihead { display: flex; gap: 10px; align-items: center; }
#inspector .ihead canvas { width: 104px; height: 104px; flex: none; margin: -6px 0 0 -8px; }
#inspector .ihead b { display: block; font-size: 14px; }
#inspector .ihead small { font-size: 11px; display: block; line-height: 1.3; }
#inspector .x { margin-left: auto; align-self: flex-start; background: none; border: 0; color: var(--frost); cursor: pointer; width: 36px; height: 36px; flex: none; }
#istrip { width: 100%; height: 40px; display: block; margin: 8px 0 4px; }
#ibrain { width: 100%; height: 92px; display: block; border-radius: 10px; background: rgba(7,18,31,.4); }
.irows { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; font-size: 11.5px; margin: 6px 0; }
.irows .meter { grid-column: span 2; }
.meter { height: 7px; background: rgba(7,18,31,.55); border-radius: 7px; overflow: hidden; margin-top: 3px; }
.meter i { display: block; height: 100%; border-radius: 7px; }
.imut { font-size: 11px; color: var(--rose); margin-top: 4px; line-height: 1.35; }
.ilabel { font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: rgba(207,232,255,.6); margin-top: 6px; }

/* banners, hints */
#versus { position: fixed; left: 14px; top: 236px; width: min(300px, calc(100vw - 28px)); padding: 9px 12px; z-index: 2; }
@media (max-width: 720px) { #versus { top: auto; bottom: 78px; left: 7px; width: min(280px, calc(100vw - 14px)); } }
@media (max-height: 560px) { #versus { display: none; } }
#zoom { position: fixed; right: 14px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; padding: 6px; border-radius: 999px; z-index: 2; }
#zoom .btn { min-width: 40px; min-height: 40px; padding: 0; font-size: 18px; letter-spacing: 0; }
@media (max-width: 720px) { #zoom { top: 232px; transform: none; right: 7px; } }
#banner { position: fixed; left: 50%; top: 14px; transform: translate(-50%, -140%); padding: 12px 22px; text-align: center; font-weight: 700; letter-spacing: .04em; transition: transform .6s cubic-bezier(.2,.9,.3,1.2); max-width: min(600px, calc(100vw - 28px)); font-size: 14px; line-height: 1.35; z-index: 8; border-color: rgba(246,211,101,.7); box-shadow: 0 0 36px rgba(246,211,101,.35), inset 0 0 24px rgba(246,211,101,.15); }
#banner.show { transform: translate(-50%, 78px); }
#banner small { display: block; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin-bottom: 2px; font-size: 10px; }
#hint { position: fixed; left: 50%; bottom: 84px; transform: translate(-50%, 12px); opacity: 0; padding: 9px 18px; font-size: 13px; text-align: center; max-width: min(520px, calc(100vw - 28px)); transition: opacity .5s, transform .5s; pointer-events: none !important; z-index: 4; }
#hint.show { opacity: 1; transform: translate(-50%, 0); }
#placing { position: fixed; left: 50%; top: 84px; transform: translateX(-50%); padding: 10px 18px; font-size: 13px; z-index: 6; text-align: center; max-width: calc(100vw - 28px); display: flex; gap: 12px; align-items: center; }

/* overlays: title, guide, tree, extinction */
.overlay { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 14px; background: radial-gradient(ellipse at 50% 45%, rgba(7,18,31,.15), rgba(7,18,31,.72)); }
.sheet { width: min(860px, 100%); max-height: calc(100% - 20px); display: flex; flex-direction: column; padding: 16px; overflow: hidden; }
.sheet .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.sheet .top h2 { font-size: 16px; letter-spacing: .24em; }
.sheet .body { overflow-y: auto; flex: 1; min-height: 0; scrollbar-width: thin; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.card { display: flex; gap: 10px; padding: 10px; border-radius: 14px; background: rgba(7,18,31,.45); border: 1px solid rgba(207,232,255,.14); }
.card canvas { width: 112px; height: 112px; flex: none; }
.card b { display: block; font-size: 13px; }
.card p { margin: 3px 0 5px; font-size: 11.5px; line-height: 1.35; color: rgba(207,232,255,.82); }
.card small { display: block; font-size: 10.5px; }
.card .btn { margin-top: 5px; }
.card.dead { opacity: .8; filter: saturate(.55); }
.empty { padding: 30px; text-align: center; color: rgba(207,232,255,.7); line-height: 1.5; }
#treeCanvas { width: 100%; height: 340px; display: block; border-radius: 12px; background: rgba(7,18,31,.4); }

#title { z-index: 12; flex-direction: column; text-align: center; background: radial-gradient(ellipse at 50% 42%, rgba(7,18,31,.05), rgba(7,18,31,.7) 80%); transition: opacity .9s; }
#title.out { opacity: 0; pointer-events: none !important; }
#title h1 { font-size: clamp(40px, 9vw, 92px); letter-spacing: .26em; padding-left: .26em; font-weight: 300; text-shadow: 0 0 30px rgba(51,214,166,.8), 0 0 70px rgba(51,214,166,.35); animation: breathe 5s ease-in-out infinite; }
@keyframes breathe { 0%,100% { text-shadow: 0 0 26px rgba(51,214,166,.7), 0 0 60px rgba(51,214,166,.25); } 50% { text-shadow: 0 0 40px rgba(51,214,166,1), 0 0 90px rgba(51,214,166,.5); } }
#title .tag { font-size: clamp(13px, 2.4vw, 18px); letter-spacing: .3em; text-transform: uppercase; color: rgba(207,232,255,.85); margin: 8px 0 26px; }
#title .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
#title .nature { margin-top: 18px; font-size: 13px; letter-spacing: .14em; color: var(--gold); text-transform: lowercase; }
.keys { display: grid; grid-template-columns: repeat(4, auto); gap: 8px 16px; margin-top: 24px; padding: 12px 18px; justify-content: center; max-width: calc(100vw - 28px); }
.keys div { display: flex; align-items: center; gap: 8px; font-size: 12px; text-align: left; }
.kc { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 26px; padding: 0 7px; border-radius: 7px; border: 1px solid rgba(207,232,255,.45); border-bottom-width: 3px; background: linear-gradient(180deg, rgba(207,232,255,.2), rgba(15,59,74,.7)); font: 700 11px ui-monospace, Consolas, monospace; letter-spacing: .04em; color: #fff; white-space: nowrap; }
.sound-row { display: flex; gap: 10px; margin-top: 16px; justify-content: center; flex-wrap: wrap; }

@media (max-width: 720px) {
  #season { width: calc(100vw - 28px); padding: 8px 10px 10px; }
  #season .gen { margin-bottom: 5px; }
  .seg { padding: 4px 2px 3px; } .seg svg { width: 18px; height: 18px; } .seg small { display: none; }
  #season .cap span { font-size: 11px; }
  #panel { top: auto; bottom: 78px; right: 14px; width: min(306px, calc(100vw - 28px)); }
  #panel:not(.min) { max-height: calc(100vh - 290px); overflow-y: auto; }
  #inspector, #zcard { bottom: 78px; left: 14px; right: 14px; width: auto; max-height: 52vh; overflow-y: auto; }
  #inspector.up { bottom: 132px; }
  #toolbar { gap: 4px; padding: 5px; left: 7px; max-width: calc(100vw - 14px); }
  #toolbar .btn { padding: 6px 8px; font-size: 9.5px; letter-spacing: .04em; min-width: 44px; }
  #toolbar .btn .lab { display: none; }
  #toolbar .btn svg { width: 22px; height: 22px; }
  .keys { grid-template-columns: repeat(2, auto); }
  .pop { bottom: 74px; left: 7px; }
  #hint { bottom: auto; top: 214px; }
}
@media (max-height: 520px) { #season .cap span, #season .count { display: none; } #panel:not(.min) { max-height: calc(100vh - 80px); overflow-y: auto; } }
</style>
</head>
<body>
<canvas id="pond"></canvas>
<div id="ui"></div>
<script src="/public/lib/plaxzy-sound-12.js"></script>
<script data-part="core">
// ── Primordia core: the shared object G, random numbers, events, loop, input ──
(function () {
  'use strict';
  const PAL = {
    deep: '#07121f',
    teal: '#0f3b4a',
    algae: '#33d6a6',
    gold: '#f6d365',
    rose: '#ff7eb6',
    violet: '#a78bfa',
    frost: '#cfe8ff',
  };
  const root = typeof window !== 'undefined' ? window : globalThis;
  const G = root.G = {
    PAL,
    systems: [],
    _on: {},
    mode: 'boot',        // boot | title | play
    paused: false,
    speed: 1,            // 0 pause, 1, 4, 16, 64
    view: { w: 800, h: 600, dpr: 1, scale: 1, base: 1, ww: 2240, wh: 1400, ox: 0, oy: 0 },
    cam: { z: 1.4, x: 1120, y: 700, set: false },
    input: { keys: {}, pressed: {}, ptr: { x: 0, y: 0, down: false, inside: false, wx: 0, wy: 0 }, clicks: [] },
    ui: {},
    ai: {},
    K: {},
  };

  G.on = function (name, fn) { (G._on[name] || (G._on[name] = [])).push(fn); };
  G.emit = function (name, a, b, c) {
    const l = G._on[name];
    if (!l) return;
    for (let i = 0; i < l.length; i++) l[i](a, b, c);
  };

  // ── numbers ──
  G.clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };
  G.lerp = function (a, b, t) { return a + (b - a) * t; };
  G.seed = function (s) {
    let a = (s >>> 0) || 1;
    G.seedValue = a;
    G.rand = function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  };
  G.seed(12345);
  G.randn = function () { return (G.rand() + G.rand() + G.rand() + G.rand() - 2) * 1.732; };
  G.rr = function (a, b) { return a + (b - a) * G.rand(); };
  G.ri = function (a, b) { return Math.floor(G.rr(a, b + 1)); };
  G.pick = function (arr) { return arr[Math.floor(G.rand() * arr.length)]; };
  G.hash = function (str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return h >>> 0;
  };
  // a tiny stable random generator for a given string/number (does not touch G.rand)
  G.rng = function (seed) {
    let a = (seed >>> 0) || 7;
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;

    z.look = info.look || (G.beingLook && !(z.p.vault > 0.2) && info.source !== 'ai' ? G.beingLook({ name: z.word, props: { eats: z.p.eats, moves: z.p.moves, deadly: z.p.deadly, poison: z.p.poison, light: z.p.light }, alive: z.alive }) : null);
    z.life0 = z.life;
    z.ev.push({ g: W.gen, t: info.from ? 'Budded from ' + info.from : 'Dropped into the pond' });
    W.zones.push(z);
    if (W.zones.length > 14) W.zones.shift();
    for (let i = 0; i < W.cre.length; i++) { const c = W.cre[i], dx = c.x - x, dy = c.y - y, d = Math.sqrt(dx * dx + dy * dy) + 0.01; if (d < 300) { c.startle = 1.6; c.vx += dx / d * 70; c.vy += dy / d * 70; } }
    G.emit('zone', z);
    return z;
  };

  G.disaster = function (kind, x, y) {
    const W = G.W;
    if (!W) return;
    if (x === undefined) { x = G.rr(0.2, 0.8) * W.ww; y = G.rr(0.2, 0.8) * W.wh; }
    if (kind === 'meteor') {
      const R = 190;
      for (let i = 0; i < W.cre.length; i++) {
        const c = W.cre[i], dx = c.x - x, dy = c.y - y, d = Math.sqrt(dx * dx + dy * dy);
        if (d < R) { if (d < R * 0.55 || G.rand() < 0.6) kill(c, 'meteor'); else c.E *= 0.4; }
        else if (d < R * 2) { c.vx += dx / d * 120; c.vy += dy / d * 120; }
      }
      for (let i = 0; i < W.food.length; i++) { const o = W.food[i], dx = o.x - x, dy = o.y - y; if (dx * dx + dy * dy < R * R) o.dead = true; }
      G.addZone(x, y, { name: 'crater', props: { heat: 0.7, hard: 0.0, nutrition: 0.8 }, tag: 5, radius: 120, life: 70, hue: 20, note: 'a meteor crater' });
    } else if (kind === 'flood') {
      const a = G.rand() * PI2;
      W.flood = { t: 7, fx: Math.cos(a) * 130, fy: Math.sin(a) * 130 };
    } else if (kind === 'bloom') {
      for (let i = 0; i < 170; i++) {
        const r = G.rand();
        G.spawnFood(W, null, null, r < 0.5 ? 2 : r < 0.8 ? 0 : r < 0.92 ? 1 : G.ri(3, 5), false);
      }
    } else if (kind === 'drought') {
      W.drought = 70;
    } else if (kind === 'plague') {
      const counts = {};
      for (let i = 0; i < W.cre.length; i++) counts[W.cre[i].sp] = (counts[W.cre[i].sp] || 0) + 1;
      let top = 0, tn = 0;
      for (const k in counts) if (counts[k] > tn) { tn = counts[k]; top = +k; }
      for (let i = 0; i < W.cre.length; i++) {
        const c = W.cre[i];
        const p = c.sp === top ? 0.55 : 0.08;
        if (G.rand() < p * (1 - c.ph.defense * 0.3)) kill(c, 'plague');
      }
    }
    G.emit('disaster', kind, x, y);
  };

  // ── species ──
  G.speciesById = function (id) {
    const L = G.W.species;
    for (let i = 0; i < L.length; i++) if (L[i].id === id) return L[i];
    return null;
  };

  G.updateSpecies = function () {
    const W = G.W, cre = W.cre, sp = W.species;
    for (let i = 0; i < sp.length; i++) { sp[i].n = 0; sp[i].fitSum = 0; sp[i].repFit *= 0.85; }     // the picture of a species follows its living members
    const TH = K.speciesTH;
    for (let i = 0; i < cre.length; i++) {
      const c = cre[i];
      const f = G.features(c.g);
      c.fv = f;
      let best = null, bd = 1e9;
      for (let j = 0; j < sp.length; j++) {
        if (sp[j].extinct && W.gen - sp[j].lastGen > 3) continue;
        const d = G.fdist(f, sp[j].fv);
        if (d < bd) { bd = d; best = sp[j]; }
      }
      if (!best || bd > TH) {
        const parent = best && bd < TH * 2.2 ? best.id : 0;
        best = {
          id: W.nextSp++, fv: f.slice(), born: W.gen, parent: parent, n: 0, fitSum: 0, kills: 0, peak: 0,
          hist: [], extinct: false, lastGen: W.gen, rep: null, repFit: -1, hue: c.g.t[2],
        };
        best.name = G.speciesName(c.g, best.id);
        sp.push(best);
        if (sp.length > 3) G.emit('species-new', best);
      }
      c.sp = best.id;
      best.n++; best.fitSum += c.fit;
      best.lastGen = W.gen; best.extinct = false;
      if (c.fit > best.repFit || !best.rep) { best.repFit = c.fit; best.rep = G.cloneGenome(c.g); best.hue = c.g.t[2]; }
      for (let k = 0; k < f.length; k++) best.fv[k] += (f[k] - best.fv[k]) * 0.04;
    }
    for (let i = 0; i < sp.length; i++) {
      const s = sp[i];
      s.peak = Math.max(s.peak, s.n);
      s.hist.push(s.n);
      if (s.hist.length > 80) s.hist.shift();
      if (s.n === 0 && !s.extinct && W.gen - s.lastGen >= 1) {
        s.extinct = true; s.diedGen = W.gen;
        W.fossils.push({ id: s.id, name: s.name, born: s.born, died: W.gen, g: s.rep, peak: s.peak });
        if (W.fossils.length > 40) W.fossils.shift();
        G.emit('extinction-species', s);
      }
    }
    // keep the list bounded
    if (sp.length > 70) {
      for (let i = 0; i < sp.length && sp.length > 70; i++) if (sp[i].extinct && !sp[i].keep) sp.splice(i--, 1);
    }
  };

  const SYL_A = ['Glim', 'Bloop', 'Nim', 'Squi', 'Wob', 'Pip', 'Dorb', 'Fizz', 'Mur', 'Zol', 'Tink', 'Quo', 'Blum', 'Sno', 'Lum', 'Kep', 'Vor', 'Ploo', 'Yel', 'Brisk'];
  const SYL_B = ['ling', 'ox', 'ette', 'ar', 'ibus', 'o', 'ish', 'mop', 'zle', 'ra', 'bee', 'ton', 'kin', 'nub', 'let', 'ee'];
  const NOUN = ['Drifter', 'Gulper', 'Wiggler', 'Nibbler', 'Bobber', 'Glider', 'Lurker', 'Blinker', 'Paddler', 'Roamer'];
  G.speciesName = function (g, id) {
    const r = G.rng(id * 7919 + (g.f.seed | 0) + (g.t[2] | 0));
    const k = G.form.kind(g.f);
    const adj = (g.t[4] || 0) > 0.45 ? 'Fierce ' : G.derive(g).photo > 0.5 ? 'Sun-fed ' : '';
    return adj + SYL_A[Math.floor(r() * SYL_A.length)] + SYL_B[Math.floor(r() * SYL_B.length)] + ' ' + (k.noun === 'Cell' || k.noun === 'Blob' ? NOUN[Math.floor(r() * NOUN.length)] : k.noun);
  };

  G.describeSpecies = function (s) {
    const g = s.rep;
    if (!g) return 'Nothing is known about it yet.';
    const ph = G.derive(g), f = g.f;
    const bits = [];
    const facts = G.form.facts(f);
    bits.push('A ' + G.form.kind(f).full.toLowerCase() + ': ' + facts.slice(0, 5).join(', ') + '.');
    if (s.judge && s.judge.why) bits.push('The pond\'s verdict: ' + s.judge.why);
    const best = [0, 1, 2, 3, 4, 5].sort(function (a, b) { return g.c[b] - g.c[a]; });
    const names = ['gold', 'lime', 'green', 'blue', 'violet', 'pink'];
    if (ph.photo > 0.3) bits.push(ph.speed < 22 ? 'Lives on light and hardly moves, like a plant.' : 'Feeds partly on light.');
    const orgs = [];
    for (let i = 0; i < g.p.length; i++) if (G.organOf) { const o = G.organOf(g.p[i].k); if (o && orgs.indexOf(o.name) < 0) orgs.push(o.name); }
    if (orgs.length) bits.push('Carries: ' + orgs.slice(0, 3).join(', ') + '.');
    if ((g.t[4] || 0) > 0.38) bits.push('Violent: it attacks other kinds' + (s.attacks ? ' (' + s.attacks + ' attacks so far).' : '.'));
    if (s.kills > 3) bits.push('A hunter: it has eaten ' + s.kills + ' other creatures.');
    else if (g.c[best[0]] > 0.6 && g.c[best[1]] > 0.5) bits.push('Eats ' + names[best[0]] + ' and ' + names[best[1]] + ' food.');
    else bits.push('Eats ' + names[best[0]] + ' food.');
    if (ph.lungs) bits.push('Walks: it can climb onto the shore.');
    if (ph.jaws) bits.push('Its bite can take the big prey of the deep.');
    if (g.h >= 2) bits.push('A thinking brain with ' + g.h + ' hidden cells.');
    if (g.c[6] > 0.5) bits.push('Likes it hot.');
    if (g.c[7] > 0.5) bits.push('Shrugs off winter.');
    if (g.c[8] > 0.5) bits.push('Poison-proof.');
    return bits.slice(0, 7).join(' ');
  };

  G.liveSpeciesCount = function () {
    let n = 0; const L = G.W.species;
    for (let i = 0; i < L.length; i++) if (!L[i].extinct && L[i].n > 0) n++;
    return n;
  };

  G.exports = { Grid: Grid };
})();

<script data-part="parts">
// ── New kinds of body part, invented for this pond ──
// The eight growths every pond knows (legs, fins, spikes...) are only a start. Now and then a pond is given a new
// KIND of part: a wing, a sail, antlers, a lure. It arrives as a shape (an outline, ribs, dots), a way of moving and
// what it is good for. From then on it is ordinary genetics: a mutation may grow it, the genes decide where it sits,
// how big it is and how many there are, and selection decides whether it stays. It is drawn in the animal's own colours.
// The AI invents them when there is a server (by the clock, within a budget); without one the pond imagines its own.
(function () {
  'use strict';
  const clamp = G.clamp;
  const ABIL = ['speed', 'agility', 'reach', 'senses', 'armour', 'attack'];
  const PLACES = ['sides', 'back', 'head'], MOTIONS = ['flap', 'sway', 'pulse', 'bristle', 'still'], COLOURS = ['accent', 'body', 'pale', 'dark', 'glow'];
  const MAX = 8;

  G.designOf = function (id) {
    const L = G.W ? G.W.designs : null;
    if (L) for (let i = 0; i < L.length; i++) if (L[i].id === id) return L[i];
    const K = G.keptDesigns;                    // kinds of part that came along with a kept creature, from another pond

    return null;
  };

  // ── the collection: creatures you chose to keep. It outlives ponds, so a favourite can be released into a new one. ──
  G.collection = [];          // [{ name, kind, age, gen, g (packed genome) }]
  G.keptDesigns = [];         // the pond-made kinds of part those creatures carry (ids from 100000 up, so they never clash with a pond's own)
  const MAXKEEP = 16;
  G.keep = function (c) {
    if (!c || !c.g) return null;

      const q = g.f.rules[i]; if (q.k !== 8 || q.t >= 100000) continue;
      const d = G.designOf(q.t); if (!d) continue;
      const sig = d.name + JSON.stringify(d.pts);
      let k = G.keptDesigns.filter(function (x) { return x.name + JSON.stringify(x.pts) === sig; })[0];
      if (!k) { k = JSON.parse(JSON.stringify(d)); k.id = 100000 + G.keptDesigns.reduce(function (m, x) { return Math.max(m, x.id - 99999); }, 0); G.keptDesigns.push(k); }
      q.t = k.id;
    }
    if (g.f.pl && g.f.pl < 100000) {         // and the build it follows
      const p = G.planOf(g.f.pl);
      if (!p) g.f.pl = 0;
      else { const sig = p.name + JSON.stringify(p.spine); let k = G.keptPlans.filter(function (x) { return x.name + JSON.stringify(x.spine) === sig; })[0]; if (!k) { k = JSON.parse(JSON.stringify(p)); k.id = 100000 + G.keptPlans.reduce(function (m, x) { return Math.max(m, x.id - 99999); }, 0); G.keptPlans.push(k); if (G.keptPlans.length > 16) G.keptPlans.shift(); } g.f.pl = k.id; }

  G.breedKept = function (item, c) {

    }

    G.emit('bred', item, c);

  };
  /** set a kept creature free in this pond: a small family of it, each a little different, to breed with what lives here */
  G.release = function (item) {
    const W = G.W, g0 = G.unpackGenome(item.g);

    // the kinds of part it carries become part of this pond, so they can spread by mutation too
    for (let i = 0; i < g0.f.rules.length; i++) { const q = g0.f.rules[i]; if (q.k === 8 && q.t >= 100000 && !W.designs.some(function (x) { return x.id === q.t; })) { const d = G.designOf(q.t); if (d && W.designs.length < 12) W.designs.push(JSON.parse(JSON.stringify(d))); } }

  G.cleanDesign = function (raw) {

    if (Array.isArray(raw.dots)) for (let i = 0; i < raw.dots.length && dots.length < 3; i++) { const q = raw.dots[i]; if (Array.isArray(q) && q.length >= 3 && q.every(function (v) { return isFinite(+v); })) dots.push([clamp(+q[0], 0, 1.1), clamp(+q[1], -0.6, 0.6), clamp(+q[2], 0.03, 0.16)]); }

    const f = raw.fx && typeof raw.fx === 'object' ? raw.fx : {}, fx = {};
    let pos = 0, neg = 0;
    for (let i = 0; i < 6; i++) { let v = +f[ABIL[i]]; if (!isFinite(v)) v = 0; v = clamp(v, -0.3, 0.5); fx[ABIL[i]] = v; if (v > 0) pos += v; else neg -= v; }
    if (pos < 0.1) return null;
    if (pos > 0.8) for (let i = 0; i < 6; i++) if (fx[ABIL[i]] > 0) fx[ABIL[i]] *= 0.8 / pos;
    if (neg < 0.05) { let worst = 0; for (let i = 1; i < 6; i++) if (fx[ABIL[i]] < fx[ABIL[worst]]) worst = i; fx[ABIL[worst]] = -0.08; }
    const name = String(raw.name || 'New part').replace(/[<>"]/g, '').trim().slice(0, 22) || 'New part';
    return {
      name: name, adj: (String(raw.adj || '').replace(/[^A-Za-z\-]/g, '').slice(0, 16) || name.split(' ').pop() + 'ed').replace(/^./, function (ch) { return ch.toUpperCase(); }),
      note: String(raw.note || '').replace(/[<>]/g, '').slice(0, 110),
      place: PLACES.indexOf(raw.place) >= 0 ? raw.place : 'sides', motion: MOTIONS.indexOf(raw.motion) >= 0 ? raw.motion : 'sway', colour: COLOURS.indexOf(raw.colour) >= 0 ? raw.colour : 'accent',

// given builds the way it is given new kinds of part: by the AI when there is a server, from its own stock when there is not.
// A build is then a gene like any other: a mutation may switch a body to it; the silhouette, head, growths, coat and
// colours stay the body's own; what the build gives and costs is measured; selection decides whether it stays.
//
// A build:  spine  3..7 points [x, y] from head to tail. x: forward is positive. y: height above the floor. The body's length
//                  is laid along this line.
//           legs   up to 4, each { u (0 at the shoulders .. 1 at the hips), knee [dx, dy], foot [dx, dy], thick, air }:
//                  knee from the hip, foot from the knee, in leg lengths, y up. `air`: it does not reach the floor (an arm).
//           stands does it stand on the floor (true) or float in the water (false)

<script data-part="judge">
// ── The judge: what the AI makes of each kind's looks ──
// Bodies are grown from genes and drawn by the game. The AI's part is taste: now and then it is shown the kinds
// living in the pond (as plain facts about their bodies) and says how striking each one is, and why. That verdict
// becomes half of the kind's charm, so the good-looking ones find mates more easily and the pond drifts towards
// creatures worth looking at. It is asked by the clock and within a budget, never once per generation, and
// without a server the pond simply goes by its own taste.
(function () {
  'use strict';
  let busy = false;

  G.cleanJudge = function (raw) {
    const list = raw && Array.isArray(raw.scores) ? raw.scores : null;

    }

    const due = live.filter(function (s) { return !s.judge || (gen - s.judge.gen >= 15 && G.fdist(G.form.features(s.rep.f), s.judge.fv) > 1.2); }).slice(0, 4);
    if (!due.length || !G.ai.allow('judge')) return;

// The genes decide what a creature IS: its build, what grows on it, its coat, its colours, what its world has done to it.
// The AI then PAINTS that kind, once, from those facts. Nobody can predict the painting; the same facts never have to be
// paid for twice (the server keeps every painting in its library, for every player). Until a kind is painted, and whenever

<script data-part="eras">
// ── Ages: discovered, never scripted ──
// There is no ladder and no list of what life "should" become. Once a generation the pond is measured: which
// kind of body is the most common, and how common. When a different kind takes over and holds, a new age begins,
// named after what is actually swimming there ("The Age of Finned Darters"). No two ponds share a history.
// What the pond finds beautiful (its fashion) also drifts over time, so the same pond never stands still.
(function () {

// world → screen setup

// ── layer 1: the water ──

  g.addColorStop(0, G.rgba(PAL.teal, 1));

// ── layer 2: slow light on the water, and the bright patches where algae grow ──

// ── layer 4: zones from the things you add ──

// ── layer 5: food ──
function drawFood() {
  const W = G.W; if (!W) return;
  const ctx = G.ctx, t = G.rt;
  beginWorld(ctx);
  const f = W.food;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < f.length; i++) {
    const o = f[i];
    if (o.dead) continue;
    const tw = 0.75 + 0.25 * Math.sin(t * 2.2 + o.ph);
    const s = 6 + o.v * 0.25;

  }
  ctx.globalAlpha = 1;
  ctx.restore();
  for (let i = 0; i < f.length; i++) {
    const o = f[i];
    if (o.dead) {

      ctx.fillStyle = G.hsl(G.TAGHUE[o.tag], 85, 68, 0.95); ctx.beginPath(); ctx.arc(o.x, o.y, 5.5, 0, 6.2832); ctx.fill();
      ctx.strokeStyle = G.rgba(PAL.frost, 0.6); ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(o.x, o.y, 8, 0, 6.2832); ctx.stroke();

// ── layer 6: things the player added ──

// ── Running the pond: fixed steps, fast-forward, starting and seeding ponds ──
(function () {
  'use strict';
  let acc = 0;
  G.alpha = 1;

  G.isBlocked = function () { return !!(G.ui.modal || G.ui.menuOpen); };

  G.setSpeed = function (s) {

  G.togglePause = function () {
    if (G.speed === 0) G.setSpeed(G.lastSpeed || 1);
    else { G.lastSpeed = G.speed; G.setSpeed(0); }
  };

  G.addSystem({
    name: 'sim',
    update: function (dt) {
      const W = G.W;
      if (!W) return;
      if (G.speed === 0 || G.isBlocked() || G.mode === 'boot' || G.catching) { G.alpha = 1; return; }

      const sp = slow ? 0.5 : G.speed;
      const step = sp >= 16 ? 0.1 : G.K.dt;
      acc += dt * sp;
      const t0 = performance.now();
      let n = 0;
      const maxMs = sp >= 16 ? 24 : 14;

      }

      G.simRate = n;
    },
  });

  G.hints = {};

    if (G.hints[key]) return;
    G.hints[key] = 1;
    G.emit('hint', text, ms || 7000);
  };

  // a brand new pond: a random population of identical-ish blobs

    ctx.fillText('gen ' + hist[0].gen, pad, h - 2);

    c.muts.forEach(function (m) { mutSet[m.kind + m.i] = 1; });
    let x = 8; const y = 40, t = G.rt;
    const mark = function (key, cx, rad) {
      if (!mutSet[key]) return;
      ctx.strokeStyle = G.rgba(PAL.rose, 0.7 + 0.3 * Math.sin(t * 6)); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(cx, y, rad + 5, 0, 6.2832); ctx.stroke();
    };
    // traits: size, speed, colour
    ctx.fillStyle = G.hsl(g.t[2], 80, 62, 1); ctx.beginPath(); ctx.arc(x + 14, y, 13, 0, 6.2832); ctx.fill(); mark('t2', x + 14, 13); x += 36;
    const sz = 5 + (g.t[0] - 5) * 0.55;
    ctx.strokeStyle = PAL.frost; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x + 12, y, sz, 0, 6.2832); ctx.stroke(); mark('t0', x + 12, sz); x += 32;
    ctx.fillStyle = PAL.frost; ctx.fillRect(x, y - 3, 10 + g.t[1] * 22, 6); mark('t1', x + 14, 10); x += 38;
    ctx.fillStyle = G.rgba(PAL.frost, 0.25); ctx.fillRect(x, y - 16, 2, 32); x += 10;
    // diet beads: the opacity is how well it digests that colour of food
    for (let i = 0; i < 6; i++) { ctx.fillStyle = BEADCOL[i]; ctx.globalAlpha = 0.2 + 0.8 * g.c[i]; ctx.beginPath(); ctx.arc(x + 8, y, 7.5, 0, 6.2832); ctx.fill(); ctx.globalAlpha = 1; mark('c' + i, x + 8, 7.5); x += 19; }
    x += 4;
    for (let i = 6; i < 9; i++) { ctx.strokeStyle = [PAL.rose, PAL.frost, PAL.violet][i - 6]; ctx.globalAlpha = 0.25 + 0.75 * g.c[i]; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x + 8, y, 6, 0, 6.2832); ctx.stroke(); ctx.globalAlpha = 1; mark('c' + i, x + 8, 6); x += 19; }
    ctx.fillStyle = G.rgba(PAL.frost, 0.25); ctx.fillRect(x, y - 16, 2, 32); x += 10;
    // the body's rules: segments, then one bead for each thing that grows from it
    ctx.font = '700 13px ui-monospace, Consolas, monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const f = g.f;
    ctx.fillStyle = G.hsl(f.hue, f.sat, f.lit, 1); G.roundRect(ctx, x, y - 11, 30, 22, 7); ctx.fill();
    ctx.fillStyle = PAL.deep; ctx.fillText((f.sym ? '✶' + f.sym : '') + (f.sym ? '' : f.n + 's'), x + 15, y + 1); mark('f0', x + 15, 14); x += 35;
    for (let i = 0; i < f.rules.length && x < 500; i++) {
      ctx.fillStyle = G.hsl(f.hue + f.hue2, f.sat, f.lit, 1); G.roundRect(ctx, x, y - 11, 22, 22, 7); ctx.fill();
      ctx.fillStyle = PAL.deep; ctx.fillText('LFSTAPRH'.charAt(f.rules[i].k), x + 11, y + 1); x += 26;
    }
    for (let i = 0; i < g.p.length && x < 520; i++) {
      const org = G.organOf(g.p[i].k);
      ctx.fillStyle = G.hsl(org ? org.hue : 270, 80, 66, 1); ctx.beginPath(); ctx.arc(x + 11, y, 11, 0, 6.2832); ctx.fill();
      ctx.strokeStyle = PAL.gold; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = PAL.deep; ctx.fillText(org ? org.name.charAt(0) : '?', x + 11, y + 1); mark('p' + i, x + 11, 11); x += 26;
    }
    // brain: one tick per wire
    if (x < 520) {
      ctx.fillStyle = G.rgba(PAL.frost, 0.25); ctx.fillRect(x, y - 16, 2, 32); x += 10;
      for (let i = 0; i < g.w.length && x < 552; i++) {
        const w = g.w[i], hgt = 6 + Math.min(1, Math.abs(w.v)) * 20;
        ctx.fillStyle = w.v >= 0 ? PAL.algae : PAL.rose; ctx.globalAlpha = 0.85;
        ctx.fillRect(x, y - hgt / 2, 4, hgt); ctx.globalAlpha = 1;
        if (mutSet['w' + i]) { ctx.strokeStyle = PAL.rose; ctx.lineWidth = 2; ctx.strokeRect(x - 2, y - 17, 8, 34); }
        x += 7;
      }
    }
  }

  function drawBrain(c) {
    const cv = $('ibrain'), ctx = cv.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
    const g = c.g, nh = g.h, W = cv.width, H = cv.height;
    const colX = [34, W / 2, W - 34];
    const pos = function (kind, i) {
      if (kind === 0) return [colX[0], 14 + (H - 28) * i / (G.NIN - 1)];
      if (kind === 1) return [colX[1], 18 + (H - 36) * (nh === 1 ? 0.5 : i / (nh - 1))];
      return [colX[2], 22 + (H - 44) * i / (G.NOUT - 1)];
    };
    const node = function (id) {
      if (id >= 200) return pos(2, id - 200);
      if (id >= 100) return pos(1, id - 100);
      return pos(0, id);
    };
    const used = {};
    for (let i = 0; i < g.w.length; i++) { used[g.w[i].f] = 1; used[g.w[i].t] = 1; }
    for (let i = 0; i < g.w.length; i++) {
      const w = g.w[i], a = node(w.f), b = node(w.t);
      const fv = w.f >= 100 ? c.hv[w.f - 100] : c.inp[w.f];
      ctx.strokeStyle = w.v >= 0 ? G.rgba(PAL.algae, 0.3 + 0.5 * Math.min(1, Math.abs(fv || 0) + 0.2)) : G.rgba(PAL.rose, 0.3 + 0.5 * Math.min(1, Math.abs(fv || 0) + 0.2));
      ctx.lineWidth = 1 + Math.min(4, Math.abs(w.v) * 2.2);
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.bezierCurveTo((a[0] + b[0]) / 2, a[1], (a[0] + b[0]) / 2, b[1], b[0], b[1]); ctx.stroke();
    }
    ctx.font = '15px system-ui, sans-serif'; ctx.textBaseline = 'middle';
    for (let i = 0; i < G.NIN; i++) {
      if (!used[i]) { const p = pos(0, i); ctx.fillStyle = G.rgba(PAL.frost, 0.14); ctx.beginPath(); ctx.arc(p[0], p[1], 3, 0, 6.2832); ctx.fill(); continue; }
      const p = pos(0, i), v = Math.min(1, Math.abs(c.inp[i]));
      ctx.fillStyle = G.rgba(PAL.frost, 0.35 + 0.65 * v); ctx.beginPath(); ctx.arc(p[0], p[1], 5 + v * 2, 0, 6.2832); ctx.fill();
      ctx.fillStyle = G.rgba(PAL.frost, 0.75); ctx.textAlign = 'left'; ctx.fillText(G.INAMES[i], p[0] + 11, p[1]);
    }
    for (let i = 0; i < nh; i++) {
      const p = pos(1, i), v = Math.min(1, Math.abs(c.hv[i]));
      ctx.fillStyle = G.rgba(PAL.violet, 0.45 + 0.55 * v); ctx.beginPath(); ctx.arc(p[0], p[1], 8, 0, 6.2832); ctx.fill();
    }
    for (let i = 0; i < G.NOUT; i++) {
      const p = pos(2, i), v = i === 1 ? Math.abs(c.out[1]) : c.out[i];
      ctx.fillStyle = G.rgba(PAL.gold, 0.35 + 0.65 * v); ctx.beginPath(); ctx.arc(p[0], p[1], 6 + v * 3, 0, 6.2832); ctx.fill();
      ctx.fillStyle = G.rgba(PAL.frost, 0.85); ctx.textAlign = 'right'; ctx.fillText(G.ONAMES[i], p[0] - 12, p[1]);
    }
  }

  let prevT = 0;
  function inspectorFrame() {
    const insp = $('inspector');
    const c = G.R.sel;
    if (!c || c.dead) {
      if (c && c.dead && !insp.classList.contains('hide')) {
        // follow the family: a living child first, else the nearest of its species
        const cre = G.W ? G.W.cre : [];
        let heir = null, kind = '', bd = 1e9;
        for (let i = 0; i < cre.length; i++) { const o = cre[i]; if (o.dad && o.dad.id === c.id) { heir = o; kind = 'child'; break; } }
        if (!heir && c.sp) for (let i = 0; i < cre.length; i++) { const o = cre[i]; if (o.sp === c.sp) { const d = Math.hypot(o.x - c.x, o.y - c.y); if (d < bd) { bd = d; heir = o; kind = 'kin'; } } }
        if (heir) { UI.followed = { from: c.id, kind: kind, cause: c.cause }; G.select(heir); return; }
        $('isub').textContent = 'This creature has died, and none of its kind are left. Click another.';
        if (!UI.deadShown) { UI.deadShown = true; }
      }
      if (!c) { UI.deadShown = false; insp.classList.add('hide'); }
      return;
    }
    UI.deadShown = false;
    if (G.mode !== 'play') return;
    insp.classList.remove('hide');
    const sp = G.speciesById(c.sp);
    if (UI.inspDirty) {
      UI.inspDirty = false;
      $('iname').textContent = (sp ? sp.name : 'Blob') + ' #' + c.id + ' · ' + G.kindOf(c.g).full;
      const mut = c.muts.filter(function (m) { return m.big; }).map(function (m) { return m.text; });
      $('imut').textContent = c.muts.length ? 'Mutated genes (pink): ' + c.muts.map(function (m) { return m.text; }).filter(function (v, i, a) { return a.indexOf(v) === i; }).slice(0, 5).join(', ') : 'An exact copy of its mother cell.';
      let par = 'Born in generation ' + c.born;
      if (c.mate) par += ' · crossed two parents (#' + (c.dad ? c.dad.id : '?') + ' and #' + c.mate.id + ')';
      else if (c.dad) par += ' · child of #' + c.dad.id;
      else par += ' · a founder';
      if (UI.followed) {
        const why = { starved: 'starved', selected: 'faded in winter', eaten: 'was eaten', fought: 'was killed in a fight', slain: 'was killed by a touch', event: 'died in what happened', meteor: 'was hit by the meteor', plague: 'died of the plague' }[UI.followed.cause] || 'died';
        par += ' · You were watching #' + UI.followed.from + ', which ' + why + '. This is its ' + (UI.followed.kind === 'child' ? 'child' : 'nearest kin') + '.';
        UI.followed = null;
      }
      $('iPar').textContent = par;
      $('isub').textContent = sp ? G.describeSpecies(sp) : 'A newborn: its species is sorted out in autumn.';
      G.R.selPrev = G.preview(c.g, c.id);
    }
    const now = performance.now();
    if (now - prevT > 60) {
      prevT = now;
      const f = c.E / c.ph.Emax;
      $('iE').innerHTML = 'Energy <b>' + Math.round(c.E) + '</b> / ' + Math.round(c.ph.Emax) + ' · Protein <b>' + Math.round(c.P || 0) + '</b> (a child takes ' + Math.round(c.ph.Emax * G.K.repro * c.ph.pneed) + ')' + (c.asleep ? ' · <b style="color:var(--frost)">asleep</b>' : c.tired > 0.7 ? ' · tired' : '');
      $('iAge').innerHTML = 'Age <b>' + c.age + '</b> · children <b>' + c.off + '</b>';
      const kids = Math.max(0, Math.min(3, Math.floor((c.E - G.K.keep * c.ph.Emax) / (G.K.repro * c.ph.Emax))));
      $('ifit').innerHTML = 'Score <b>' + Math.max(0, f).toFixed(2) + '</b>: the share of its energy tank that is full. ' + (c.doomed ? '<span style="color:var(--rose)">Too low: it fades this winter.</span>' : f < 0.1 ? '<span style="color:var(--rose)">In danger of fading this winter.</span>' : 'With this much it could have <b>' + kids + '</b> ' + (kids === 1 ? 'child' : 'children') + ' in spring.') + ' It burns <b>' + c.ph.upkeep.toFixed(2) + '</b> energy a second just to exist.' +
        ((c.g.t[4] || 0) > 0.38 ? '<br><span style="color:var(--rose)">Violent (temper ' + c.g.t[4].toFixed(2) + '): it attacks other kinds.</span>' : '') + '<br>Charm <b>' + G.charmOf(c).toFixed(2) + '</b>' + (sp && sp.judge ? ' (its body ' + c.ph.charm.toFixed(2) + ', the judge gave its kind ' + sp.judge.score.toFixed(2) + ')' : '') + ': ' + (c.snub ? '<span style="color:var(--rose)">among the ugliest in the pond: nobody chose it as a mate this spring, so it left no children.</span>' : G.charmOf(c) > 0.55 ? 'admired; mates choose it gladly.' : G.charmOf(c) < 0.3 ? 'plain by this pond\'s taste; it may be passed over.' : 'pleasant enough to find a mate.');
      const bar = $('iEb');
      bar.style.width = (Math.max(0, Math.min(1, f)) * 100).toFixed(0) + '%';
      bar.style.background = f > 0.6 ? PAL.algae : f > 0.3 ? PAL.gold : PAL.rose;
      // preview
      const pv = $('iprev'), ctx = pv.getContext('2d');
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, 208, 208);
      const prev = G.R.selPrev;
      if (prev) {
        prev.ang = -0.5; prev.glow = c.glow || 0.5; prev.look = 0;
        prev.asleep = c.asleep; G.drawFit(ctx, prev, 104, 104, 96, G.rt);
      }
      drawStrip(c);
      drawBrain(c);
    }
  }

  // ── start ──
  G.addSystem({
    name: 'hud',
    init: function () { buildHud(); },
    update: function (dt) {
      if (G.mode !== 'play') return;
      refresh(dt);
      inspectorFrame();
      if (document.body.classList.contains('touch') !== !!G.touch && G.touch) document.body.classList.add('touch');
      if (G.R.ghost && !UI.placing) G.R.ghost = null;
    },
  });
  G.getLog = function () { return log; };
})();

</script>
<script data-part="things">
// ── The things you add: click one to read what it is, what it does, and its history ──
(function () {
  'use strict';
  const PAL = G.PAL, el = G.el, $ = G.$, esc = G.escapeHtml;
  const PROP = [
    ['nut', 'Food', PAL.algae], ['poison', 'Poison', PAL.violet], ['heat', 'Heat', PAL.rose], ['light', 'Light', PAL.gold],
    ['sticky', 'Sticky', PAL.algae], ['acid', 'Acid', PAL.algae], ['hard', 'Solid', PAL.frost], ['spread', 'Spreads', PAL.frost],
    ['deadly', 'Kills on touch', PAL.rose], ['vault', 'Locks food in', PAL.frost], ['eats', 'Eats', PAL.rose], ['moves', 'Moves', PAL.gold], ['pull', 'Pulls in', PAL.violet],
  ];
  let card = null, last = 0, shownId = 0;

  G.zoneAt = function (x, y) {
    const W = G.W; if (!W) return null;
    let best = null, bd = 1e9;
    for (let i = 0; i < W.zones.length; i++) {
      const z = W.zones[i], d = Math.hypot(z.x - x, z.y - y);
      if (d < Math.max(44, z.r * 0.8) && d < bd) { bd = d; best = z; }
    }
    return best;
  };
  G.selectZone = function (z) {
    if (z && G.cam.z > 1.01) G.focusOn(z.x, z.y);
    if (z && G.thingSound) G.thingSound(z.word);
    G.R.selZone = z || null;
    shownId = 0;
    if (card) card.classList.toggle('hide', !z || G.mode !== 'play');
  };
  G.zoneEvent = function (z, text) {
    if (!z.ev) z.ev = [];
    z.ev.push({ g: G.W.gen, t: text });
    if (z.ev.length > 8) z.ev.splice(1, 1);      // keep the first (when it was dropped) and the latest
  };

  function picture(z) {
    if (z.svg) return '<img alt="" width="64" height="64" style="flex:none;border-radius:14px;background:rgba(7,18,31,.55);padding:4px" src="data:image/svg+xml;charset=utf-8,' + encodeURIComponent(z.svg) + '">';
    return '<div style="flex:none;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 40% 35%, ' + G.hsl(z.hue, 90, 80, 1) + ', ' + G.hsl(z.hue, 85, 50, 0.5) + ' 60%, transparent 72%)"></div>';
  }

  function render(z) {
    const p = z.p;
    const living = z.alive > 0.25;
    let bars = '';
    PROP.forEach(function (q) {
      const v = p[q[0]] || 0;
      if (Math.abs(v) < 0.06) return;
      const name = q[0] === 'heat' && v < 0 ? 'Cold' : q[0] === 'light' && v < 0 ? 'Darkness' : q[0] === 'pull' && v < 0 ? 'Pushes away' : q[1];
      const col = q[0] === 'heat' && v < 0 ? PAL.frost : q[0] === 'light' && v < 0 ? PAL.violet : q[2];
      bars += '<div style="display:flex;align-items:center;gap:8px;margin:3px 0"><span style="flex:0 0 66px;font-size:11px">' + name + '</span><div class="meter" style="flex:1;margin:0"><i style="width:' + Math.round(Math.abs(v) * 100) + '%;background:' + col + '"></i></div></div>';
    });
    const by = G.ai.labelOf(z.model);
    const facts = [];
    if (z.made) facts.push('It has grown <b>' + z.made + '</b> pieces of food; <b>' + (z.fed || 0) + '</b> were eaten.');
    if (z.hurt > 1) facts.push('It has drained <b>' + Math.round(z.hurt) + '</b> energy from creatures' + (z.deaths ? ', and <b>' + z.deaths + '</b> died in it' : '') + '.');
    else if (z.deaths) facts.push('<b>' + z.deaths + '</b> creatures died in it.');
    if (z.ate) facts.push('It has eaten <b>' + z.ate + '</b> creatures.');
    if (z.vis > 5) facts.push('Creatures have spent <b>' + Math.round(z.vis) + '</b> seconds inside it.');
    if (living) facts.push('It is alive: it grows in the light, shrinks when grazed, and spreads' + (z.kids ? ' (it has budded <b>' + z.kids + '</b> new patches)' : '') + '.');
    if (z.p.nut > 0.3) { const u = G.usedBy(z); facts.push('How well the pond uses it: <b>' + Math.round(u.eaten * 100) + '%</b> of its food gets eaten, and <b>' + Math.round(u.can * 100) + '%</b> of creatures can eat it.'); }
    if (G.isBad(z)) {
      const w = G.WEAK[z.weak]; let n = 0; const cre = G.W.cre;
      for (let i = 0; i < cre.length; i++) if (G.weakPower(cre[i], z.weak) > 0.2) n++;
      facts.push('<span style="color:var(--gold)">Its weakness: ' + w.text + '.</span> <b>' + (cre.length ? Math.round(100 * n / cre.length) : 0) + '%</b> of creatures carry them' + (z.hit > 0.02 ? ', and they have worn it down by <b>' + Math.round(Math.min(1, z.hit / 1.2) * 100) + '%</b>.' : '.'));
    }
    if (z.p.poison + z.p.acid + z.p.eats + (z.p.deadly || 0) > 0.25) { const a = G.adaptedTo(z); facts.push('The pond has adapted to it: <b>' + Math.round(a * 100) + '%</b>' + (a > 0.45 ? ' (they have learned to live with it).' : a > 0.2 ? ' (they are learning).' : ' (so far it still hurts).')); }
    if (!facts.length) facts.push('Nothing has happened to it yet.');
    const ev = (z.ev || []).map(function (e) { return '<div><small>g' + e.g + '</small> ' + esc(e.t) + '</div>'; }).join('');
    const lifeTxt = living ? 'Health' : 'Time left';
    card.innerHTML = '<div class="ihead">' + picture(z) + '<div><b>' + esc(z.word) + (living && z.genN > 1 ? ' <small>· generation ' + z.genN + '</small>' : '') + '</b><small>' + esc(z.note || '') + '</small>' + (by ? '<small style="color:var(--gold)">imagined by ' + esc(by) + '</small>' : '') + '</div><button class="x" id="zclose" aria-label="Close">' + G.ICON.close + '</button></div>' +
      '<div class="ilabel">What it does</div>' + (bars || '<small>Very little.</small>') +
      '<div class="ilabel">' + lifeTxt + '</div><div class="meter"><i id="zlife"></i></div>' +
      '<div class="ilabel">Its story</div><div class="log" style="height:auto;max-height:96px" id="zev">' + ev + '</div>' +
      '<div id="zfacts" style="font-size:11.5px;line-height:1.45;margin-top:6px">' + facts.join(' ') + '</div>';
    $('zclose').onclick = function () { G.selectZone(null); };
  }

  G.addSystem({
    name: 'things',
    init: function () {
      card = el('div', 'glass hide', '', $('ui')); card.id = 'zcard';
      G.on('zone-gone', function (z) { if (G.R.selZone === z) G.selectZone(null); });
      G.on('new-pond', function () { G.selectZone(null); });
      G.on('select', function (c) { if (c) G.selectZone(null); });
    },
    update: function () {
      const z = G.R.selZone;
      if (!z || G.mode !== 'play') return;
      const now = performance.now();
      if (shownId === z.id && now - last < 500) return;
      last = now;
      const sig = z.id;
      if (shownId !== sig) { shownId = sig; }
      render(z);
      const bar = $('zlife');
      const living = z.alive > 0.25;
      const f = living ? G.clamp((z.health || 0) / 1.6, 0, 1) : G.clamp(z.life / (z.life0 || 120), 0, 1);
      bar.style.width = Math.round(f * 100) + '%';
      bar.style.background = f > 0.5 ? PAL.algae : f > 0.2 ? PAL.gold : PAL.rose;
    },
  });

  // ── what a thing is doing right now, in one line: shown under it in the pond ──
  G.thingStatus = function (z) {
    const p = z.p, w = G.WEAK[z.weak].text, pct = function (v) { return Math.round(100 * G.clamp(v, 0, 1)) + '%'; };
    if (p.vault > 0.2) { const broken = 1 - z.life / (z.life0 || 420); return { t: 'locks food inside · ' + pct(broken) + ' broken' + (z.atk ? ' · ' + z.atk + ' breaking in' : ' · only ' + w + ' get through'), tone: 'bad', bar: 1 - broken }; }
    if (G.isBad(z)) {
      const does = p.deadly > 0.05 ? 'kills at a touch' : p.eats > 0.05 ? 'eats creatures' : p.poison > 0.05 ? 'poisons' : 'burns', taken = (z.deaths || 0) + (p.eats > 0.05 ? (z.ate || 0) : 0);
      return { t: does + (taken ? ' · ' + taken + ' taken' : '') + (z.hurtN ? ' · hurting ' + z.hurtN : '') + (z.atk ? ' · ' + z.atk + ' fighting back' : ' · weak to ' + w), tone: z.atk ? 'fight' : 'bad', bar: z.alive > 0.25 ? G.clamp(z.health, 0, 1) : G.clamp(z.life / (z.life0 || 120), 0, 1) };
    }
    if (p.nut > 0.2) { const u = G.usedBy ? G.usedBy(z) : null; return { t: 'feeds the pond' + (u ? ' · ' + pct(u.can) + ' can eat it' : '') + (z.near ? ' · ' + z.near + ' here' : ''), tone: 'good', bar: null }; }
    const what = Math.abs(p.heat) > 0.3 ? (p.heat > 0 ? 'warms the water' : 'chills the water') : Math.abs(p.light) > 0.3 ? (p.light > 0 ? 'lights the water' : 'darkens the water') : p.sticky > 0.3 ? 'slows what touches it' : p.pull ? (p.pull > 0 ? 'draws creatures in' : 'drives creatures away') : p.hard > 0.3 ? 'blocks the way' : 'drifts';
    return { t: what + (z.near ? ' · ' + z.near + ' here' : ''), tone: 'calm', bar: null };
  };
})();

<script data-part="versus">
// ── The pond versus the things you throw at it: you can SEE life learn to beat them ──
// Everything shown here is measured from the simulation: how many creatures carry the answer, how far they have
// evolved tolerance, how much of the thing is left. Nothing is staged.
(function () {
  'use strict';
  const PAL = G.PAL, el = G.el, $ = G.$, esc = G.escapeHtml;
  let box = null, last = 0, sig = '';

  /** the numbers for one bad thing */
  G.versus = function (z) {
    const cre = G.W.cre, w = z.weak;
    let carry = 0;
    for (let i = 0; i < cre.length; i++) if (G.weakPower(cre[i], w) > 0.2) carry++;
    const living = z.alive > 0.25;
    return {
      carry: cre.length ? carry / cre.length : 0,
      adapt: G.adaptedTo(z),
      left: living ? G.clamp(z.health / 1.6, 0, 1) : G.clamp(z.life / (z.life0 || 120), 0, 1),
      weak: G.WEAK[w].text,
    };
  };

  function bar(label, v, col) {
    return '<div style="display:flex;align-items:center;gap:6px;margin:3px 0"><span style="flex:0 0 108px;font-size:10.5px;color:rgba(207,232,255,.8)">' + label + '</span><div class="meter" style="flex:1;margin:0;height:6px"><i style="width:' + Math.round(v * 100) + '%;background:' + col + '"></i></div><b style="flex:0 0 30px;text-align:right;font-size:10.5px">' + Math.round(v * 100) + '%</b></div>';
  }

  function render() {
    const W = G.W;
    const bad = W.zones.filter(G.isBad).sort(function (a, b) { return a.born - b.born; });
    // one row per kind of thing (a spreading thing counts once, with all its patches)
    const kinds = {}; const order = [];
    bad.forEach(function (z) { const k = z.word.toLowerCase(); if (!kinds[k]) { kinds[k] = { z: z, n: 0, left: 0, ate: 0 }; order.push(k); } const v = G.versus(z); kinds[k].n++; kinds[k].left = Math.max(kinds[k].left, v.left); kinds[k].ate += (z.ate || 0) + (z.deaths || 0); });
    const s = order.join('|');
    if (!order.length) { if (!box.classList.contains('hide')) box.classList.add('hide'); sig = ''; return; }
    box.classList.remove('hide');
    let html = '<div class="ilabel" style="margin:0 0 4px;color:var(--gold)">THE POND VERSUS</div>';
    order.slice(0, 2).forEach(function (k) {
      const q = kinds[k], z = q.z, v = G.versus(z);
      const lock = z.p.vault > 0.2 ? 'It locks the food away. ' : z.p.deadly > 0.3 ? 'It kills with one touch. ' : '';
      const mood = lock + (v.carry > 0.5 ? 'They have the answer: <b>' + v.weak + '</b>.' : v.carry > 0.15 ? 'They are learning: <b>' + v.weak + '</b> hurt it.' : 'It is weak to <b>' + v.weak + '</b>. Few have them yet.');
      html += '<div data-z="' + z.id + '" style="cursor:pointer;padding:6px 0 4px;border-top:1px solid rgba(207,232,255,.12)"><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:12.5px">' + esc(z.word) + (q.n > 1 ? ' <small>×' + q.n + '</small>' : '') + '</b><small>' + (q.ate ? 'it has killed ' + q.ate : 'since gen ' + z.born) + '</small></div>' +
        '<div style="font-size:11px;margin:2px 0 3px;color:rgba(207,232,255,.85)">' + mood + '</div>' +
        bar('carry ' + v.weak, v.carry, PAL.algae) + (z.p.vault > 0.2 ? '' : bar('learned to bear it', v.adapt, PAL.gold)) + bar('its strength', q.left, PAL.rose) + '</div>';
    });
    box.innerHTML = html;
    const rows = box.querySelectorAll('[data-z]');
    for (let i = 0; i < rows.length; i++) rows[i].onclick = function () { const id = +this.dataset.z; const z = G.W.zones.filter(function (q) { return q.id === id; })[0]; if (z) { G.select(null); G.selectZone(z); } };
    sig = s;
  }

  // milestones: the moments worth shouting about
  G.versusMilestones = function () {
    const W = G.W;
    for (let i = 0; i < W.zones.length; i++) {
      const z = W.zones[i];
      if (!G.isBad(z) || z.age < 30) continue;
      const v = G.versus(z), k = z.word.toLowerCase();
      if (v.carry > 0.25) G.discover('vs25' + k, 'They are learning! A quarter of the pond now carries ' + v.weak + ', the weakness of ' + z.word + '.');
      if (v.carry > 0.55) G.discover('vs55' + k, 'Most of the pond now carries ' + v.weak + '. ' + z.word + ' is in trouble.');
    }
  };

  G.addSystem({
    name: 'versus',
    init: function () {
      box = el('div', 'glass hide', '', $('ui')); box.id = 'versus';
      G.on('zone-killed', function (z) {
        if (G.mode !== 'play') return;
        G.R.shake = 0.5; G.R.flash = 0.8; G.R.flashCol = PAL.gold;
        G.R.ring(z.x, z.y, PAL.gold, z.r0 * 2.2, 1.6); G.R.ring(z.x, z.y, PAL.algae, z.r0 * 1.5, 1.2); G.R.sparkle(z.x, z.y, PAL.gold, 40, 160);
        G.sfx('discovery');
      });
      G.on('zone', function (z) { if (G.mode === 'play' && G.isBad(z) && !z.genNote && z.genN === 1) G.hint('vs' + z.id, z.word + ' is dangerous. Watch THE POND VERSUS (left): life will look for its weakness.', 9000); });
    },
    update: function () {
      if (G.mode !== 'play' || !G.W) return;
      const now = performance.now();
      if (now - last < 600) return;
      last = now;
      render();
    },
  });
})();

  function drawSpeciesTree(cv, note) {
    const W = G.W, ctx = cv.getContext('2d'), w = cv.width, h = cv.height;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, w, h);
    const list = W.species.slice().sort(function (a, b) { return a.born - b.born || a.id - b.id; });
    if (list.length < 2) { note.textContent = 'The tree grows as species split apart. Give it a few generations.'; return; }
    const g0 = 1, g1 = Math.max(W.gen, 2), pad = 40;
    const X = function (g) { return pad + (w - pad * 2) * (g - g0) / (g1 - g0); };
    const lane = {};
    list.forEach(function (s, i) { lane[s.id] = i; });
    const lh = Math.min(26, (h - pad * 2) / list.length);
    const Y = function (id) { return pad + lh * lane[id] + lh / 2; };
    list.forEach(function (s) {
      const col = G.hsl(s.hue, 75, 65, 1);
      const end = s.extinct ? s.diedGen : g1;
      const y = Y(s.id);
      if (s.parent && lane[s.parent] !== undefined) {
        ctx.strokeStyle = G.rgba(PAL.frost, 0.25); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(X(s.born), Y(s.parent)); ctx.bezierCurveTo(X(s.born), y, X(s.born) + 8, y, X(s.born) + 14, y); ctx.stroke();
      }
      ctx.strokeStyle = col; ctx.globalAlpha = s.extinct ? 0.5 : 0.95; ctx.lineCap = 'round';
      const hist = s.hist || [];
      for (let k = 0; k < hist.length; k++) {
        const gen = Math.max(s.born, g1 - hist.length + 1 + k), gx = X(gen);
        ctx.lineWidth = Math.max(2, Math.min(lh * 0.8, Math.sqrt(hist[k]) * 1.2));
        ctx.beginPath(); ctx.moveTo(gx, y); ctx.lineTo(X(Math.min(g1, gen + 1)), y); ctx.stroke();
      }
      ctx.globalAlpha = 1;
      if (s.extinct) { ctx.fillStyle = G.rgba(PAL.rose, 0.8); ctx.beginPath(); ctx.arc(X(end), y, 4, 0, 6.2832); ctx.fill(); }
      if (lh >= 14) { ctx.fillStyle = G.rgba(PAL.frost, 0.85); ctx.font = '14px system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.fillText(s.name, X(s.born) + 16, y - lh * 0.3 - 1); }
    });
    ctx.fillStyle = G.rgba(PAL.frost, 0.5); ctx.font = '16px system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.fillText('gen 1', 6, h - 8);
    ctx.textAlign = 'right'; ctx.fillText('gen ' + g1, w - 6, h - 8);
    note.textContent = 'Every line is a species through time. Thicker means more creatures. A pink dot is where it died out.';
  }

    G.emit('begin');
    // the pond went on living while the game was closed
    if (sv && sv.at) G.startCatchUp((Date.now() - sv.at) / 1000);
    // the server already lived the time for us: show what it found
    if (sv && G.pendingReport) { const r = G.pendingReport; G.pendingReport = null; setTimeout(function () { G.showAwayReport(r); }, 400); }
  };

  // ── keys ──
  G.on('key', function (k, e) {
    if (G.mode === 'title') {
      if (k === 'Enter' || k === ' ') { if (!UI.menuOpen) G.beginGame(); }
      if (k === 'm') { if (window.PXS && PXS.toggleMute) PXS.toggleMute(); }
      if (k === 'Escape' && UI.menuOpen) G.closeMenu();
      return;
    }
    if (G.mode !== 'play') return;
    if (k === 'm') { if (window.PXS && PXS.toggleMute) PXS.toggleMute(); return; }
    if (k === 'Escape') {
      if (UI.menuOpen) G.closeMenu();
      else if (UI.modal && UI.modal !== 'still') closeModal();
      else if (UI.placing || UI.meteor) G.cancelPlacing();
      else if (UI.popName) G.closePop();
      else if (G.R.sel) G.select(null);
      else G.openMenu();
      return;
    }
    if (UI.menuOpen || (UI.modal && UI.modal !== 'still')) {
      if ((k === 'f' && UI.modal === 'guide') || (k === 'g' && UI.modal === 'tree')) closeModal();
      return;
    }
    if (UI.modal) return;
    if (k === ' ') G.togglePause();
    else if (k === '1') G.setSpeed(1);
    else if (k === '2') G.setSpeed(4);
    else if (k === '3') G.setSpeed(16);
    else if (k === '4') G.setSpeed(64);
    else if (k === '=' || k === '+') G.zoomAt(1.35);
    else if (k === '-') G.zoomAt(1 / 1.35);
    else if (k === '0') { G.cam.z = 1; G.applyCam(); }
    else if (k === 't') G.act('add');
    else if (k === 'f') G.act('guide');
    else if (k === 'g') G.act('tree');
    else if (k === 'n') G.act('new');
  });
  G.on('escape', function () { if (G.mode === 'play' && UI.popName) G.closePop(); });
  G.on('speed', function () { if (UI.popName === 'speed') G.closePop(); });
})();
